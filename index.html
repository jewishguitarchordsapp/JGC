  :root{
    --teal:#4a9b9b; --teal-dark:#3d8484; --bg:#f5f6f7; --card:#ffffff;
    --border:#e2e5e8; --text:#222; --muted:#666; --chord:#c0392b; --accent:#2e7d7d;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--teal);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;margin:0;white-space:nowrap;}
  nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav button{background:transparent;border:none;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px;}
  nav button.active{background:rgba(255,255,255,0.25);font-weight:600;}
  nav button:hover{background:rgba(255,255,255,0.15);}
  .spacer{flex:1;}
  .userbox{display:flex;align-items:center;gap:8px;}
  .userbox img{width:26px;height:26px;border-radius:50%;}
  .userbox .name{font-size:13px;}
  #signoutBtn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;}
  #gsiButtonContainer{line-height:0;}
  main{max-width:920px;margin:0 auto;padding:18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;}
  .searchRow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{
    font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);
  }
  .searchRow input[type=text]{flex:1;min-width:160px;}
  select{cursor:pointer;}
  .btn{background:var(--teal);color:#fff;border:none;padding:9px 14px;border-radius:7px;cursor:pointer;font-size:14px;}
  .btn:hover{background:var(--teal-dark);}
  .btn.secondary{background:#fff;color:var(--teal-dark);border:1px solid var(--teal);}
  .btn.danger{background:#fff;color:#b33;border:1px solid #d99;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .subtabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .subtabs button{background:none;border:none;padding:9px 14px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;}
  .subtabs button svg{width:15px;height:15px;stroke:currentColor;flex:0 0 auto;}
  .subtabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
  /* Songs-list New/All/Favorites/Known tabs: icon stacked above the label,
     and the 4 tabs always share the row's full width (no horizontal
     scrolling), unlike the plain text .subtabs used elsewhere (admin nav,
     Simple/Advanced, LTR/RTL, Left/Right toggles). */
  .subtabs.song-tabs{overflow-x:visible;}
  .subtabs.song-tabs button{flex-direction:column;justify-content:flex-start;gap:5px;flex:1 1 0;min-width:0;white-space:normal;text-align:center;font-size:13px;padding:9px 4px;}
  .subtabs.song-tabs button svg{width:18px;height:18px;}
  .song-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border:none;border-bottom:1px solid var(--border);border-radius:0;margin-bottom:0;cursor:pointer;}
  .song-row:hover{background:#f7f9f9;}
  .song-row .title{font-weight:600;}
  .song-row .artist{color:var(--muted);font-size:13px;}
  .song-row .star{color:#ccc;cursor:pointer;padding:8px 10px;margin:-8px -10px;display:inline-flex;align-items:center;justify-content:center;}
  .song-row .star svg{width:25px;height:23px;display:block;}
  /* Drag-to-reorder handle (Playlist detail / unfiltered Favorites tab —
     see makeReorderable in index.html). touch-action:none stops mobile
     Safari/Chrome from treating the drag as a page-scroll gesture. */
  .drag-handle{color:var(--muted);cursor:grab;touch-action:none;display:inline-flex;align-items:center;justify-content:center;padding:8px 6px;margin:-8px 0 -8px -6px;flex:none;}
  .drag-handle svg{width:20px;height:20px;display:block;}
  .song-row.dragging{opacity:0.6;background:#f0f4ff;}
  .song-row .star.on{color:#d9302f;}
  .new-badge{display:inline-flex;align-items:center;gap:3px;background:#e8f5e9;color:#2e7d32;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;margin-bottom:3px;letter-spacing:.3px;white-space:nowrap;}
  .new-badge-age{font-weight:500;opacity:.85;}
  /* Persistent "you're offline" banner — see setOffline/renderOfflineBanner. */
  .offline-banner{position:sticky;top:0;z-index:500;background:#fff3cd;color:#7a5b00;border-bottom:1px solid #f0d98c;padding:9px 14px;font-size:13px;text-align:center;}
  .offline-toggle-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chip{display:inline-block;background:#eef4f4;color:var(--accent);border-radius:20px;padding:5px 12px;font-size:13px;margin:3px;cursor:pointer;border:1px solid #d7e6e6;}
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .chip.icon-chip{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;}
  .chip.icon-chip svg{width:16px;height:16px;stroke:currentColor;}
  .chip.toggle-on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chip .count{opacity:0.7;font-size:11px;}
  .grid-cats{display:flex;flex-wrap:wrap;gap:4px;}
  h2{margin-top:0;}
  .muted{color:var(--muted);font-size:13px;}
  .backlink{cursor:pointer;color:var(--accent);font-size:14px;margin-bottom:10px;display:inline-block;}
  .song-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;}
  .song-header .meta{color:var(--muted);font-size:14px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center;}
  /* Speed control pill next to the Play button (playback-row) - styled to
     match the Advanced panel's .stepper-btn look (white rounded-square
     buttons with a thin border and a hover state) instead of the bare,
     unstyled default browser buttons these were rendering as: the
     ".toolbar" ancestor these rules used to require doesn't exist anywhere
     in the markup, so they never actually applied. */
  .group{display:flex;align-items:center;gap:3px;background:#f0f2f3;border-radius:8px;padding:3px;}
  .group button.icon{width:26px;height:26px;border-radius:6px;background:#fff;border:1px solid #d7dcdd;font-size:15px;font-weight:700;line-height:1;padding:0;cursor:pointer;color:var(--teal-dark);display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .group button.icon:hover{background:#eef4f4;}
  .group span{font-size:13px;font-weight:600;color:var(--text);min-width:32px;text-align:center;}
  /* Song detail page redesign: capo-status tiles, the 4-across action row
     (Favorite/+Playlist/Report/Print), the simplified playback row and its
     collapsible Advanced panel (font size, bold, show/hide chords, capo,
     transpose) — see renderDetail(). */
  .detail-tiles-row{display:flex;gap:8px;margin:10px 0;}
  .detail-tile{flex:1;min-width:0;background:#f2f4f5;border:1px solid var(--border);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;}
  .detail-tile .tile-value{font-size:17px;font-weight:700;color:var(--text);}
  .detail-tile .tile-label{font-size:11px;color:var(--muted);}
  .detail-tile.action{cursor:pointer;padding:11px 4px;}
  .detail-tile.action svg{width:18px;height:18px;color:var(--teal-dark);}
  .detail-tile.action img{width:17px;height:17px;}
  .detail-tile.action .tile-label{font-size:10.5px;color:#333;}
  .detail-tile.action.active{background:#fdeceb;border-color:#f3c9c6;}
  .detail-tile.action.active svg{color:#d9302f;}
  .chords-used-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:10px 0;}
  .chords-used-row .set-known-link{font-size:12.5px;color:var(--accent);white-space:nowrap;cursor:pointer;margin-top:3px;}
  .playback-row{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .play-btn{width:34px;height:34px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;border:none;color:#fff;font-size:13px;}
  .adv-toggle{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--teal-dark);font-weight:600;cursor:pointer;margin-left:auto;background:none;border:none;padding:4px;}
  .adv-chevron{display:inline-block;transition:transform .15s;}
  .adv-chevron.open{transform:rotate(90deg);}
  .advanced-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:2px 12px;margin:0 0 10px;}
  .adv-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef0f1;flex-wrap:wrap;gap:8px;}
  .adv-row:last-child{border-bottom:none;}
  .adv-row .adv-label{font-size:13.5px;}
  .adv-row .adv-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .stepper-btn{width:28px;height:28px;border-radius:7px;border:1px solid #d7dcdd;background:#fff;color:var(--teal-dark);font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .stepper-btn:hover{background:#eef4f4;}
  .stepper-btn.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .stepper-btn svg{width:16px;height:16px;display:block;}
  .icon-btn-round svg{width:18px;height:18px;display:block;}
  .adv-link{font-size:11.5px;color:var(--accent);cursor:pointer;}
  .switch-toggle{width:38px;height:22px;border-radius:11px;position:relative;cursor:pointer;flex:none;}
  .switch-toggle .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;box-shadow:0 1px 2px rgba(0,0,0,0.25);transition:left .15s;}
  #chartScroll{max-height:60vh;overflow-y:auto;overflow-x:auto;padding:8px 4px 40px;background:#fff;border:1px solid var(--border);border-radius:9px;}
  #chartScroll.hide-chords .chord{display:none;}
  #chartScroll.hide-chords .html-chord-row{display:none;}
  /* "Play Mode": pressing Play expands the chart to most of the screen and
     replaces the normal playback row with a small floating, draggable strip
     (play/pause + speed) so it can be moved out of the way while playing. */
  #chartScroll.chart-playing{max-height:78vh;}
  .play-float-bar{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:40;background:#fff;border:1px solid var(--border);border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,0.22);padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:10px;touch-action:none;user-select:none;}
  .play-float-bar .drag-handle{cursor:grab;color:var(--muted);display:flex;align-items:center;justify-content:center;width:34px;height:22px;flex:none;touch-action:none;}
  .play-float-bar .drag-handle:active{cursor:grabbing;}
  .play-float-bar .drag-handle svg{width:16px;height:16px;display:block;transform:rotate(90deg);}
  .play-float-bar .play-btn{flex:none;}
  .play-float-bar .stop-btn{background:#8a9096;font-size:11px;}
  .play-float-bar .speed-group{display:flex;flex-direction:column;align-items:center;gap:6px;background:#f0f2f3;border-radius:14px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;}
  .play-float-bar .speed-group button{width:24px;height:24px;border-radius:50%;border:none;background:#fff;color:var(--teal-dark);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;flex:none;}
  .chord-line{position:relative;line-height:2.7em;font-size:calc(17px + var(--chart-step,0px));font-weight:var(--chart-fw,400);padding:0 6px;unicode-bidi:plaintext;white-space:nowrap;}
  .cw{position:relative;display:inline-block;white-space:pre;}
  .chord{position:absolute;inset-inline-start:0;top:-1.2em;color:var(--chord);font-weight:700;font-size:0.78em;white-space:nowrap;}
  /* "Chords in song" row: always exactly one line, no horizontal scroll -
     see fitChordsUsedChips(). --cu-scale shrinks the chip font/padding/
     margin together so more chords fit before anything gets clipped;
     JS measures overflow and dials it down only as far as actually needed. */
  .chords-used{margin:10px 0;display:flex;align-items:baseline;gap:6px;min-width:0;flex:1;--cu-scale:1;}
  .chords-used-label{white-space:nowrap;flex:none;}
  .chords-used-chips{white-space:nowrap;overflow:hidden;min-width:0;flex:1;}
  .chords-used-chips .muted{white-space:nowrap;}
  .chords-used .chip{display:inline-block;background:#fff;border-color:var(--border);color:var(--chord);font-weight:600;cursor:default;white-space:nowrap;
    font-size:calc(13px * var(--cu-scale));
    padding:calc(5px * var(--cu-scale)) calc(12px * var(--cu-scale));
    margin:calc(3px * var(--cu-scale)) calc(1.5px * var(--cu-scale));
  }
  .yt-wrap{position:relative;padding-bottom:56.25%;height:0;margin:16px 0;border-radius:8px;overflow:hidden;}
  .yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;}
  form .row{display:flex;gap:12px;flex-wrap:wrap;}
  form .row > div{flex:1;min-width:180px;}
  textarea{width:100%;min-height:160px;font-family:'Courier New',monospace;}
  .preview-box{margin-top:8px;}
  .status{font-size:13px;color:var(--muted);margin-top:6px;}
  .error{color:#b33;font-size:13px;margin-top:6px;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--border);}
  table td{padding:8px 6px;border-bottom:1px solid var(--border);}
  .viewas-banner{background:#fff3cd;color:#7a5c00;padding:9px 16px;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #f0d888;}
  .viewas-banner .btn{padding:4px 10px;font-size:12px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600;}
  .badge.pending{background:#fdf3d0;color:#8a6d00;}
  .badge.added{background:#dcf3e3;color:#1a7a3d;}
  .badge.declined{background:#fbe0e0;color:#a33;}
  .badge.open{background:#fbe0e0;color:#a33;}
  .badge.resolved{background:#dcf3e3;color:#1a7a3d;}
  .badge.archived{background:#eceff0;color:#666;}
  /* Icon-only status/archive controls for the Admin Error Reports and Song
     Requests grids (replacing plain-word "Open"/"Resolved" text and
     "Archive"/"Mark added"/"Decline" text buttons) — a borderless round
     button so it reads as an icon, not a boxed button; color communicates
     state the same way the .badge classes above do, title carries the word
     for hover/screen readers. */
  .status-icon-btn{background:none;border:none;padding:5px;margin:0;cursor:pointer;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .status-icon-btn svg{width:19px;height:19px;display:block;}
  .status-icon-btn:hover{background:#eceff0;}
  .status-icon-btn.open{color:#a33;}
  .status-icon-btn.resolved,.status-icon-btn.added{color:#1a7a3d;}
  .status-icon-btn.declined{color:#a33;}
  .status-icon-btn.archive-action{color:#666;}
  .admin-grid-icons{display:flex;gap:4px;align-items:center;}
  .tab-badge{display:inline-block;min-width:16px;height:16px;padding:0 5px;border-radius:9px;background:#d93a3a;color:#fff;font-size:10.5px;font-weight:700;line-height:16px;text-align:center;vertical-align:2px;}
  .tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d93a3a;margin-inline-end:6px;vertical-align:1px;}
  .admin-filter-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .admin-filter-row select{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;}
  /* Playlist cards laid out as a responsive grid rather than a stacked
     list — "My Playlists"/"Shared with me" use the larger tile size (fewer,
     more prominent cards), "Public Playlists" uses the smaller size so more
     fit per row. */
  .playlist-grid{display:grid;gap:14px;margin-bottom:22px;}
  .playlist-grid.size-lg{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
  .playlist-grid.size-sm{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));}
  .playlist-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;}
  .playlist-card:hover{border-color:var(--teal);}
  .playlist-card .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .playlist-grid.size-sm .playlist-card{padding:10px;gap:3px;}
  .playlist-grid.size-sm .playlist-card .title{font-size:13px;}
  .playlist-grid.size-sm .playlist-card .muted{font-size:11px;line-height:1.4;}
  .playlist-icon-badge{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .playlist-icon-badge svg{width:56%;height:56%;display:block;}
  .playlist-grid.size-sm .playlist-icon-badge{margin-bottom:2px;}
  .icon-picker{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;}
  .icon-picker .playlist-icon-badge{cursor:pointer;border:2px solid transparent;box-sizing:content-box;}
  .icon-picker .playlist-icon-badge.selected{border-color:var(--text);}
  /* A visible border (not just a background tint) so the "Message Admin"
     card reads as its own separate, self-contained thing on the Contact
     page rather than blending into the requests table above it. */
  .chat-card{display:flex;align-items:center;gap:12px;background:#f2f4f5;border:1.5px solid var(--teal);border-radius:12px;padding:14px 16px;margin-top:24px;cursor:pointer;transition:background .15s ease;}
  .chat-card:hover{background:#e9edee;}
  .chat-card-icon{flex:none;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;}
  .chat-card-icon svg{width:18px;height:18px;display:block;}
  .chat-card-text{flex:1;min-width:0;}
  .chat-card-title{font-weight:700;font-size:16px;color:#181a1b;}
  .chat-card-preview{color:var(--muted);font-size:13.5px;margin-top:2px;}
  .chat-card-arrow{color:var(--muted);font-size:18px;flex:0 0 auto;}
  .chat-thread{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:6px;margin-bottom:10px;}
  .msg{max-width:75%;padding:8px 12px;border-radius:12px;font-size:14px;}
  .msg.user{align-self:flex-start;background:#eef2f2;}
  .msg.admin{align-self:flex-end;background:var(--teal);color:#fff;}
  .msg .meta{font-size:11px;opacity:0.7;margin-top:3px;}
  .thread-list-item{padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;}
  .thread-list-item.active{border-color:var(--teal);background:#eef4f4;}
  .signin-gate{text-align:center;padding:30px;color:var(--muted);}
  /* Scoped to #mainNav (the desktop top nav) specifically, not just "nav" —
     the mobile bottom tab bar is also a <nav> (#bottomNav.bottom-nav), and
     this margin-right (meant to space an inline icon from its label) was
     leaking onto its icons too, pushing them off-center within their
     otherwise-centered 30px icon box. */
  #mainNav button img{width:15px;height:15px;vertical-align:middle;margin-right:5px;opacity:0.9;}
  #mainNav button svg{width:17px;height:17px;vertical-align:-3px;margin-right:5px;stroke:#fff;}
  .fav-btn svg{width:15px;height:14px;vertical-align:-2px;margin-right:5px;}
  .html-chord-row{position:relative;height:1.35em;font-family:"CustomCourier",'Courier New',monospace;color:var(--chord);font-weight:700;white-space:pre;line-height:1.35;font-size:calc(14px + var(--chart-step,0px));}
  .html-lyric-row{font-family:"CustomCourier",'Courier New',monospace;white-space:pre;line-height:1.35;font-size:calc(14px + var(--chart-step,0px));font-weight:var(--chart-fw,400);margin-bottom:5px;}
  .title-hebrew{color:var(--muted);font-size:13px;direction:rtl;}
  .home-tile{display:flex;align-items:flex-start;gap:14px;background:#f2f4f5;border:1px solid rgba(0,0,0,.10);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:background .15s ease;}
  .home-tile:hover{background:#e9edee;}
  .home-tile:active{background:#e1e6e7;}
  .home-tile-icon{flex:0 0 auto;width:52px;height:52px;display:flex;align-items:center;justify-content:center;}
  .home-tile-icon svg{width:26px;height:26px;stroke:var(--teal);}
  .home-tile-title{font-weight:700;font-size:16px;color:#181a1b;}
  .home-tile-desc{color:var(--muted);font-size:13.5px;margin-top:2px;line-height:1.4;}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-card{background:var(--card);border-radius:12px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.25);}
  .modal-card h2{margin-top:0;}
  .modal-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap;}
  /* Print preview: a full-screen overlay (not the small .modal-card, which
     is too narrow for a page-shaped preview) showing exactly what "Print"
     will produce, with its own font/columns/capo/transpose controls above
     it. The @media print block below hides everything else on the page and
     the toolbar itself (.no-print), so printing this overlay prints only
     the title/artist/capo header + chart - never the app chrome around it. */
  .print-preview-overlay{position:fixed;inset:0;background:#54605f;z-index:110;overflow-y:auto;}
  .print-preview-toolbar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;z-index:1;}
  .ppt-row{display:flex;align-items:center;gap:6px;}
  .ppt-label{font-size:12.5px;color:var(--muted);font-weight:600;}
  .ppt-val{width:26px;text-align:center;font-size:13px;color:#444;}
  .print-page-wrap{display:flex;justify-content:center;padding:22px 14px 60px;}
  .print-page{background:#fff;width:100%;max-width:800px;padding:28px 32px;box-shadow:0 6px 24px rgba(0,0,0,0.3);border-radius:4px;}
  .print-header{border-bottom:2px solid #222;padding-bottom:10px;margin-bottom:14px;}
  .print-title{font-size:22px;font-weight:800;color:#111;}
  .print-title-hebrew{font-size:17px;color:#444;font-weight:600;}
  .print-meta{font-size:14px;color:#444;margin-top:3px;}
  .print-columns.cols-2{column-count:2;column-gap:28px;column-rule:1px solid #ddd;}
  .print-line-group{break-inside:avoid-column;}
  /* Fixes the printed page size/margins, which otherwise fall back to
     whatever the browser/OS print dialog defaults to (varies by browser,
     often not plain 8.5x11 with even margins) - pins it to US Letter with
     a consistent 0.75in margin on all four sides regardless of what
     printer or browser this runs on. The content itself needs no extra
     padding to compensate (see .print-page below, padding:0 !important) -
     @page's margin already reserves that space around the printable area. */
  @page {
    size: 8.5in 11in;
    margin: 0.75in;
  }
  @media print {
    body > *:not(.print-preview-overlay){display:none !important;}
    .print-preview-overlay{position:static !important;background:none !important;overflow:visible !important;}
    .no-print{display:none !important;}
    .print-page-wrap{padding:0 !important;display:block !important;}
    .print-page{box-shadow:none !important;border:none !important;max-width:none !important;width:auto !important;padding:0 !important;border-radius:0 !important;}
  }
  /* Mobile-only chrome: a hamburger (opens sign-in info in a drawer) and a
     fixed bottom tab bar, replacing the desktop top nav + inline user box on
     small screens. Hidden here, switched on inside the mobile media query
     below, so desktop layout is completely unaffected. */
  .hamburger-btn{display:none;background:transparent;border:none;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:2px 8px;}
  .bottom-nav{display:none;}
  .mobile-drawer{display:none;}
  .mobile-drawer.open{display:block;position:fixed;inset:0;z-index:30;}
  .mobile-drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.4);}
  .mobile-drawer-panel{position:absolute;top:0;left:0;bottom:0;width:78%;max-width:300px;background:#fff;padding:20px 16px;box-shadow:2px 0 12px rgba(0,0,0,0.2);overflow-y:auto;}
  .mobile-drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);float:inline-end;padding:4px;}
  .mobile-drawer .userbox{clear:both;flex-direction:column;align-items:flex-start;gap:10px;}
  .mobile-drawer .userbox img{width:40px;height:40px;border-radius:50%;}
  /* Tuner menu item at the top of the hamburger drawer - the only place
     Tuner lives on mobile (no bottom-tab/top-nav entry, see navTabs()). */
  .mobile-drawer-nav{display:flex;flex-direction:column;gap:2px;margin:8px 0 16px;border-bottom:1px solid var(--border);padding-bottom:12px;}
  .mobile-drawer-nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:10px 6px;border-radius:8px;font-size:15px;color:var(--text);cursor:pointer;}
  .mobile-drawer-nav button:active{background:#f2f4f5;}
  .mobile-drawer-nav-icon{display:inline-flex;width:20px;height:20px;color:var(--teal);}
  .mobile-drawer-nav-icon svg{width:100%;height:100%;}
  /* Custom "install this app" banner — shown for a real install prompt on
     Android/Chrome, or manual Share-sheet instructions on iOS (Safari never
     fires beforeinstallprompt, so there's no programmatic install there). */
  .install-banner{display:none;}
  .install-banner.show{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;background:#eef4f4;color:var(--accent);padding:10px 16px;font-size:13.5px;border-bottom:1px solid #d7e6e6;}
  .install-banner .btn{padding:5px 12px;font-size:12.5px;}
  .install-banner-close{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;}
  /* Chord-diagram popover - a small fretboard picture shown when a chord
     symbol in a chart is moused over (desktop) or tapped (touch). See the
     CHORD DIAGRAMS block in the script for how chord-tap/data-chord get
     attached to each chord symbol and how the popover itself is built. */
  .chord-tap{cursor:pointer;}
  .chord-diagram-popover{position:fixed;z-index:70;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:8px 10px 6px;pointer-events:none;max-width:150px;}
  .chord-diagram-pop{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .chord-diagram-name{font-weight:700;font-size:13px;color:var(--text);}
  .chord-diagram-note{font-size:10px;color:var(--muted);text-align:center;max-width:130px;line-height:1.3;margin-top:2px;}
  /* Guitar Tuner page */
  .tuner-card{padding:20px 10px;border-radius:12px;background:#f2f4f5;border:2px solid var(--border);transition:border-color .2s ease,background .2s ease;}
  .tuner-card.in-tune{border-color:#2e7d32;background:#eaf6ec;}
  .tuner-card.flat,.tuner-card.sharp{border-color:#c0392b;background:#faeceb;}
  .tuner-note{font-size:56px;font-weight:800;color:var(--text);line-height:1;}
  .tuner-meter{margin:14px auto 0;width:200px;}
  .tuner-meter-track{position:relative;height:10px;background:linear-gradient(90deg,#c0392b,#2e7d32 45%,#2e7d32 55%,#c0392b);border-radius:6px;}
  .tuner-needle{position:absolute;top:-10px;left:50%;width:2px;height:28px;background:#222;transform-origin:bottom center;transform:rotate(0deg);transition:transform .1s linear;}
  .tuner-strings{display:flex;justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .tuner-string-chip{width:44px;height:44px;border-radius:50%;background:#eef1f2;border:2px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--text);}
  .tuner-string-chip.closest{background:var(--teal);border-color:var(--teal-dark);color:#fff;}
  @media (max-width:640px){
    header{padding:10px 12px;gap:8px;}
    header h1{font-size:15px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;margin:0;white-space:nowrap;}
    nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    nav button{flex:0 0 auto;padding:7px 9px;font-size:12.5px;}
    #mainNav button svg{width:15px;height:15px;margin-right:4px;}
    .subtabs button{padding:8px 9px;font-size:12px;gap:4px;}
    .subtabs button svg{width:13px;height:13px;}
    .subtabs.song-tabs button{padding:7px 2px;font-size:10.5px;gap:3px;}
    .subtabs.song-tabs button svg{width:17px;height:17px;}
    main{padding:12px;padding-bottom:78px;}
    .card{padding:12px;}
    .home-tile{padding:13px 14px;gap:11px;}
    .home-tile-icon{width:44px;height:44px;}
    .home-tile-icon svg{width:22px;height:22px;}
    .home-tile-title{font-size:15px;}
    form .row > div{min-width:100%;}
    table{font-size:12.5px;}
    .song-row{padding:11px 12px;}
    .btn{padding:10px 14px;}
    /* Bottom tab bar replaces the top nav row + inline user box; a hamburger
       (left of the title) opens the same sign-in info in a slide-out drawer. */
    .hamburger-btn{display:inline-flex;align-items:center;}
    nav#mainNav{display:none;}
    #userArea{display:none;}
    #shareBtn{display:none;}
    #tunerBtn{display:none;}
    footer{padding-bottom:80px;}
    .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--teal);border-top:none;z-index:20;padding:6px 2px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;}
    .bottom-nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,0.85);font-size:10.5px;padding:4px 2px;flex:1;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;border-radius:10px;}
    .bottom-nav button .nav-icon-wrap{width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin-bottom:1px;}
    .bottom-nav button .nav-icon-wrap svg{width:18px;height:18px;stroke:#fff;display:block;}
    /* Labels like "Categories"/"Playlists" can wrap to two lines on a narrow
       phone; without this, the wrapped lines default to left-aligned text,
       which reads as off-center under the icon above them. */
    .bottom-nav button span:last-child{text-align:center;line-height:1.15;}
    /* The selected-tab highlight now covers the whole button (icon + label
       together) instead of just the icon's own little box — a highlight
       bounding only the icon read as a separate floating container behind
       it. -webkit-tap-highlight-color above also stops the browser's own
       default tap-flash rectangle from doing the same thing on a press. */
    .bottom-nav button.active{color:#fff;font-weight:600;background:rgba(255,255,255,0.15);}
  }
</style>
</head>

    // `songs` on every subsequent refresh (see its own comment) - measured,

    // JSON.stringify that whole thing, synchronously, on the main thread,
    // every single time a refresh landed (every write, every periodic
    // auto-refresh) - a real, repeated, multi-MB stringify that's a
    // plausible contributor to the browser/machine slowdowns and crashes
    // reported testing this. The instant-repaint-on-reload this cache
    // exists for only ever needed the lightweight fields anyway - full-text
    // search still works fine, it just does one fresh listContent fetch the
    // first time it's used per page load, same as a first-time visitor.

// All four helpers take an optional trailing `size` (defaults to PAGE_SIZE)
// so a page that wants a different page size — e.g. the Contact page's "My
// Song Requests" list at 10/page — can reuse the same pagination logic
// instead of duplicating it.
function pageCount(total, size) { size = size || PAGE_SIZE; return Math.max(1, Math.ceil(total / size)); }
function clampPage(page, total, size) { size = size || PAGE_SIZE; return Math.max(0, Math.min(page, pageCount(total, size) - 1)); }
function pageSlice(list, page, size) { size = size || PAGE_SIZE; const p = clampPage(page, list.length, size); return list.slice(p * size, p * size + size); }
function pagerHtml(total, page, changeFn, size) {
  size = size || PAGE_SIZE;
  const pc = pageCount(total, size);
  if (pc <= 1) return '';
  const p = clampPage(page, total, size);
  return `<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0;">
    <button class="btn secondary" ${p<=0?'disabled':''} onclick="${changeFn}(${p-1})">‹ Prev</button>
    <span class="muted">Page ${p+1} of ${pc}</span>
    <button class="btn secondary" ${p>=pc-1?'disabled':''} onclick="${changeFn}(${p+1})">Next ›</button>
  </div>`;
}

/* ============================================================
   GOOGLE SIGN-IN
   ============================================================ */
function decodeJwt(token) {
  try {
    const payload = token.split('.')[1];
    const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  } catch (e) { return {}; }
}

// See the STATE comment above: this is what lets a reload (including a
// mobile pull-to-refresh) restore the signed-in view instantly instead of
// showing the sign-in gate while Google's silent prompt is still resolving.
// It's just a convenience mirror of currentUser, not a security boundary —
// every real API call is still independently re-verified server-side.
const AUTH_CACHE_KEY = 'jgc_auth_cache_v1';
function saveAuthCache(user) {
  try {
    if (user) localStorage.setItem(AUTH_CACHE_KEY, JSON.stringify({ idToken: user.idToken, email: user.email, name: user.name, picture: user.picture, isAdmin: user.isAdmin }));
    else localStorage.removeItem(AUTH_CACHE_KEY);
  } catch (e) {}
}
function loadAuthCache() {
  try {
    const raw = localStorage.getItem(AUTH_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

async function handleCredentialResponse(response) {
  const claims = decodeJwt(response.credential);
  currentUser = { idToken: response.credential, email: (claims.email||'').toLowerCase(), name: claims.name || claims.email, picture: claims.picture || '', isAdmin: currentUser ? currentUser.isAdmin : false };
  saveAuthCache(currentUser);
  renderUserArea();
  // On the Supabase backend, the same Google idToken that used to go
  // straight to Code.gs for verification instead establishes a real
  // Supabase Auth session here (supabase.auth.signInWithIdToken) — this is
  // what links this sign-in to this person's pre-migrated profile row (by
  // email, via the handle_new_user trigger in schema.sql) and is a
  // prerequisite for every supaApi() call below, all of which need a live
  // session. A failure here is logged, not thrown - the rest of this
  // function still runs the same way it always did, so a signed-in state
  // is never left half-set-up.
  if (CONFIG.USE_SUPABASE) {
    try { await supaSignInWithGoogleIdToken_(response.credential); }
    catch (err) {
      // A failure here used to be silent (console.error only) - everything
      // downstream (favorites, known chords, playlists, messages) would then
      // fail one call at a time with "Please sign in with Google to do
      // that.", with no indication *why* a signed-in-looking session wasn't
      // actually signed in to Supabase. Surface it once, loudly, instead.
      console.error('Supabase sign-in failed:', err);
      const footer = document.getElementById('footerStatus');
      if (footer) footer.textContent = "Couldn't establish a Supabase session (" + err.message + ") — most actions won't work until this is fixed.";
    }
  }
  // Google calls this same callback again later, silently, whenever its own
  // FedCM prompt (see initGoogleSignIn) reissues a fresh idToken in the
  // background — not just on a real sign-in. Only kick off the full
  // favorites/knownChords + song-catalog load the first time this session
  // (myDataReady/dataStarted below); re-running loadMyData() on every silent
  // token refresh was refetching favorites mid-toggle and racing the
  // optimistic heart update, briefly flashing it back to its old state
  // before the toggle's own response corrected it again.
  if (!myDataReady) loadMyData();
  startAfterSignIn(); // already a no-op after the first call (see dataStarted guard inside)
}

// Google's OpenID Connect "nonce" replay-protection handshake: Google needs
// the SHA-256 hash (hex) of a random value in google.accounts.id.initialize
// ({nonce}); it then embeds that same hash inside every id_token it issues
// for this page's client config (including silent FedCM reissues, since
// they all reuse this one initialize() call - see the 'load' listener at
// the bottom of this file, which only ever calls initGoogleSignIn once).
// Supabase's signInWithIdToken({nonce}) must then be given the ORIGINAL
// (unhashed) value so it can hash it itself and check it matches the
// token's claim - see supaSignInWithGoogleIdToken_ above. Skipping this
// used to work fine (this file never set a nonce at all), right up until
// Google's FedCM-based prompt started embedding its own nonce claim into
// the id_token regardless of whether the app asked for one - at that point
// Supabase sees a nonce claim with nothing to check it against and rejects
// with "Passed nonce and nonce in id_token should either both exist or
// not."
let _googleSignInNonce = null; // the RAW value; only its hash ever goes to Google
async function generateGoogleNonce_() {
  const raw = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2, '0')).join('');
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  const hashed = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  return { raw, hashed };
}
async function initGoogleSignIn() {
  if (!window.google || !CONFIG.CLIENT_ID || CONFIG.CLIENT_ID.indexOf('PASTE_YOUR') === 0) return;
  const { raw, hashed } = await generateGoogleNonce_();
  _googleSignInNonce = raw;
  google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: handleCredentialResponse, auto_select: true, use_fedcm_for_prompt: true, nonce: hashed });
  renderUserArea();
  if (!currentUser) mountGateSignInButton();
  google.accounts.id.prompt(); // silent attempt; no-op if not eligible
}

function signOut() {
  if (window.google) google.accounts.id.disableAutoSelect();
  // Fire-and-forget: signOut() itself isn't async and nothing below depends
  // on waiting for this network round trip - the local UI resets immediately
  // either way, same as it always has.
  if (CONFIG.USE_SUPABASE) supaSignOut_();
  currentUser = null; favorites = []; knownChords = [];
  saveAuthCache(null);
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  dataStarted = false;
  myDataReady = false;
  saveViewCache(null);
  // Every song/chord/lyric fetch now requires sign-in on the backend (see
  // apiList/loadSongContentAll/loadSongContentFor above), but that cached
  // copy of it (see saveCatalogCache) was still sitting in this browser's
  // localStorage AND in the in-memory songs/playlists/songContentById
  // arrays after signing out — on a shared/public computer, a second person
  // opening the app right after wouldn't see a fresh gated fetch fail; they'd
  // see whatever chart text this cache still had lying around, straight from
  // memory, no network call needed at all. Signing out is exactly the moment
  // that content should stop being available, so clear both copies here.
  songs = []; playlists = []; songContentById = {}; songContentLoaded = false;
  try { localStorage.removeItem(CATALOG_CACHE_KEY); } catch (e) {}
  if (view.name === 'edit' || view.name === 'admin' || view.name === 'playlistDetail') goTo('list');
  renderUserArea(); render();
}

// Renders into both the desktop header's inline user box (#userArea) and
// the mobile hamburger drawer's copy (#userAreaMobile) — on mobile the
// header's own copy is hidden by CSS and the drawer is what's shown, but
// both stay populated so switching between phone/desktop widths (or a
// resize) never leaves either one stale.
function renderUserArea() {
  const targets = [document.getElementById('userArea'), document.getElementById('userAreaMobile')].filter(Boolean);
  if (targets.length === 0) return;
  if (currentUser) {
    const html = `${currentUser.picture ? `<img src="${currentUser.picture}">` : ''}<span class="name">${escapeHtml(currentUser.name)}${currentUser.isAdmin?' (admin)':''}</span><button class="btn secondary" onclick="signOut()">Sign out</button>`;
    targets.forEach(el => { el.innerHTML = html; });
  } else {
    targets.forEach((el, i) => {
      el.innerHTML = `<div id="${i===0?'gsiButtonContainer':'gsiButtonContainerMobile'}"></div>`;
    });
    if (window.google && CONFIG.CLIENT_ID.indexOf('PASTE_YOUR') !== 0) {
      ['gsiButtonContainer','gsiButtonContainerMobile'].forEach(id => {
        const container = document.getElementById(id);
        if (!container) return;
        try { google.accounts.id.renderButton(container, { theme:'filled_blue', size:'medium', text:'signin' }); } catch(e) {}
      });
    }
  }
}

async function loadMyData() {
  if (!currentUser) return;
  try {
    const data = await api('getMyData', {});
    // Update favorites/knownChords in place (empty + refill the same array)
    // instead of reassigning the variables to new arrays. toggleFavoriteFor/
    // toggleKnownChord capture a reference to this array for their optimistic
    // update + later reconciliation with the server's response; reassigning
    // here would leave an in-flight toggle patching a now-detached array
    // while the visibly-rendered one silently went stale underneath it.
    favorites.length = 0; favorites.push(...(data.favorites || []));
    knownChords.length = 0; knownChords.push(...(data.knownChords || []));
    currentUser.isAdmin = !!(data.user && data.user.isAdmin);
    myDataReady = true;
    saveMyDataCache();
    renderUserArea();
    render();
  } catch (err) { console.error(err); }
}

/* ============================================================
   DATA LAYER
   ============================================================ */
// Both apiList() and api() below share one offline choke point: while
// isOffline is true, every write AND every live read is refused up front
// with a clear message, instead of letting a fetch that can only fail hang
// for however long the network stack takes to give up. Nearly every caller
// in this file already does .catch(err => alert(err.message)) (or similar)
// on these, so this one change surfaces "you're offline" everywhere for
// free — see OFFLINE AVAILABILITY below for how isOffline itself gets set.
function offlineError_() { return new Error("You're offline — this isn't available until you're back online."); }

// Now just a thin wrapper over the shared, authenticated api() helper below
// — 'list' moved behind requireUser_ on the backend (see doPost in Code.gs),
// since a signed-out visitor being able to fetch the song list straight from
// this URL, no sign-in needed, was exactly what let someone "still see
// everything" while the app was telling them to sign in. api() already
// handles the offline guard, the network-error → offline-banner fallback,
// attaching idToken, and clearing an expired session on a sign-in error —
// this used to duplicate all of that for no reason.
async function apiList() {
  const data = await api('list', {});
  return data.songs;
}

// No custom Content-Type header — keeps this a CORS "simple request" since
// Apps Script can't handle an OPTIONS preflight.
async function api(action, fields) {
  if (isOffline) throw offlineError_();
  // See CONFIG.USE_SUPABASE above and the SUPABASE BACKEND ADAPTER section
  // right below this function - when set, every action is answered by
  // supaApi() (talking to Postgres/Supabase directly) instead of a fetch to
  // the old Apps Script backend. Both paths funnel through the exact same
  // success/error handling below, so a caller of api() never needs to know
  // or care which backend actually answered it.
  let data;
  if (CONFIG.USE_SUPABASE) {
    data = await supaApi(action, fields);
  } else {
    const payload = Object.assign({ action }, fields || {});
    if (currentUser) payload.idToken = currentUser.idToken;
    let res;
    try { res = await fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }); }
    catch (networkErr) {
      // See the matching comment in apiList() above - only a real, browser-
      // confirmed disconnect should latch the persistent offline banner.
      if (!navigator.onLine) setOffline(true);
      throw offlineError_();
    }
    data = await res.json();
  }
  if (!data.success) {
    // A sign-in error usually means the Google ID token has expired (it's
    // only valid ~1 hour and this app doesn't silently refresh it) — clear
    // the stale session so the UI cleanly asks to sign in again, instead of
    // just showing a cryptic error while still looking "signed in".
    if (data.error && data.error.indexOf('sign in with Google') >= 0 && currentUser) {
      expireSession_();
    }
    throw new Error(data.error || 'Request failed');
  }
  return data;
}

/* ============================================================
   SUPABASE BACKEND ADAPTER (task #72)
   ============================================================
   When CONFIG.USE_SUPABASE is true (see the toggle near CONFIG below), every
   call to api(action, fields) is routed through supaApi() here instead of
   the old Apps Script backend (CONFIG.SCRIPT_URL) — nothing else in this
   file changes. Every function below returns the EXACT SAME shape
   Code.gs's doPost used to return for that action (including 'true'/'false'
   STRINGS for archived/read_by_admin, since the rest of this file compares
   against those strings, not real booleans — see e.g. r.archived==='true'
   throughout the admin views), so no other code in index.html needs to be
   touched to work against the new Postgres/Supabase backend.
   ============================================================ */

// The supabase-js UMD bundle loads via a plain <script async defer> tag
// (see <head>) so this file's own inline script - which is NOT deferred,
// and can fire off a Supabase call immediately at page load if a cached
// signed-in session exists (see loadAuthCache/currentUser near INIT below)
// - has no guarantee that bundle has actually finished downloading and
// running yet, especially on a slow connection. getSupa_() used to just
// throw the one time window.supabase wasn't there yet ("Supabase library
// did not load yet"), which is exactly the race this was hitting. Every
// real entry point into this adapter (supaApi, supaSignInWithGoogleIdToken_,
// supaSignOut_) now awaits ensureSupabaseLib_() first, which resolves as
// soon as the library actually shows up instead of failing immediately.
let _supabaseLibReadyPromise = null;
function ensureSupabaseLib_() {
  if (window.supabase) return Promise.resolve();
  if (_supabaseLibReadyPromise) return _supabaseLibReadyPromise;
  _supabaseLibReadyPromise = new Promise((resolve, reject) => {
    const start = Date.now();
    const TIMEOUT_MS = 15000;
    (function poll() {
      if (window.supabase) { resolve(); return; }
      if (Date.now() - start > TIMEOUT_MS) { reject(new Error('Could not load the Supabase library — check your connection and try again.')); return; }
      setTimeout(poll, 100);
    })();
  });
  return _supabaseLibReadyPromise;
}
let _supaClient = null;
function getSupa_() {
  if (_supaClient) return _supaClient;
  if (!window.supabase) throw new Error('Supabase library did not load yet — check your connection and try again.');
  if (!CONFIG.SUPABASE_URL || CONFIG.SUPABASE_URL.indexOf('PASTE_YOUR') === 0) throw new Error('CONFIG.SUPABASE_URL is not set.');
  _supaClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  return _supaClient;
}

function supaBool_(v) { return v ? 'true' : 'false'; }
function throwIfErr_(error) { if (error) throw new Error(error.message || String(error)); }

// Supabase's REST API (PostgREST) caps an unpaginated .select() at 1,000
// rows by default (the project's "Max Rows" API setting) - several tables
// here now exceed that (songs: 2,626 · profiles: 5,039 · messages: 1,545 ·
// playlist_songs: 15,467), so a plain .select() silently came back with
// only the first 1,000 rows and nothing else - no error, just quietly
// incomplete data. This pages through with .range() until a page comes
// back short of a full page, so every caller below gets everything, the
// same as a single .select() would if there were no cap.
// SAFETY: pagination like this is only correct if every page is ordered
// deterministically (a plain .order('position') with duplicate position
// values across different playlists, for instance, is NOT deterministic -
// Postgres can re-split ties differently between two separate range
// queries) - every caller below now orders by a genuinely unique column (or
// column combination) for exactly that reason. On top of that, this also
// hard-caps the number of pages it will ever fetch, no matter what a
// caller's query does: a previous version of this had no such cap and
// relied entirely on "the last page came back short" to know when to stop,
// which is not something to bet a browser tab's memory on - if that signal
// is ever wrong (non-deterministic ordering, a client/server range mismatch,
// anything), an unbounded loop that keeps concatenating full-sized pages
// forever will exhaust memory and can take the whole browser (and, in
// practice, the machine it's running on) down with it. 200 pages at 1,000
// rows is 200,000 rows - far beyond any table this app has - so hitting the
// cap always means something is wrong, never a legitimately large table.
async function supaSelectAll_(buildQuery, pageSize) {
  pageSize = pageSize || 1000;
  const MAX_PAGES = 200;
  let all = [];
  let from = 0;
  for (let page = 0; page < MAX_PAGES; page++) {
    const { data, error } = await buildQuery(from, from + pageSize - 1);
    if (error) return { data: null, error };
    if (!data || data.length === 0) break;
    all = all.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
    if (page === MAX_PAGES - 1) {
      console.error('supaSelectAll_: hit the ' + MAX_PAGES + '-page safety cap - stopping early with ' + all.length + ' rows. This should never happen; something (non-deterministic ordering, a broken .range()) is wrong.');
    }
  }
  return { data: all, error: null };
}

// ---- short-lived cache for the two heaviest reads --------------------
// The old Apps Script backend cached the full song list / playlist set
// server-side (cacheGetChunked_/CACHE_TTL_SECONDS in Code.gs), so repeated
// 'list'/'getPlaylists' calls (after nearly every write, via
// refreshAfterWrite(), and on every AUTO_REFRESH_SECONDS tick) were nearly
// free. Supabase has no equivalent here, so without this those same calls
// were re-scanning the entire songs/playlists/playlist_songs tables from
// scratch every time - the likely main cause of "everything takes forever"
// - a few seconds of staleness on these two reads is a far better trade.
let _supaListCache = null;      // { at, promise }
let _supaPlaylistsCache = null; // { at, promise }
let _supaUsersCache = null;     // { at, promise }
const SUPA_CACHE_MS = 15000;
function supaCached_(getCache, setCache, loader) {
  const cached = getCache();
  const now = Date.now();
  if (cached && (now - cached.at) < SUPA_CACHE_MS) return cached.promise;
  const promise = loader().catch(err => { setCache(null); throw err; });
  setCache({ at: now, promise });
  return promise;
}

// ---- identity -------------------------------------------------------
let supaProfileCache = null; // this browser session's own profile row, or null if signed out

async function supaCurrentProfile_(forceRefresh) {
  if (supaProfileCache && !forceRefresh) return supaProfileCache;
  const { data: sessionData } = await getSupa_().auth.getSession();
  const authUser = sessionData && sessionData.session && sessionData.session.user;
  if (!authUser) { supaProfileCache = null; return null; }
  const { data, error } = await getSupa_().from('profiles').select('*').eq('auth_user_id', authUser.id).maybeSingle();
  throwIfErr_(error);
  supaProfileCache = data || null;
  return supaProfileCache;
}
async function supaRequireUser_() {
  const p = await supaCurrentProfile_();
  if (!p) throw new Error('Please sign in with Google to do that.');
  return p;
}
async function supaRequireAdmin_() {
  const p = await supaRequireUser_();
  if (!p.is_admin) throw new Error('Admin only.');
  return p;
}
// Called from handleCredentialResponse/signOut in the main script above,
// only when CONFIG.USE_SUPABASE is true.
//
// The `nonce` here MUST be the same raw value whose SHA-256 hash was handed
// to google.accounts.id.initialize({nonce}) in initGoogleSignIn() below - see
// the comment on _googleSignInNonce for why this pairing exists at all
// (Supabase rejects the sign-in with "Passed nonce and nonce in id_token
// should either both exist or not" otherwise, once Google's id_token embeds
// a nonce claim, which the FedCM-based prompt now does even though this file
// never used to have to think about nonces at all).
async function supaSignInWithGoogleIdToken_(idToken) {
  await ensureSupabaseLib_();
  const { error } = await getSupa_().auth.signInWithIdToken({ provider: 'google', token: idToken, nonce: _googleSignInNonce || undefined });
  if (error) throw new Error(error.message);
  await supaCurrentProfile_(true); // refresh the cached profile now that a session exists
}
async function supaSignOut_() {
  supaProfileCache = null;
  try { await ensureSupabaseLib_(); await getSupa_().auth.signOut(); } catch (e) {}
}
// Mirrors effectiveIdentity_ in Code.gs: a write is attributed to the
// caller's own profile, unless they're an admin acting via View As
// (target_email + view_as sent together), in which case it's attributed to
// the target's profile instead.
async function supaEffectiveProfile_(me, fields) {
  if (me.is_admin && fields.target_email && fields.view_as) {
    const email = String(fields.target_email).toLowerCase();
    const { data, error } = await getSupa_().from('profiles').select('*').eq('email', email).maybeSingle();
    throwIfErr_(error);
    if (!data) throw new Error('User not found: ' + email);
    return data;
  }
  return me;
}

// A plain PostgREST .in('col', ids) filter puts every one of those ids
// directly in the request's URL - fine for a normal user's own handful of
// playlists, but RLS lets an admin see EVERY playlist (943 of them, in this
// app's data), and cramming 943 UUIDs into one URL's query string blows
// past a length limit enforced by the layer in front of PostgREST (Kong/the
// CDN) - the request gets rejected outright before it ever reaches Postgres,
// coming back as a bare, detail-less "400 Bad Request" with no error body to
// explain why. This is exactly what an admin hit loading playlists.
// Splitting the id list into small batches (and paging each batch past the
// existing 1,000-row cap too, same as supaSelectAll_) keeps every request's
// URL a safe, bounded size no matter how many playlists/shares/owners exist.
async function supaSelectAllByIdChunks_(buildQuery, ids, chunkSize) {
  chunkSize = chunkSize || 150;
  let all = [];
  for (let i = 0; i < ids.length; i += chunkSize) {
    const chunk = ids.slice(i, i + chunkSize);
    const { data, error } = await supaSelectAll_((from, to) => buildQuery(chunk, from, to));
    if (error) return { data: null, error };
    all = all.concat(data || []);
  }
  return { data: all, error: null };
}
// ---- shared playlist hydration (join tables -> old flat shape) ------
// Old shape (from Code.gs's Playlists tab): {id,owner_email,owner_name,
// title,song_ids:[],visibility,shared_with:[],updated_at,icon}. The new
// schema splits song_ids into playlist_songs and shared_with into
// playlist_shares, and has owner_id (a profile id) instead of owner_email/
// owner_name directly - this reassembles the old shape so nothing else in
// this file has to change.
async function supaHydratePlaylists_(rows) {
  if (!rows.length) return [];
  const ids = rows.map(r => r.id);
  const ownerIds = Array.from(new Set(rows.map(r => r.owner_id)));
  const [songsRes, sharesRes, ownersRes] = await Promise.all([
    supaSelectAllByIdChunks_((chunk, from, to) => getSupa_().from('playlist_songs').select('playlist_id,song_id,position').in('playlist_id', chunk).order('playlist_id').order('position').order('song_id').range(from, to), ids),
    supaSelectAllByIdChunks_((chunk, from, to) => getSupa_().from('playlist_shares').select('playlist_id,email,can_edit').in('playlist_id', chunk).order('playlist_id').range(from, to), ids),
    supaSelectAllByIdChunks_((chunk, from, to) => getSupa_().from('profiles').select('id,email,name').in('id', chunk).order('id').range(from, to), ownerIds),
  ]);
  throwIfErr_(songsRes.error); throwIfErr_(sharesRes.error); throwIfErr_(ownersRes.error);
  const songsByPl = {}, sharesByPl = {}, ownerById = {};
  (songsRes.data || []).forEach(r => { (songsByPl[r.playlist_id] = songsByPl[r.playlist_id] || []).push(r.song_id); });
  // shared_with is {email, canEdit} objects, not plain strings, so an owner
  // can grant edit rights to some shared people and not others (see item 5
  // of the playlist-permissions feature).
  (sharesRes.data || []).forEach(r => { (sharesByPl[r.playlist_id] = sharesByPl[r.playlist_id] || []).push({ email: r.email, canEdit: !!r.can_edit }); });
  (ownersRes.data || []).forEach(o => { ownerById[o.id] = o; });
  return rows.map(p => {
    const owner = ownerById[p.owner_id] || {};
    return {
      id: p.id, owner_email: owner.email || '', owner_name: owner.name || owner.email || '',
      title: p.title, song_ids: songsByPl[p.id] || [], visibility: p.visibility,
      shared_with: sharesByPl[p.id] || [], updated_at: p.updated_at, icon: p.icon || '',
    };
  });
}
// Rewrites a playlist's playlist_songs rows to match a new ordered array of
// song ids (used by createPlaylist/updatePlaylist below) - simplest correct
// approach given how infrequently playlists are edited: delete then re-insert
// the whole set, inside no explicit transaction (Supabase's REST API doesn't
// expose one from the client), but each step is idempotent enough that a
// partial failure just means "re-save" fixes it - no risk of a duplicate or
// orphaned row surviving since the delete always runs first.
async function supaSetPlaylistSongs_(playlistId, songIds) {
  const del = await getSupa_().from('playlist_songs').delete().eq('playlist_id', playlistId);
  throwIfErr_(del.error);
  const rows = (songIds || []).map((song_id, position) => ({ playlist_id: playlistId, song_id, position }));
  if (rows.length) { const ins = await getSupa_().from('playlist_songs').insert(rows); throwIfErr_(ins.error); }
}
// `shares` is an array of {email, canEdit} objects (a plain string is also
// accepted for back-compat and treated as canEdit:false).
async function supaSetPlaylistShares_(playlistId, shares) {
  const del = await getSupa_().from('playlist_shares').delete().eq('playlist_id', playlistId);
  throwIfErr_(del.error);
  const rows = (shares || []).map(s => {
    const email = typeof s === 'string' ? s : s.email;
    const canEdit = typeof s === 'string' ? false : !!s.canEdit;
    return { playlist_id: playlistId, email: String(email).toLowerCase(), can_edit: canEdit };
  });
  if (rows.length) { const ins = await getSupa_().from('playlist_shares').insert(rows); throwIfErr_(ins.error); }
}

// ---- requests/messages/errors: user_id -> user_email/user_name --------
// Same unbounded-.in()-URL risk as supaHydratePlaylists_ above (an admin's
// getMessages/getRequests/getErrors can reference hundreds of distinct
// users) - chunked the same way so this can never blow past the URL-length
// limit that caused the "Bad Request" on playlists.
async function supaProfileMapByIds_(ids) {
  const uniq = Array.from(new Set(ids));
  if (!uniq.length) return {};
  const { data, error } = await supaSelectAllByIdChunks_((chunk, from, to) => getSupa_().from('profiles').select('id,email,name').in('id', chunk).order('id').range(from, to), uniq);
  throwIfErr_(error);
  const map = {};
  (data || []).forEach(p => { map[p.id] = p; });
  return map;
}

async function supaApi(action, fields) {
  fields = fields || {};
  await ensureSupabaseLib_();

  // ================= reads =================
  if (action === 'list') {
    await supaRequireUser_();
    // Measured: chords_lyrics (the full chord chart text) averages ~4.2KB
    // per song - across all 2,626 songs that's an ~11MB chunk of an ~15.5MB
    // total payload, on EVERY 'list' call, just to compute the small
    // chords_used tag array (a handful of chord names) via chordsUsedIn().
    // songs.chords_used is a precomputed column (see createSong/updateSong
    // below, which keep it in sync on every save) holding exactly that
    // small array, so 'list' can select it directly and skip chords_lyrics
    // entirely - full chart text is still fetched separately and lazily,
    // only for the one song actually being viewed (songContent) or once
    // lyrics search is actually used (listContent).
    const data = await supaCached_(() => _supaListCache, c => _supaListCache = c, async () => {
      const { data, error } = await supaSelectAll_((from, to) => getSupa_().from('songs')
        .select('id,title,title_hebrew,artist,categories,capo,youtube_url,date_added,updated_at,chords_used')
        .order('id').range(from, to));
      throwIfErr_(error);
      return data;
    });
    return { success: true, songs: data.map(s => ({
      id: s.id, title: s.title, title_hebrew: s.title_hebrew || '', artist: s.artist || '',
      categories: s.categories || [], capo: s.capo || 0, youtube_url: s.youtube_url || '',
      date_added: s.date_added, updated_at: s.updated_at,
      chords_used: s.chords_used || [],
    })) };
  }

  if (action === 'listContent') {
    await supaRequireUser_();
    const { data, error } = await supaSelectAll_((from, to) => getSupa_().from('songs').select('id,chords_lyrics,lyrics_only').order('id').range(from, to));
    throwIfErr_(error);
    return { success: true, content: data.map(s => ({ id: s.id, chords_lyrics: s.chords_lyrics || '', lyrics_only: s.lyrics_only || '' })) };
  }

  if (action === 'songContent') {
    await supaRequireUser_();
    const { data, error } = await getSupa_().from('songs').select('id,chords_lyrics,lyrics_only').eq('id', fields.id).maybeSingle();
    throwIfErr_(error);
    if (!data) return { success: false, error: 'Song not found' };
    return { success: true, id: data.id, chords_lyrics: data.chords_lyrics || '', lyrics_only: data.lyrics_only || '' };
  }

  if (action === 'getPlaylists') {
    // No sign-in check here on purpose, matching the old behavior (an
    // unauthenticated caller could still see public playlists) - RLS itself
    // already restricts which rows come back (public, or yours, or shared
    // with you, or all of them if you're an admin), including for a signed-
    // out caller (who then only ever sees the public ones).
    const playlists = await supaCached_(() => _supaPlaylistsCache, c => _supaPlaylistsCache = c, async () => {
      const { data, error } = await getSupa_().from('playlists').select('*');
      throwIfErr_(error);
      return await supaHydratePlaylists_(data);
    });
    return { success: true, playlists };
  }

  if (action === 'getMyData') {
    const me = await supaRequireUser_();
    const [favRes, kcRes] = await Promise.all([
      getSupa_().from('favorites').select('song_id,position').eq('user_id', me.id).order('position'),
      getSupa_().from('known_chords').select('chords').eq('user_id', me.id).maybeSingle(),
    ]);
    throwIfErr_(favRes.error); throwIfErr_(kcRes.error);
    return {
      success: true,
      favorites: (favRes.data || []).map(f => f.song_id),
      knownChords: (kcRes.data && kcRes.data.chords) || [],
      user: { email: me.email, name: me.name, isAdmin: !!me.is_admin },
    };
  }

  if (action === 'getRequests') {
    const me = await supaRequireUser_();
    const scoped = !(me.is_admin && fields.scope !== 'mine');
    const { data, error } = await supaSelectAll_((from, to) => {
      let q = getSupa_().from('requests').select('*').order('id').range(from, to);
      if (scoped) q = q.eq('user_id', me.id);
      return q;
    });
    throwIfErr_(error);
    const emailMap = await supaProfileMapByIds_(data.map(r => r.user_id));
    return { success: true, requests: data.map(r => supaRequestToOld_(r, emailMap)) };
  }

  if (action === 'getMessages') {
    const me = await supaRequireUser_();
    const scoped = !(me.is_admin && fields.scope !== 'mine');
    const { data, error } = await supaSelectAll_((from, to) => {
      let q = getSupa_().from('messages').select('*').order('id').range(from, to);
      if (scoped) q = q.eq('user_id', me.id);
      return q;
    });
    throwIfErr_(error);
    const emailMap = await supaProfileMapByIds_(data.map(m => m.user_id));
    return { success: true, messages: data.map(m => supaMessageToOld_(m, emailMap)) };
  }

  if (action === 'getErrors') {
    await supaRequireAdmin_();
    const { data, error } = await getSupa_().from('errors').select('*');
    throwIfErr_(error);
    const emailMap = await supaProfileMapByIds_(data.map(e => e.user_id));
    return { success: true, errors: data.map(e => supaErrorToOld_(e, emailMap)) };
  }

  if (action === 'getUsers') {
    await supaRequireAdmin_();
    // Same 15s client cache as 'list'/'getPlaylists' above - this was the
    // one heavy admin read that had no caching at all, so re-opening the
    // Users tab (or switching tabs and back) inside that window re-showed
    // the same data instantly instead of re-running the full roster query
    // again. This does NOT fix a slow first load by itself - if the tab is
    // slow the very first time it's opened, that's the admin_user_roster
    // view itself (see fix_admin_user_roster_perf.sql) not yet having been
    // applied on the live database, which this cache can't paper over.
    const { rosterRes, msgRes } = await supaCached_(() => _supaUsersCache, c => _supaUsersCache = c, async () => {
      const [rosterRes, msgRes] = await Promise.all([
        supaSelectAll_((from, to) => getSupa_().from('admin_user_roster').select('*').order('id').range(from, to)),
        supaSelectAll_((from, to) => getSupa_().from('messages').select('*').order('id').range(from, to)),
      ]);
      return { rosterRes, msgRes };
    });
    throwIfErr_(rosterRes.error); throwIfErr_(msgRes.error);
    const users = (rosterRes.data || []).map(u => ({
      email: u.email, name: u.name || u.email, photo: u.photo || '', level: u.level || '', language: u.language || '',
      favorites: u.favorites_count || 0, knownChords: !!u.known_chords, playlists: u.playlists_count || 0,
      requests: u.requests_count || 0, messages: u.messages_count || 0, errors: u.errors_count || 0,
      lastActivity: u.last_activity || '',
    }));
    const emailMap = {}; (rosterRes.data || []).forEach(u => { emailMap[u.id] = { email: u.email, name: u.name }; });
    return { success: true, users, messages: (msgRes.data || []).map(m => supaMessageToOld_(m, emailMap)) };
  }

  if (action === 'getUserSnapshot') {
    await supaRequireAdmin_();
    const targetEmail = String(fields.target_email || '').toLowerCase();
    if (!targetEmail) return { success: false, error: 'Missing target_email' };
    const { data: target, error: targetErr } = await getSupa_().from('profiles').select('*').eq('email', targetEmail).maybeSingle();
    throwIfErr_(targetErr);
    if (!target) return { success: false, error: 'User not found' };
    const [favRes, kcRes, plRes, reqRes, msgRes] = await Promise.all([
      getSupa_().from('favorites').select('song_id,position').eq('user_id', target.id).order('position'),
      getSupa_().from('known_chords').select('chords').eq('user_id', target.id).maybeSingle(),
      getSupa_().from('playlists').select('*').eq('owner_id', target.id),
      getSupa_().from('requests').select('*').eq('user_id', target.id),
      getSupa_().from('messages').select('*').eq('user_id', target.id),
    ]);
    [favRes, kcRes, plRes, reqRes, msgRes].forEach(r => throwIfErr_(r.error));
    const emailMap = { [target.id]: { email: target.email, name: target.name } };
    return {
      success: true, email: targetEmail,
      favorites: (favRes.data || []).map(f => f.song_id),
      knownChords: (kcRes.data && kcRes.data.chords) || [],
      playlists: await supaHydratePlaylists_(plRes.data || []),
      requests: (reqRes.data || []).map(r => supaRequestToOld_(r, emailMap)),
      messages: (msgRes.data || []).map(m => supaMessageToOld_(m, emailMap)),
    };
  }

  // ================= writes =================
  if (action === 'createSong' || action === 'updateSong') {
    await supaRequireAdmin_();
    const s = fields.song || {};
    const row = {
      title: s.title || '', title_hebrew: s.title_hebrew || '', artist: s.artist || '',
      categories: Array.isArray(s.categories) ? s.categories : [], capo: Number(s.capo) || 0,
      youtube_url: s.youtube_url || '', chords_lyrics: s.chords_lyrics || '', lyrics_only: s.lyrics_only || '',
      // Kept in sync with chords_lyrics on every save so 'list' (above) never
      // has to fetch/parse the full chart text just to get this - see the
      // comment on 'list' for why that matters.
      chords_used: chordsUsedIn(s.chords_lyrics || '', 0),
      updated_at: new Date().toISOString(),
    };
    if (action === 'createSong') {
      const { error } = await getSupa_().from('songs').insert(row);
      throwIfErr_(error);
    } else {
      const { error } = await getSupa_().from('songs').update(row).eq('id', s.id);
      throwIfErr_(error);
    }
    _supaListCache = null; // catalog just changed - next 'list' call re-fetches instead of serving stale cache
    return { success: true };
  }
  if (action === 'deleteSong') {
    await supaRequireAdmin_();
    const { error } = await getSupa_().from('songs').delete().eq('id', fields.id);
    throwIfErr_(error);
    _supaListCache = null;
    return { success: true };
  }

  if (action === 'createPlaylist') {
    const me = await supaRequireUser_();
    const eff = await supaEffectiveProfile_(me, fields);
    const { data, error } = await getSupa_().from('playlists').insert({
      owner_id: eff.id, title: fields.title || 'Untitled', visibility: fields.visibility || 'private',
      icon: fields.icon || 'note', updated_at: new Date().toISOString(),
    }).select().single();
    throwIfErr_(error);
    await supaSetPlaylistSongs_(data.id, fields.song_ids || []);
    await supaSetPlaylistShares_(data.id, fields.shared_with || []);
    const [hydrated] = await supaHydratePlaylists_([data]);
    _supaPlaylistsCache = null;
    return { success: true, playlist: hydrated };
  }
  if (action === 'updatePlaylist') {
    const editor = await supaRequireUser_();
    const { data: existing, error: exErr } = await getSupa_().from('playlists').select('*').eq('id', fields.id).maybeSingle();
    throwIfErr_(exErr);
    if (!existing) return { success: false, error: 'Playlist not found' };
    if (existing.owner_id !== editor.id && !editor.is_admin) return { success: false, error: 'Not your playlist' };
    const patch = { updated_at: new Date().toISOString() };
    if (fields.title !== undefined) patch.title = fields.title;
    if (fields.visibility !== undefined) patch.visibility = fields.visibility;
    if (fields.icon !== undefined) patch.icon = fields.icon;
    const { error: upErr } = await getSupa_().from('playlists').update(patch).eq('id', fields.id);
    throwIfErr_(upErr);
    if (fields.song_ids !== undefined) await supaSetPlaylistSongs_(fields.id, fields.song_ids);
    if (fields.shared_with !== undefined) await supaSetPlaylistShares_(fields.id, fields.shared_with);
    const { data: fresh, error: freshErr } = await getSupa_().from('playlists').select('*').eq('id', fields.id).single();
    throwIfErr_(freshErr);
    const [hydrated] = await supaHydratePlaylists_([fresh]);
    _supaPlaylistsCache = null;
    return { success: true, playlist: hydrated };
  }
  if (action === 'deletePlaylist') {
    const deleter = await supaRequireUser_();
    const { data: existing, error: exErr } = await getSupa_().from('playlists').select('owner_id').eq('id', fields.id).maybeSingle();
    throwIfErr_(exErr);
    if (!existing) return { success: false, error: 'Playlist not found' };
    if (existing.owner_id !== deleter.id && !deleter.is_admin) return { success: false, error: 'Not your playlist' };
    const { error } = await getSupa_().from('playlists').delete().eq('id', fields.id);
    throwIfErr_(error);
    _supaPlaylistsCache = null;
    return { success: true };
  }

  if (action === 'toggleFavorite') {
    const me = await supaRequireUser_();
    const eff = await supaEffectiveProfile_(me, fields);
    const { data: existing, error: exErr } = await getSupa_().from('favorites').select('user_id').eq('user_id', eff.id).eq('song_id', fields.song_id).maybeSingle();
    throwIfErr_(exErr);
    if (existing) {
      const { error } = await getSupa_().from('favorites').delete().eq('user_id', eff.id).eq('song_id', fields.song_id);
      throwIfErr_(error);
      return { success: true, favorited: false };
    }
    // Date.now() as the position, same reasoning as the old backend: always
    // sorts after any existing favorite (including ones already renumbered
    // to small sequential indices by a manual reorder), i.e. "append at the
    // end" until the user drags it somewhere else.
    const { error } = await getSupa_().from('favorites').insert({ user_id: eff.id, song_id: fields.song_id, position: Date.now() });
    throwIfErr_(error);
    return { success: true, favorited: true };
  }
  if (action === 'reorderFavorites') {
    const me = await supaRequireUser_();
    const eff = await supaEffectiveProfile_(me, fields);
    const orderedIds = Array.isArray(fields.song_ids) ? fields.song_ids : [];
    // Same "delete then re-insert" approach as playlist_songs above, and for
    // the same reason - this is called rarely (a manual drag-reorder), so
    // simplicity wins over a more surgical per-row update.
    await Promise.all(orderedIds.map((song_id, idx) =>
      getSupa_().from('favorites').update({ position: idx }).eq('user_id', eff.id).eq('song_id', song_id)
    ));
    return { success: true };
  }
  if (action === 'setKnownChords') {
    const me = await supaRequireUser_();
    const eff = await supaEffectiveProfile_(me, fields);
    const { error } = await getSupa_().from('known_chords').upsert({
      user_id: eff.id, chords: Array.isArray(fields.chords) ? fields.chords : [], updated_at: new Date().toISOString(),
    });
    throwIfErr_(error);
    return { success: true };
  }

  if (action === 'createRequest') {
    const me = await supaRequireUser_();
    const eff = await supaEffectiveProfile_(me, fields);
    const songTitle = String(fields.song_title || '').trim();
    const artist = String(fields.artist || '').trim();
    const youtubeUrl = String(fields.youtube_url || '').trim();
    if (!songTitle) return { success: false, error: 'Song title is required.' };
    if (!artist) return { success: false, error: 'Artist is required.' };
    if (!youtubeUrl || !YOUTUBE_URL_RE.test(youtubeUrl)) return { success: false, error: 'Please enter a valid YouTube link.' };
    // The 2-per-week limit is enforced server-side by a Postgres trigger
    // (enforce_request_limit, in schema.sql) - it raises an exception that
    // arrives here as a normal Supabase error, same as any other insert
    // failure, so no separate client-side count check is needed.
    const { error } = await getSupa_().from('requests').insert({
      user_id: eff.id, song_title: songTitle, artist, note: fields.note || '', status: 'pending',
      youtube_url: youtubeUrl, categories: Array.isArray(fields.categories) ? fields.categories : [], lyrics: fields.lyrics || '',
    });
    throwIfErr_(error);
    return { success: true };
  }
  if (action === 'updateRequestStatus') {
    await supaRequireAdmin_();
    const { error } = await getSupa_().from('requests').update({ status: fields.status }).eq('id', fields.id);
    throwIfErr_(error);
    return { success: true };
  }
  if (action === 'archiveRequest') {
    await supaRequireAdmin_();
    const { error } = await getSupa_().from('requests').update({ archived: !!fields.archived }).eq('id', fields.id);
    throwIfErr_(error);
    return { success: true };
  }

  if (action === 'sendMessage') {
    const me = await supaRequireUser_();
    const isViewAsSend = me.is_admin && fields.target_email && fields.view_as;
    let targetProfile;
    if (isViewAsSend) {
      const { data, error } = await getSupa_().from('profiles').select('*').eq('email', String(fields.target_email).toLowerCase()).maybeSingle();
      throwIfErr_(error);
      if (!data) throw new Error('User not found: ' + fields.target_email);
      targetProfile = data;
    } else if (me.is_admin && fields.target_email) {
      const { data, error } = await getSupa_().from('profiles').select('*').eq('email', String(fields.target_email).toLowerCase()).maybeSingle();
      throwIfErr_(error);
      if (!data) throw new Error('User not found: ' + fields.target_email);
      targetProfile = data;
    } else {
      targetProfile = me;
    }
    const sender = isViewAsSend ? 'user' : ((me.is_admin && fields.target_email) ? 'admin' : 'user');
    const { error } = await getSupa_().from('messages').insert({
      user_id: targetProfile.id, sender, text: fields.text || '',
      read_by_admin: sender === 'admin', // an admin's own reply is implicitly already "read" by the admin who sent it
    });
    throwIfErr_(error);
    return { success: true };
  }
  if (action === 'archiveThread') {
    await supaRequireAdmin_();
    const targetEmail = String(fields.user_email || '').toLowerCase();
    const { data: target, error: tErr } = await getSupa_().from('profiles').select('id').eq('email', targetEmail).maybeSingle();
    throwIfErr_(tErr);
    if (!target) return { success: true }; // nothing to archive for an unknown email - matches the old backend's silent no-op here
    const { error } = await getSupa_().from('messages').update({ archived: !!fields.archived }).eq('user_id', target.id);
    throwIfErr_(error);
    return { success: true };
  }
  if (action === 'markThreadRead') {
    await supaRequireAdmin_();
