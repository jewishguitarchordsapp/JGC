<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Chart App</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @font-face{
    font-family:"CustomCourier";
    src:url("https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/I92Tw7yPd2brLinJPqNJ/pub/S3SwVoksS5kJxQ8eEE6Y.woff2") format("woff2");
    font-display:swap;
  }
  :root{
    --teal:#4a9b9b; --teal-dark:#3d8484; --bg:#f5f6f7; --card:#ffffff;
    --border:#e2e5e8; --text:#222; --muted:#666; --chord:#c0392b; --accent:#2e7d7d;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--teal);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;margin:0;white-space:nowrap;}
  nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav button{background:transparent;border:none;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px;}
  nav button.active{background:rgba(255,255,255,0.25);font-weight:600;}
  nav button:hover{background:rgba(255,255,255,0.15);}
  .spacer{flex:1;}
  .userbox{display:flex;align-items:center;gap:8px;}
  .userbox img{width:26px;height:26px;border-radius:50%;}
  .userbox .name{font-size:13px;}
  #signoutBtn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;}
  #gsiButtonContainer{line-height:0;}
  main{max-width:920px;margin:0 auto;padding:18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;}
  .searchRow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{
    font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);
  }
  .searchRow input[type=text]{flex:1;min-width:160px;}
  select{cursor:pointer;}
  .btn{background:var(--teal);color:#fff;border:none;padding:9px 14px;border-radius:7px;cursor:pointer;font-size:14px;}
  .btn:hover{background:var(--teal-dark);}
  .btn.secondary{background:#fff;color:var(--teal-dark);border:1px solid var(--teal);}
  .btn.danger{background:#fff;color:#b33;border:1px solid #d99;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .subtabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);}
  .subtabs button{background:none;border:none;padding:9px 14px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;}
  .subtabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
  .song-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer;}
  .song-row:hover{border-color:var(--teal);}
  .song-row .title{font-weight:600;}
  .song-row .artist{color:var(--muted);font-size:13px;}
  .song-row .star{font-size:16px;color:#ccc;cursor:pointer;padding:4px;}
  .song-row .star.on{color:#e0a800;}
  .chip{display:inline-block;background:#eef4f4;color:var(--accent);border-radius:20px;padding:5px 12px;font-size:13px;margin:3px;cursor:pointer;border:1px solid #d7e6e6;}
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .chip.toggle-on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chip .count{opacity:0.7;font-size:11px;}
  .grid-cats{display:flex;flex-wrap:wrap;gap:4px;}
  h2{margin-top:0;}
  .muted{color:var(--muted);font-size:13px;}
  .backlink{cursor:pointer;color:var(--accent);font-size:14px;margin-bottom:10px;display:inline-block;}
  .song-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;}
  .song-header .meta{color:var(--muted);font-size:14px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center;}
  .toolbar .group{display:flex;align-items:center;gap:6px;background:#f0f2f3;border-radius:8px;padding:4px 8px;}
  .toolbar button.icon{background:none;border:none;font-size:15px;cursor:pointer;padding:4px 8px;color:var(--teal-dark);}
  #chartScroll{max-height:60vh;overflow-y:auto;padding:8px 4px 40px;background:#fff;border:1px solid var(--border);border-radius:9px;}
  .chord-line{position:relative;line-height:2.7em;font-size:17px;padding:0 6px;unicode-bidi:plaintext;}
  .cw{position:relative;display:inline-block;white-space:pre;}
  .chord{position:absolute;inset-inline-start:0;top:-1.2em;color:var(--chord);font-weight:700;font-size:0.78em;white-space:nowrap;}
  .chords-used{margin:10px 0;}
  .chords-used .chip{background:#fff;border-color:var(--border);color:var(--chord);font-weight:600;cursor:default;}
  .yt-wrap{position:relative;padding-bottom:56.25%;height:0;margin:16px 0;border-radius:8px;overflow:hidden;}
  .yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;}
  form .row{display:flex;gap:12px;flex-wrap:wrap;}
  form .row > div{flex:1;min-width:180px;}
  textarea{width:100%;min-height:160px;font-family:'Courier New',monospace;}
  .preview-box{margin-top:8px;}
  .status{font-size:13px;color:var(--muted);margin-top:6px;}
  .error{color:#b33;font-size:13px;margin-top:6px;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--border);}
  table td{padding:8px 6px;border-bottom:1px solid var(--border);}
  .badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600;}
  .badge.pending{background:#fdf3d0;color:#8a6d00;}
  .badge.added{background:#dcf3e3;color:#1a7a3d;}
  .badge.declined{background:#fbe0e0;color:#a33;}
  .badge.open{background:#fbe0e0;color:#a33;}
  .badge.resolved{background:#dcf3e3;color:#1a7a3d;}
  .playlist-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;}
  .playlist-card:hover{border-color:var(--teal);}
  .playlist-card .title{font-weight:600;}
  .chat-thread{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:6px;margin-bottom:10px;}
  .msg{max-width:75%;padding:8px 12px;border-radius:12px;font-size:14px;}
  .msg.user{align-self:flex-start;background:#eef2f2;}
  .msg.admin{align-self:flex-end;background:var(--teal);color:#fff;}
  .msg .meta{font-size:11px;opacity:0.7;margin-top:3px;}
  .thread-list-item{padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;}
  .thread-list-item.active{border-color:var(--teal);background:#eef4f4;}
  .signin-gate{text-align:center;padding:30px;color:var(--muted);}
  nav button img{width:15px;height:15px;vertical-align:middle;margin-right:5px;opacity:0.9;}
  .html-chord-row{font-family:"CustomCourier",'Courier New',monospace;color:var(--chord);font-weight:700;white-space:pre-wrap;line-height:1.35;font-size:14px;}
  .html-lyric-row{font-family:"CustomCourier",'Courier New',monospace;white-space:pre-wrap;line-height:1.35;font-size:14px;margin-bottom:5px;}
  .title-hebrew{color:var(--muted);font-size:13px;direction:rtl;}
  .home-tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px;cursor:pointer;}
  .home-tile:hover{border-color:var(--teal);}
  .home-tile-icon{flex:0 0 auto;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .home-tile-icon img{width:32px;height:32px;}
  .home-tile-title{font-weight:600;font-size:15px;}
  .home-tile-desc{color:var(--muted);font-size:13px;margin-top:2px;}
</style>
</head>

<header>
  <h1 style="cursor:pointer;" onclick="goTo('home')"><img id="logoImg" alt="" style="width:24px;height:24px;vertical-align:middle;border-radius:6px;margin-right:6px;">Chord Chart App</h1>
  <nav id="mainNav"></nav>
  <div class="spacer"></div>
  <button id="shareBtn" class="btn secondary" style="padding:6px 10px;" title="Share this app"><img id="shareIcon" alt="Share" style="width:16px;height:16px;vertical-align:middle;"></button>
  <div id="userArea" class="userbox"></div>
</header>

<main id="app"></main>

<footer id="footerStatus"></footer>

/* ============================================================
   STATE — kept in memory only (no localStorage/sessionStorage).
   Returning sign-in relies on Google's own "auto_select"; a hard
   refresh may ask you to click "Sign in with Google" again.
   ============================================================ */
let songs = [];
let playlists = [];
let favorites = [];        // array of song ids the signed-in user favorited
let knownChords = [];      // array of chord names the signed-in user knows
let requestsCache = [];
let messagesCache = [];
let errorsCache = [];
let currentUser = null;    // {idToken, email, name, picture, isAdmin}
let lastSynced = null;
let view = { name: 'home' };
let filters = { q: '', artist: '', language: '', tag: '' };
let songTab = 'all';       // 'all' | 'favorites' | 'known'
let adminTab = 'requests'; // 'requests' | 'messages' | 'errors'
let editChordMode = 'simple'; // 'simple' | 'raw' — which chords+lyrics textarea is active on the Add/Edit Song form
let editChordDir = 'ltr';   // 'ltr' | 'rtl'
let editChordAlign = 'left'; // 'left' | 'right'
let chatTarget = null;     // {email,name} admin is viewing/replying to
let refreshTimer = null;

/* ============================================================
   GOOGLE SIGN-IN
   ============================================================ */
function decodeJwt(token) {
  try {
    const payload = token.split('.')[1];
    const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  } catch (e) { return {}; }
}

function handleCredentialResponse(response) {
  const claims = decodeJwt(response.credential);
  currentUser = { idToken: response.credential, email: (claims.email||'').toLowerCase(), name: claims.name || claims.email, picture: claims.picture || '', isAdmin: false };
  renderUserArea();
  loadMyData();
}

function initGoogleSignIn() {
  if (!window.google || !CONFIG.CLIENT_ID || CONFIG.CLIENT_ID.indexOf('PASTE_YOUR') === 0) return;
  google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: handleCredentialResponse, auto_select: true });
  renderUserArea();
  google.accounts.id.prompt(); // silent attempt; no-op if not eligible
}

function signOut() {
  if (window.google) google.accounts.id.disableAutoSelect();
  currentUser = null; favorites = []; knownChords = [];
  if (view.name === 'edit' || view.name === 'admin' || view.name === 'playlistDetail') goTo('list');
  renderUserArea(); render();
}

function renderUserArea() {
  const el = document.getElementById('userArea');
  if (currentUser) {
    el.innerHTML = `${currentUser.picture ? `<img src="${currentUser.picture}">` : ''}<span class="name">${escapeHtml(currentUser.name)}${currentUser.isAdmin?' (admin)':''}</span><button id="signoutBtn">Sign out</button>`;
    document.getElementById('signoutBtn').onclick = signOut;
  } else {

/* ============================================================
   CHORD PARSING + TRANSPOSE
   ============================================================ */
const NOTES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

function noteIndex(note) { let i = NOTES_SHARP.indexOf(note); if (i >= 0) return i; return NOTES_FLAT.indexOf(note); }

function transposeChord(chord, semitones) {
  if (!chord || !semitones) return chord;
  const m = chord.match(/^([A-Ga-g])(#|b)?(.*)$/);
  if (!m) return chord;
  const root = m[1].toUpperCase() + (m[2] || '');
  let rest = m[3] || ''; let bass = null;
  const slash = rest.match(/^(.*)\/([A-Ga-g])(#|b)?$/);
  if (slash) { rest = slash[1]; bass = slash[2].toUpperCase() + (slash[3] || ''); }
  const preferFlat = root.indexOf('b') >= 0;
  const idx = noteIndex(root);
  if (idx < 0) return chord;
  const newIdx = ((idx + semitones) % 12 + 12) % 12;
  let result = (preferFlat ? NOTES_FLAT : NOTES_SHARP)[newIdx] + rest;
  if (bass) {
    const bIdx = noteIndex(bass);
    if (bIdx >= 0) { const newBIdx = ((bIdx + semitones) % 12 + 12) % 12; result += '/' + (preferFlat ? NOTES_FLAT : NOTES_SHARP)[newBIdx]; }
    else result += '/' + bass;
  }
  return result;
}

function parseChordLine(line) {
  const tokens = line.split(/(\[[^\]]+\])/g);
  const segments = []; let currentChord = null;
  tokens.forEach(tok => {
    if (tok === '') return;
    const m = tok.match(/^\[([^\]]+)\]$/);
    if (m) { currentChord = m[1]; } else { segments.push({ chord: currentChord, text: tok }); currentChord = null; }
  });
  if (currentChord) segments.push({ chord: currentChord, text: ' ' });
  return segments;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Songs imported from the old app store their chart as HTML paragraph pairs
// (a "-red" chords paragraph immediately followed by a "-black" lyrics
// paragraph, spaced with &nbsp; for column alignment). New songs added
// through this app's own form use simple [Chord]word bracket notation.
// Both are supported — auto-detected here — and rendered consistently.
function isHtmlChordFormat(s) { return /<p[\s>]/i.test(s || ''); }

const SUP_PLACEHOLDER = '\u0001';
function transposeChordHtmlFragment(html, semitones) {
  if (!semitones) return html;
  const stash = [];
  const protectedHtml = html.replace(/<sup>.*?<\/sup>/gi, m => { stash.push(m); return SUP_PLACEHOLDER + (stash.length - 1) + SUP_PLACEHOLDER; });
  const parts = protectedHtml.split(/(&nbsp;| |\s+)/);
  const out = parts.map(part => {
    if (part === '' || /^(&nbsp;| |\s+)$/.test(part)) return part;
    if (/^[A-Ga-g]/.test(part)) return transposeChord(part, semitones);
    return part;
  }).join('');
  return out.replace(new RegExp(SUP_PLACEHOLDER + '(\\d+)' + SUP_PLACEHOLDER, 'g'), (m, idx) => stash[Number(idx)]);
}

// Hebrew/Yiddish text uses the Hebrew Unicode block - any such character
// means the line reads right-to-left. Chord symbols (Em, C7, ...) are
// always plain Latin letters/digits, so a chord line never "contains
// Hebrew" itself - its alignment should instead match whichever lyric
// line it sits above, not its own (irrelevant) character direction.
function containsHebrew(s) { return /[\u0590-\u05FF]/.test(s || ''); }

function renderChordHtmlBody(html, transposeSemitones) {
  const container = document.createElement('div');
  container.innerHTML = html;
  const paragraphs = Array.from(container.querySelectorAll('p'));
  const texts = paragraphs.map(p => (p.textContent || '').replace(/\xa0/g, ' ').trim());
  const isRtl = texts.map(containsHebrew);
  return paragraphs.map((p, i) => {
    const cls = (p.className || '').toLowerCase();
    const text = texts[i];
    if (text === '') return '<div class="chord-line">&nbsp;</div>';
    const isChordRow = cls.includes('red');
    let rtl = isRtl[i];
    if (isChordRow && !rtl) {
      // Borrow direction from the next non-blank line (normally the lyric
      // line right below this chord line) so chords over Hebrew/Yiddish
      // lyrics stay right-aligned, and chords over English lyrics stay left.
      for (let j = i + 1; j < paragraphs.length; j++) {
        if (texts[j] !== '') { rtl = isRtl[j]; break; }
      }
    }
    if (isChordRow) {
      // A chord line is authored as a left-to-right run of chord symbols
      // with runs of &nbsp; padding between them, positioning each chord
      // over a specific word (e.g. "C     F     Em"). That padding only
      // lines up correctly if the browser lays the line out strictly
      // left-to-right - direction:rtl here would let the bidi algorithm
      // reorder the separate chord symbols relative to each other and
      // collapse the padding between them. So a chord row always stays
      // direction:ltr; only which edge it hugs (text-align) follows the
      // paired lyric line's language, keeping chords over Hebrew/Yiddish
      // lyrics right-aligned and chords over English lyrics left-aligned.
      const inner = transposeSemitones ? transposeChordHtmlFragment(p.innerHTML, transposeSemitones) : p.innerHTML;
      const chordAlignStyle = 'direction:ltr;text-align:' + (rtl ? 'right' : 'left') + ';';
      return `<div class="html-chord-row" style="${chordAlignStyle}">${inner}</div>`;
    }
    const lyricAlignStyle = rtl ? 'direction:rtl;text-align:right;' : 'direction:ltr;text-align:left;';
    return `<div class="html-lyric-row" style="${lyricAlignStyle}">${p.innerHTML}</div>`;
  }).join('');
}

function extractChordTokensFromHtml(html, transposeSemitones) {
  const container = document.createElement('div');
  container.innerHTML = html;
  const found = new Set();
  container.querySelectorAll('p').forEach(p => {
    const cls = (p.className || '').toLowerCase();
    if (!cls.includes('red')) return;
    const text = (p.textContent || '').replace(/ /g, ' ');
    text.split(/\s+/).forEach(tok => {
      const t = tok.trim();
      if (t && /^[A-Ga-g]/.test(t)) found.add(transposeChord(t, transposeSemitones || 0));
    });
  });
  return Array.from(found);
}

function renderChart(chordsLyrics, transposeSemitones) {
  if (isHtmlChordFormat(chordsLyrics)) return renderChordHtmlBody(chordsLyrics, transposeSemitones);
  const lines = String(chordsLyrics || '').split('\n');
  return lines.map(line => {
    if (line.trim() === '') return '<div class="chord-line">&nbsp;</div>';
    const segs = parseChordLine(line);
    const html = segs.map(seg => seg.chord
      ? `<span class="cw"><span class="chord">${escapeHtml(transposeChord(seg.chord, transposeSemitones))}</span>${escapeHtml(seg.text)}</span>`
      : `<span class="cw">${escapeHtml(seg.text)}</span>`).join('');
    return `<div class="chord-line">${html}</div>`;
  }).join('');
}

function chordsUsedIn(chordsLyrics, transposeSemitones) {
  if (isHtmlChordFormat(chordsLyrics)) return extractChordTokensFromHtml(chordsLyrics, transposeSemitones);
  const found = new Set(); const re = /\[([^\]]+)\]/g; let m;
  while ((m = re.exec(chordsLyrics || ''))) found.add(transposeChord(m[1], transposeSemitones));
  return Array.from(found);
}

// ------------------------------------------------------------------
// "Simple" chord authoring: type a chord line, then the lyric line
// right below it — the same shape as writing it out on paper — and
// this auto-builds the same <p class="red">/<p class="black"> HTML
// pairs the app already reads (see isHtmlChordFormat above). This
// replaces needing Word / an HTML converter / a macro to produce that
// format by hand. A line "looks like a chord line" only if EVERY
// token on it is chord-shaped, so ordinary lyric lines (Hebrew or
// English) essentially never get mistaken for one.
const CHORD_QUALITIES = ['maj13','maj11','maj9','maj7','maj','min13','min11','min9','min7','min',
  'dim7','dim','aug','sus4','sus2','sus','add13','add11','add9','add','m7b5','m9','m7','m6','m11','m13','m',
  '13','11','9','7','6','5','4','2'];
const CHORD_TOKEN_RE = new RegExp('^[A-G](#|b|♯|♭)?(' + CHORD_QUALITIES.join('|') + ')?(\\/[A-G](#|b|♯|♭)?)?$');
const CHORD_LINE_SPECIAL_RE = /^(%|-{1,2}|N\.?C\.?|x\d+)$/i;
function isChordToken(tok) { return CHORD_TOKEN_RE.test(tok) || CHORD_LINE_SPECIAL_RE.test(tok); }
function looksLikeChordLine(line) {
  const t = line.trim();
  if (!t) return false;
  const tokens = t.split(/\s+/);
  return tokens.length > 0 && tokens.every(isChordToken);
}
function buildChordHtmlFromPlainText(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim() === '') { out.push('<p class="black">&nbsp;</p>'); continue; }
    if (looksLikeChordLine(line)) {
      out.push(`<p class="red">${escapeHtml(line)}</p>`);
      if (i + 1 < lines.length) {
        const next = lines[i + 1];
        out.push(`<p class="black">${next.trim() === '' ? '&nbsp;' : escapeHtml(next)}</p>`);
        i++;
      }
      continue;
    }
    out.push(`<p class="black">${escapeHtml(line)}</p>`);
  }
  return out.join('');
}
function htmlChordFormatToPlainText(html) {
  const container = document.createElement('div');
  container.innerHTML = html;
  const lines = Array.from(container.querySelectorAll('p')).map(p => (p.textContent || '').replace(/ /g, ' '));
  return lines.join('\n');
}

// Categories in the sheet are a single comma list mixing "language" values
// (Lashon Hakodesh, English, Yiddish…) with topical tags (Shabbos, Wedding…).
// This is how the original database stores them too — split for display.
const LANGUAGE_VALUES = ['Lashon Hakodesh','English','Hebrew - General','Yiddish','Hebrew - Torah Theme','Aramaic','Russian','French','Italian','Spanish','Ladino','Ukrainian'];
function splitCategories(cats) {
  const list = cats || [];
  const language = list.find(c => LANGUAGE_VALUES.includes(c)) || '';
  const tags = list.filter(c => c !== language);
  return { language, tags };
}

// A song's "artist" field is stored as one string, but can list more than
// one artist separated by commas (e.g. "Artist A, Artist B") - split that
// into individual names so each artist can be browsed/filtered on its own,
// with the song showing up under every one of them.
function splitArtists(artist) {
  return String(artist || '').split(',').map(a => a.trim()).filter(Boolean);
}

function extractYouTubeId(url) {
  if (!url) return null;
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? m[1] : null;
}

const COMMON_CHORDS = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B','Cm','Dm','Em','Fm','Gm','Am','Bm','C7','D7','E7','F7','G7','A7','B7'];

/* ============================================================
   SONGS LIST (All / Favorites / Known Songs)
   ============================================================ */
function songKnown(song) {
  const used = chordsUsedIn(song.chords_lyrics, 0);
  if (used.length === 0) return false;
  return used.every(c => knownChords.includes(c));
}

function filteredSongs() {
  let list = songs.filter(s => {
    const { language, tags } = splitCategories(s.categories);
    if (filters.artist && !splitArtists(s.artist).includes(filters.artist)) return false;
    if (filters.language && language !== filters.language) return false;
    if (filters.tag && !tags.includes(filters.tag)) return false;
    if (filters.q) {
      const q = filters.q.toLowerCase();
      const inLyrics = (s.lyrics_only || '').toLowerCase().includes(q);
      if (!(s.title||'').toLowerCase().includes(q) && !(s.title_hebrew||'').includes(filters.q) && !(s.artist||'').toLowerCase().includes(q) && !inLyrics) return false;
    }
    return true;
  });
  if (songTab === 'favorites') list = list.filter(s => favorites.includes(s.id));
  if (songTab === 'known') list = list.filter(songKnown);
  return list.sort((a,b) => String(a.title||'').localeCompare(String(b.title||'')));
}

function renderList() {
  const list = filteredSongs();
  const activeFilterChip = filters.artist ? `Artist: ${filters.artist}` : filters.language ? `Language: ${filters.language}` : filters.tag ? `Tag: ${filters.tag}` : null;

  let html = `<div class="subtabs">
      <button class="${songTab==='all'?'active':''}" onclick="songTab='all';render()">All Songs</button>
      <button class="${songTab==='favorites'?'active':''}" onclick="songTab='favorites';render()">Favorites</button>
      <button class="${songTab==='known'?'active':''}" onclick="songTab='known';render()">Known Songs</button>
    </div>
    <div class="searchRow">
      <input type="text" id="searchBox" placeholder="Search by title, artist, or lyrics…" value="${escapeHtml(filters.q)}">
      <button class="btn secondary" onclick="goRandomSong()"><img src="${ICONS.random}" alt="" style="width:15px;height:15px;vertical-align:middle;margin-right:5px;">Random Song</button>
      ${currentUser ? `<button class="btn secondary" onclick="goTo('knownChords')">Set Known Chords</button>` : ''}
      ${currentUser && currentUser.isAdmin ? `<button class="btn" onclick="goTo('edit')">+ Add Song</button>` : ''}
    </div>`;
  if (activeFilterChip) html += `<div style="margin-bottom:10px"><span class="chip active" onclick="filters.artist='';filters.language='';filters.tag='';render()">${escapeHtml(activeFilterChip)} ✕</span></div>`;

  if (list.length === 0) {
    html += `<div class="empty">${songTab==='favorites' ? (currentUser? 'No favorites yet — tap the star on a song.' : 'Sign in to save favorites.') : songTab==='known' ? 'No songs match your known chords yet.' : 'No songs match your search/filter.'}</div>`;
  } else {
    html += list.map(s => `
      <div class="song-row">
        <div style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;" onclick="goTo('detail',{id:'${s.id}'})">
          <div><div class="title">${escapeHtml(s.title)}${s.title_hebrew ? ` <span class="title-hebrew">${escapeHtml(s.title_hebrew)}</span>` : ''}</div><div class="artist">${escapeHtml(s.artist||'')}</div></div>
        </div>
        <span class="star ${favorites.includes(s.id)?'on':''}" onclick="event.stopPropagation();toggleFavoriteFor('${s.id}')">★</span>
      </div>`).join('');
  }
  document.getElementById('app').innerHTML = html;
  document.getElementById('searchBox').addEventListener('input', e => { filters.q = e.target.value; renderListRowsOnly(); });
}
function renderListRowsOnly() {
  const list = filteredSongs();
  const container = document.getElementById('app');
  container.querySelectorAll('.song-row, .empty').forEach(r => r.remove());
  const html = list.length === 0 ? `<div class="empty">No songs match your search/filter.</div>` : list.map(s => `
      <div class="song-row">
        <div style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;" onclick="goTo('detail',{id:'${s.id}'})">
          <div><div class="title">${escapeHtml(s.title)}${s.title_hebrew ? ` <span class="title-hebrew">${escapeHtml(s.title_hebrew)}</span>` : ''}</div><div class="artist">${escapeHtml(s.artist||'')}</div></div>
        </div>
        <span class="star ${favorites.includes(s.id)?'on':''}" onclick="event.stopPropagation();toggleFavoriteFor('${s.id}')">★</span>
      </div>`).join('');
  container.insertAdjacentHTML('beforeend', html);
}

function goRandomSong() {
  const list = filteredSongs().length ? filteredSongs() : songs;
  if (list.length === 0) { alert('No songs to pick from yet.'); return; }
  const pick = list[Math.floor(Math.random() * list.length)];
  goTo('detail', { id: pick.id });
}

function shareApp() {
  const url = window.location.href;
  if (navigator.share) { navigator.share({ title: 'Chord Chart App', url }).catch(()=>{}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => alert('Link copied — paste it to share the app!')).catch(() => prompt('Copy this link to share the app:', url));
  } else {
    prompt('Copy this link to share the app:', url);
  }
}

function toggleFavoriteFor(songId) {
  if (!currentUser) { alert('Sign in with Google first to save favorites.'); return; }
  api('toggleFavorite', { song_id: songId }).then(r => {
    if (r.favorited) favorites.push(songId); else favorites = favorites.filter(id => id !== songId);
    render();
  }).catch(err => alert(err.message));
}

   KNOWN CHORDS PICKER
   ============================================================ */
function renderKnownChords() {
  if (!currentUser) { document.getElementById('app').innerHTML = '<div class="empty">Sign in to set your known chords.</div>'; return; }
  let html = `<span class="backlink" onclick="goTo('list')">‹ Back to Songs</span>

    <div class="grid-cats" id="chordPicker">` +

/* ============================================================
   ARTISTS / CATEGORIES
   ============================================================ */
function renderArtists() {
  const counts = {};
  songs.forEach(s => { splitArtists(s.artist).forEach(a => { counts[a] = (counts[a]||0)+1; }); });
  const artists = Object.keys(counts).sort((a,b)=>a.localeCompare(b));
  let html = '<h2>Artists</h2><div class="grid-cats">' +
    (artists.map(a => `<span class="chip" onclick="filters.artist='${a.replace(/'/g,"\\'")}';goTo('list')">${escapeHtml(a)} <span class="count">(${counts[a]})</span></span>`).join('') || '<span class="muted">No artists yet.</span>') + '</div>';
  document.getElementById('app').innerHTML = html;
}
function renderCategories() {
  const langCounts = {}, tagCounts = {};
  songs.forEach(s => {
    const { language, tags } = splitCategories(s.categories);
    if (language) langCounts[language] = (langCounts[language]||0)+1;
    tags.forEach(t => tagCounts[t] = (tagCounts[t]||0)+1);
  });
  const langs = Object.keys(langCounts).sort((a,b)=>a.localeCompare(b));
  const tags = Object.keys(tagCounts).sort((a,b)=>a.localeCompare(b));
  let html = '<h2>Language</h2><div class="grid-cats">' +
    (langs.map(l => `<span class="chip" onclick="filters.language='${l.replace(/'/g,"\\'")}';goTo('list')">${escapeHtml(l)} <span class="count">(${langCounts[l]})</span></span>`).join('') || '<span class="muted">None yet</span>') +
    '</div><h2>Tags</h2><div class="grid-cats">' +
    (tags.map(t => `<span class="chip" onclick="filters.tag='${t.replace(/'/g,"\\'")}';goTo('list')">${escapeHtml(t)} <span class="count">(${tagCounts[t]})</span></span>`).join('') || '<span class="muted">None yet</span>') + '</div>';
  document.getElementById('app').innerHTML = html;
}

/* ============================================================
   SONG DETAIL
   ============================================================ */
let playerState = { playing:false, speed:1.0, delay:false, capo:0, timer:null, songId:null };
let showReportForm = false;

function renderDetail() {
  const song = songs.find(s => s.id === view.id);
  if (!song) { document.getElementById('app').innerHTML = '<div class="empty">Song not found.</div>'; return; }
  playerState.capo = (playerState.songId === song.id) ? playerState.capo : song.capo;
  playerState.songId = song.id;
  const transpose = (song.capo||0) - playerState.capo;
  const ytId = extractYouTubeId(song.youtube_url);
  const isFav = favorites.includes(song.id);

  const { language, tags } = splitCategories(song.categories);
  let html = `<span class="backlink" onclick="goTo('list')">‹ Back to Songs</span>
    <div class="song-header">
      <div><h2 style="margin-bottom:2px">${escapeHtml(song.title)}${song.title_hebrew ? ` <span class="title-hebrew">${escapeHtml(song.title_hebrew)}</span>` : ''}</h2><div class="meta">${escapeHtml(song.artist||'')}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn secondary" onclick="toggleFavoriteFor('${song.id}')">${isFav?'★ Favorited':'☆ Favorite'}</button>
        <button class="btn secondary" onclick="openAddToPlaylist('${song.id}')">+ Playlist</button>
        ${currentUser && currentUser.isAdmin ? `<button class="btn secondary" onclick="goTo('edit',{id:'${song.id}'})">Edit</button>
        <button class="btn danger" onclick="deleteSongConfirm('${song.id}')">Delete</button>` : ''}
      </div>
    </div>

    <div class="toolbar">
      <div class="group"><button class="icon" onclick="changeCapo(-1)">−</button><span>Capo ${playerState.capo}</span><button class="icon" onclick="changeCapo(1)">+</button></div>
      <button class="btn secondary" onclick="playerState.capo=0;renderDetail();">No capo</button>
      <button class="btn secondary" onclick="playerState.capo=${song.capo||0};renderDetail();">Reset to ${song.capo||0}</button>
      <div class="group"><button class="icon" onclick="togglePlay()">${playerState.playing ? '⏸' : '▶'}</button><button class="icon" onclick="changeSpeed(-0.2)">−</button><span>${playerState.speed.toFixed(1)}x</span><button class="icon" onclick="changeSpeed(0.2)">+</button></div>
      <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;margin:0;"><input type="checkbox" ${playerState.delay?'checked':''} onchange="playerState.delay=this.checked"> 5s delay</label>
      <button class="btn secondary" onclick="window.print()">🖶 Print</button>
      <button class="btn secondary" onclick="showReportForm=!showReportForm;renderDetail();"><img src="${ICONS.report}" alt="" style="width:15px;height:15px;vertical-align:middle;margin-right:5px;">Report issue</button>
    </div>

    ${showReportForm ? renderReportForm(song) : ''}

    <div class="chords-used">Chords in song: ${chordsUsedIn(song.chords_lyrics, transpose).map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join(' ') || '<span class="muted">none tagged</span>'}</div>
    <div id="chartScroll">${renderChart(song.chords_lyrics, transpose)}</div>
    ${ytId ? `<div class="yt-wrap"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>` : ''}
    <div class="grid-cats" style="margin-top:10px">${tags.map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join('')}${language ? `<span class="chip">${escapeHtml(language)}</span>` : ''}</div>`;

  document.getElementById('app').innerHTML = html;
}

function renderReportForm(song) {
  if (!currentUser) return `<div class="card">Sign in with Google to report an issue with this song.</div>`;
  return `<div class="card">
    <label>What's wrong with this chart?</label>
    <textarea id="reportDesc" style="min-height:70px;font-family:inherit;" placeholder="e.g. the chords in verse 2 are off by one word"></textarea>
    <div style="margin-top:8px"><button class="btn" onclick="submitReport('${song.id}')">Submit report</button> <span id="reportStatus" class="status"></span></div>
  </div>`;
}
function submitReport(songId) {
  const song = songs.find(s => s.id === songId);
  const desc = document.getElementById('reportDesc').value.trim();
  const statusEl = document.getElementById('reportStatus');
  if (!desc) { statusEl.textContent = 'Please describe the issue.'; statusEl.className='error'; return; }
  statusEl.textContent = 'Sending…';
  api('createErrorReport', { song_id: songId, song_title: song.title, artist: song.artist, description: desc })
    .then(()=>{ showReportForm=false; renderDetail(); alert('Thanks — your report was sent.'); })
    .catch(err => { statusEl.textContent = 'Error: '+err.message; statusEl.className='error'; });
}

function changeCapo(delta) { playerState.capo = Math.max(0, Math.min(11, playerState.capo + delta)); renderDetail(); }
function changeSpeed(delta) { playerState.speed = Math.max(0.2, Math.min(3, +(playerState.speed + delta).toFixed(1))); renderDetail(); }
function togglePlay() {
  if (playerState.playing) { stopScroll(); return; }
  playerState.playing = true;
  if (playerState.delay) { renderDetail(); setTimeout(startScroll, 5000); } else { startScroll(); }
  renderDetail();
}
function startScroll() {
  const el = document.getElementById('chartScroll'); if (!el) return;
  clearInterval(playerState.timer);
  playerState.timer = setInterval(() => {
    if (!el.isConnected) { stopScroll(); return; }
    el.scrollTop += playerState.speed * 0.7;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 2) stopScroll();
  }, 40);
}
function stopScroll() { clearInterval(playerState.timer); playerState.timer=null; playerState.playing=false; renderDetail(); }

function deleteSongConfirm(id) {
  if (!confirm('Delete this song? This cannot be undone.')) return;
  api('deleteSong', { id }).then(() => loadSongs(false)).then(()=>goTo('list')).catch(err => alert('Could not delete: ' + err.message));
}

/* ============================================================
   ADD / EDIT SONG (admin only)
   ============================================================ */
function renderEdit() {
  if (!currentUser || !currentUser.isAdmin) { document.getElementById('app').innerHTML = '<div class="empty">Sign in with an admin Google account to add or edit songs.</div>'; return; }
  const song = view.id ? songs.find(s => s.id === view.id) : null;
  const s = song || { title:'', title_hebrew:'', artist:'', categories:[], capo:0, youtube_url:'', chords_lyrics:'', lyrics_only:'' };
  const { language, tags } = splitCategories(s.categories);
  const stored = s.chords_lyrics || '';
  const storedIsHtml = isHtmlChordFormat(stored);
  editChordMode = (stored === '' || storedIsHtml) ? 'simple' : 'raw';
  editChordDir = 'ltr';
  editChordAlign = 'left';
  const simpleText = storedIsHtml ? htmlChordFormatToPlainText(stored) : (editChordMode === 'simple' ? stored : '');
  const rawText = stored;
  const html = `<span class="backlink" onclick="goTo(${song ? `'detail',{id:'${s.id}'}` : `'list'`})">‹ Cancel</span>
    <h2>${song ? 'Edit Song' : 'Add Song'}</h2>
    <form onsubmit="return saveSong(event, ${song ? `'${s.id}'` : 'null'})">
      <div class="row">
        <div><label>Title</label><input type="text" id="f_title" value="${escapeHtml(s.title)}" required></div>
        <div><label>Title (Hebrew, optional)</label><input type="text" id="f_title_hebrew" dir="auto" value="${escapeHtml(s.title_hebrew||'')}"></div>
      </div>
      <div class="row">
        <div><label>Artist</label><input type="text" id="f_artist" value="${escapeHtml(s.artist)}"></div>
        <div><label>YouTube URL (optional)</label><input type="text" id="f_youtube" value="${escapeHtml(s.youtube_url||'')}" placeholder="https://youtube.com/watch?v=…"></div>
      </div>
      <div class="row">
        <div><label>Language</label><input type="text" id="f_language" value="${escapeHtml(language)}" placeholder="e.g. Lashon Hakodesh, English, Yiddish"></div>
        <div><label>Tags (comma separated)</label><input type="text" id="f_tags" value="${escapeHtml(tags.join(', '))}" placeholder="e.g. Shabbos, Wedding"></div>
      </div>
      <div class="row">
        <div><label>Capo (fret the chords below assume)</label><input type="number" id="f_capo" value="${s.capo||0}" min="0" max="11"></div>
      </div>
      <div class="row" style="align-items:center;flex-wrap:wrap;gap:8px 16px;">
        <label style="margin:0;">Chords + Lyrics</label>
        <div class="subtabs" style="margin:0;">
          <button type="button" id="modeSimpleBtn" class="${editChordMode==='simple'?'active':''}" onclick="setEditChordMode('simple')">Simple</button>
          <button type="button" id="modeRawBtn" class="${editChordMode==='raw'?'active':''}" onclick="setEditChordMode('raw')">Advanced</button>
        </div>
        <div style="margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;">
          <div title="Which way typing/the cursor flows in the box below — switch to RTL while typing a Hebrew/Yiddish lyric line, back to LTR for a chord line.">
            <span class="muted" style="font-size:12px;margin-right:4px;">Typing direction:</span>
            <div class="subtabs" style="margin:0;display:inline-flex;">
              <button type="button" id="dirLtrBtn" class="${editChordDir==='ltr'?'active':''}" onclick="setChordTextDir('ltr')">LTR</button>
              <button type="button" id="dirRtlBtn" class="${editChordDir==='rtl'?'active':''}" onclick="setChordTextDir('rtl')">RTL</button>
            </div>
          </div>
          <div title="Which edge the lines in the box hug — the final song page always right-aligns Hebrew/Yiddish lines, so switch this to Right to preview chord spacing the way it'll actually look.">
            <span class="muted" style="font-size:12px;margin-right:4px;">Align:</span>
            <div class="subtabs" style="margin:0;display:inline-flex;">
              <button type="button" id="alignLeftBtn" class="${editChordAlign==='left'?'active':''}" onclick="setChordTextAlign('left')">Left</button>
              <button type="button" id="alignRightBtn" class="${editChordAlign==='right'?'active':''}" onclick="setChordTextAlign('right')">Right</button>
            </div>
          </div>
        </div>
      </div>
      <div id="simpleHint" class="muted" style="margin:4px 0 6px;font-size:13px;" ${editChordMode==='simple'?'':'hidden'}>Type the chord line, then the lyric line right below it — just like on paper. Leave a blank line between sections. (No coloring or special formatting needed — this box is plain text.) Chord names are always English, so for a Hebrew/Yiddish song use the Typing direction / Align controls above to switch back and forth as you go.</div>
      <div id="rawHint" class="muted" style="margin:4px 0 6px;font-size:13px;" ${editChordMode==='raw'?'':'hidden'}>Put each chord in brackets right before the word it plays over, e.g. <code>[D]ארבעים [G]יום</code> — or paste in HTML chord-chart markup directly.</div>
      <textarea id="f_chords_simple" dir="${editChordDir}" style="text-align:${editChordAlign};" oninput="updatePreview()" ${editChordMode==='simple'?'':'hidden'}>${escapeHtml(simpleText)}</textarea>
      <textarea id="f_chords_raw" dir="${editChordDir}" style="text-align:${editChordAlign};" oninput="updatePreview()" ${editChordMode==='raw'?'':'hidden'}>${escapeHtml(rawText)}</textarea>
      <div class="card preview-box"><div class="muted" style="margin-bottom:6px">Live preview</div><div id="previewChart">${renderChart(stored, 0)}</div></div>
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center;">
        <button class="btn" type="submit">${song ? 'Save Changes' : 'Add Song'}</button>
        <span id="saveStatus" class="status"></span>
      </div>
    </form>`;
  document.getElementById('app').innerHTML = html;
}
function currentChordsLyricsValue() {
  return editChordMode === 'simple'
    ? buildChordHtmlFromPlainText(document.getElementById('f_chords_simple').value)
    : document.getElementById('f_chords_raw').value;
}
function setEditChordMode(mode) {
  if (mode === editChordMode) return;
  const simpleEl = document.getElementById('f_chords_simple');
  const rawEl = document.getElementById('f_chords_raw');
  if (mode === 'raw') {
    rawEl.value = buildChordHtmlFromPlainText(simpleEl.value);
  } else {
    simpleEl.value = isHtmlChordFormat(rawEl.value) ? htmlChordFormatToPlainText(rawEl.value) : rawEl.value;
  }
  editChordMode = mode;
  simpleEl.hidden = mode !== 'simple';
  rawEl.hidden = mode !== 'raw';
  document.getElementById('simpleHint').hidden = mode !== 'simple';
  document.getElementById('rawHint').hidden = mode !== 'raw';
  document.getElementById('modeSimpleBtn').classList.toggle('active', mode === 'simple');
  document.getElementById('modeRawBtn').classList.toggle('active', mode === 'raw');
  updatePreview();
}
// Manual typing-direction / alignment controls for the chords+lyrics boxes
// (see the comment on editChordDir/editChordAlign above for why this isn't
// auto-detected). Applied to both textareas so the setting sticks across
// Simple/Advanced switches, not just re-rendered HTML.
function setChordTextDir(dir) {
  editChordDir = dir;
  document.getElementById('f_chords_simple').dir = dir;
  document.getElementById('f_chords_raw').dir = dir;
  document.getElementById('dirLtrBtn').classList.toggle('active', dir === 'ltr');
  document.getElementById('dirRtlBtn').classList.toggle('active', dir === 'rtl');
}
function setChordTextAlign(align) {
  editChordAlign = align;
  document.getElementById('f_chords_simple').style.textAlign = align;
  document.getElementById('f_chords_raw').style.textAlign = align;
  document.getElementById('alignLeftBtn').classList.toggle('active', align === 'left');
  document.getElementById('alignRightBtn').classList.toggle('active', align === 'right');
}
function updatePreview() { document.getElementById('previewChart').innerHTML = renderChart(currentChordsLyricsValue(), 0); }
function saveSong(evt, id) {
  evt.preventDefault();
  const song = {
    id: id || undefined,
    title: document.getElementById('f_title').value.trim(),
    title_hebrew: document.getElementById('f_title_hebrew').value.trim(),
    artist: document.getElementById('f_artist').value.trim(),
    categories: [document.getElementById('f_language').value.trim()].concat(
      document.getElementById('f_tags').value.split(',').map(t=>t.trim())
    ).filter(Boolean),
    capo: Number(document.getElementById('f_capo').value) || 0,
    youtube_url: document.getElementById('f_youtube').value.trim(),
    chords_lyrics: currentChordsLyricsValue()
  };
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Saving…'; statusEl.className = 'status';
  api(id ? 'updateSong' : 'createSong', { song })
    .then(() => loadSongs(false))
    .then(() => goTo(id ? 'detail' : 'list', id ? {id} : {}))
    .catch(err => { statusEl.textContent = 'Error: ' + err.message; statusEl.className = 'error'; });
  return false;
}

/* ============================================================
   PLAYLISTS
   ============================================================ */
function renderPlaylists() {
  if (!currentUser) {
    const pub = playlists.filter(p => p.visibility === 'public');
    document.getElementById('app').innerHTML = `<h2>Public Playlists</h2>` + renderPlaylistCards(pub) + `<div class="empty">Sign in with Google to make your own playlists.</div>`;
    return;
  }
  const mine = playlists.filter(p => p.owner_email === currentUser.email);
  const shared = playlists.filter(p => p.owner_email !== currentUser.email && p.visibility === 'shared' && (p.shared_with||[]).includes(currentUser.email));
  const pub = playlists.filter(p => p.visibility === 'public' && p.owner_email !== currentUser.email);
  let html = `<div class="searchRow"><div class="spacer"></div><button class="btn" onclick="createPlaylistPrompt()">+ New Playlist</button></div>`;
  html += `<h2>My Playlists</h2>` + (mine.length? renderPlaylistCards(mine) : '<div class="muted">None yet.</div>');
  html += `<h2>Shared with me</h2>` + (shared.length? renderPlaylistCards(shared) : '<div class="muted">None yet.</div>');
  html += `<h2>Public Playlists</h2>` + (pub.length? renderPlaylistCards(pub) : '<div class="muted">None yet.</div>');
  document.getElementById('app').innerHTML = html;
}
function renderPlaylistCards(list) {
  return list.map(p => `<div class="playlist-card" onclick="goTo('playlistDetail',{id:'${p.id}'})">
    <div class="title">${escapeHtml(p.title)}</div>
    <div class="muted">${(p.song_ids||[]).length} songs · ${p.visibility === 'public' ? 'Public' : p.visibility === 'shared' ? 'Shared' : 'Private'} · by ${escapeHtml(p.owner_name||p.owner_email)}</div>
  </div>`).join('');
}
function createPlaylistPrompt() {
  const title = prompt('Playlist name?');
  if (!title) return;
  api('createPlaylist', { title, visibility: 'private', song_ids: [], shared_with: [] })
    .then(() => loadSongs(false)).then(() => goTo('playlists'))
    .catch(err => alert(err.message));
}
function renderPlaylistDetail() {
  const p = playlists.find(pl => pl.id === view.id);
  if (!p) { document.getElementById('app').innerHTML = '<div class="empty">Playlist not found.</div>'; return; }
  const isOwner = currentUser && p.owner_email === currentUser.email;
  const canEdit = isOwner || (currentUser && currentUser.isAdmin);
  const list = (p.song_ids||[]).map(id => songs.find(s => s.id === id)).filter(Boolean);
  let html = `<span class="backlink" onclick="goTo('playlists')">‹ Back to Playlists</span>
    <div class="song-header">
      <div><h2 style="margin-bottom:2px">${escapeHtml(p.title)}</h2><div class="meta">by ${escapeHtml(p.owner_name||p.owner_email)} · ${p.visibility}</div></div>
      ${canEdit ? `<div><button class="btn secondary" onclick="editPlaylistSettings('${p.id}')">Settings</button> <button class="btn danger" onclick="deletePlaylistConfirm('${p.id}')">Delete</button></div>` : ''}
    </div>`;
  html += list.length ? list.map(s => `
    <div class="song-row">
      <div style="cursor:pointer;flex:1" onclick="goTo('detail',{id:'${s.id}'})"><div class="title">${escapeHtml(s.title)}</div><div class="artist">${escapeHtml(s.artist||'')}</div></div>
      ${canEdit ? `<button class="btn secondary" onclick="removeFromPlaylist('${p.id}','${s.id}')">Remove</button>` : ''}
    </div>`).join('') : '<div class="empty">No songs in this playlist yet.</div>';
  document.getElementById('app').innerHTML = html;
}
function editPlaylistSettings(id) {
  const p = playlists.find(pl => pl.id === id);
  const title = prompt('Playlist name:', p.title); if (title === null) return;
  const vis = prompt('Visibility — type private, shared, or public:', p.visibility) || p.visibility;
  let sharedWith = p.shared_with || [];
  if (vis === 'shared') {
    const emails = prompt('Share with which email addresses? (comma separated)', sharedWith.join(', '));
    sharedWith = (emails||'').split(',').map(e=>e.trim()).filter(Boolean);
  }
  api('updatePlaylist', { id, title, visibility: vis, shared_with: sharedWith })
    .then(() => loadSongs(false)).then(() => render()).catch(err => alert(err.message));
}
function deletePlaylistConfirm(id) {
  if (!confirm('Delete this playlist?')) return;
  api('deletePlaylist', { id }).then(() => loadSongs(false)).then(() => goTo('playlists')).catch(err => alert(err.message));
}
function removeFromPlaylist(playlistId, songId) {
  const p = playlists.find(pl => pl.id === playlistId);
  const newIds = (p.song_ids||[]).filter(id => id !== songId);
  api('updatePlaylist', { id: playlistId, song_ids: newIds }).then(() => loadSongs(false)).then(() => render()).catch(err => alert(err.message));
}
function openAddToPlaylist(songId) {
  if (!currentUser) { alert('Sign in with Google first to use playlists.'); return; }
  const mine = playlists.filter(p => p.owner_email === currentUser.email);
  if (mine.length === 0) {
    if (!confirm('You have no playlists yet. Create one now?')) return;
    const title = prompt('Playlist name?'); if (!title) return;
    api('createPlaylist', { title, visibility:'private', song_ids:[songId], shared_with:[] })
      .then(() => loadSongs(false)).then(() => alert('Added to "'+title+'".')).catch(err => alert(err.message));
    return;
  }
  const choice = prompt('Add to which playlist?\n' + mine.map((p,i)=>(i+1)+'. '+p.title).join('\n') + '\n\nType a number, or "new" for a new playlist:');
  if (!choice) return;
  if (choice.trim().toLowerCase() === 'new') {
    const title = prompt('Playlist name?'); if (!title) return;
    api('createPlaylist', { title, visibility:'private', song_ids:[songId], shared_with:[] })
      .then(() => loadSongs(false)).then(() => alert('Added to "'+title+'".')).catch(err => alert(err.message));
    return;
  }
  const idx = parseInt(choice, 10) - 1;
  const p = mine[idx];
  if (!p) { alert('Not a valid choice.'); return; }
  const newIds = Array.from(new Set((p.song_ids||[]).concat([songId])));
  api('updatePlaylist', { id: p.id, song_ids: newIds }).then(() => loadSongs(false)).then(() => alert('Added to "'+p.title+'".')).catch(err => alert(err.message));
}

/* ============================================================
   CONTACT — song requests + support chat
   ============================================================ */
function renderContact() {
  if (!currentUser) { document.getElementById('app').innerHTML = '<div class="empty">Sign in with Google to request a song or message your teacher.</div>'; return; }
  Promise.all([api('getRequests', {}), api('getMessages', {})]).then(([reqData, msgData]) => {
    requestsCache = reqData.requests || []; messagesCache = msgData.messages || [];
    let html = `<h2>Request a Song</h2>
      <p class="muted">Up to 2 requests per week.</p>
      <div class="row">
        <div><label>Song title</label><input type="text" id="req_title"></div>
        <div><label>Artist</label><input type="text" id="req_artist"></div>
      </div>
      <label>Note (optional)</label><input type="text" id="req_note">
      <div style="margin-top:8px"><button class="btn" onclick="submitRequest()">Request Song</button> <span id="reqStatus" class="status"></span></div>
      <h2 style="margin-top:24px">My Song Requests</h2>
      <table><tr><th>Status</th><th>Song</th><th>Artist</th></tr>
      ${requestsCache.map(r => `<tr><td><span class="badge ${r.status}">${r.status}</span></td><td>${escapeHtml(r.song_title)}</td><td>${escapeHtml(r.artist)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No requests yet.</td></tr>'}
      </table>
      <h2 style="margin-top:24px">Message your teacher</h2>
      <div class="chat-thread" id="chatThread">${renderChatMessages(messagesCache)}</div>
      <div style="display:flex;gap:8px"><input type="text" id="chatInput" placeholder="Type a message…" style="flex:1"><button class="btn" onclick="sendChatMessage()">Send</button></div>`;
    document.getElementById('app').innerHTML = html;
    const thread = document.getElementById('chatThread'); if (thread) thread.scrollTop = thread.scrollHeight;
  }).catch(err => { document.getElementById('app').innerHTML = `<div class="error">${err.message}</div>`; });
}
function renderChatMessages(list) {
  return list.slice().sort((a,b)=> new Date(a.created_at)-new Date(b.created_at))
    .map(m => `<div class="msg ${m.sender}">${escapeHtml(m.text)}<div class="meta">${new Date(m.created_at).toLocaleString()}</div></div>`).join('') || '<div class="muted">No messages yet — say hi!</div>';
}
function submitRequest() {
  const song_title = document.getElementById('req_title').value.trim();
  const artist = document.getElementById('req_artist').value.trim();
  const note = document.getElementById('req_note').value.trim();
  const statusEl = document.getElementById('reqStatus');
  if (!song_title) { statusEl.textContent = 'Please enter a song title.'; statusEl.className='error'; return; }
  statusEl.textContent = 'Sending…';
  api('createRequest', { song_title, artist, note }).then(() => renderContact()).catch(err => { statusEl.textContent = 'Error: '+err.message; statusEl.className='error'; });
}
function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim(); if (!text) return;
  input.value = '';
  api('sendMessage', { text }).then(() => renderContact()).catch(err => alert(err.message));
}

/* ============================================================
   ADMIN PANEL — requests / messages / errors
   ============================================================ */
function renderAdmin() {
  if (!currentUser || !currentUser.isAdmin) { document.getElementById('app').innerHTML = '<div class="empty">Admin only.</div>'; return; }
  let html = `<div class="subtabs">
      <button class="${adminTab==='requests'?'active':''}" onclick="adminTab='requests';render()">Song Requests</button>
      <button class="${adminTab==='messages'?'active':''}" onclick="adminTab='messages';render()">Messages</button>
      <button class="${adminTab==='errors'?'active':''}" onclick="adminTab='errors';render()">Error Reports</button>
    </div><div id="adminBody">Loading…</div>`;
  document.getElementById('app').innerHTML = html;
  if (adminTab === 'requests') loadAdminRequests();
  else if (adminTab === 'messages') loadAdminMessages();
  else loadAdminErrors();
}
function loadAdminRequests() {
  api('getRequests', {}).then(data => {
    requestsCache = data.requests || [];
    const body = document.getElementById('adminBody');
    body.innerHTML = `<table><tr><th>Status</th><th>Song</th><th>Artist</th><th>Requested by</th><th>Note</th><th></th></tr>` +
      requestsCache.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(r => `<tr>
        <td><span class="badge ${r.status}">${r.status}</span></td><td>${escapeHtml(r.song_title)}</td><td>${escapeHtml(r.artist)}</td>
        <td>${escapeHtml(r.user_name)}<br><span class="muted">${escapeHtml(r.user_email)}</span></td><td>${escapeHtml(r.note)}</td>
        <td>${r.status==='pending' ? `<button class="btn secondary" onclick="setRequestStatus('${r.id}','added')">Mark added</button> <button class="btn danger" onclick="setRequestStatus('${r.id}','declined')">Decline</button>` : ''}</td>
      </tr>`).join('') + `</table>`;
  }).catch(err => { document.getElementById('adminBody').innerHTML = `<div class="error">${err.message}</div>`; });
}
function setRequestStatus(id, status) {
  api('updateRequestStatus', { id, status }).then(loadAdminRequests).catch(err => alert(err.message));
}
function loadAdminMessages() {
  api('getMessages', {}).then(data => {
    messagesCache = data.messages || [];
    const byUser = {};
    messagesCache.forEach(m => { (byUser[m.user_email] = byUser[m.user_email] || []).push(m); });
    const emails = Object.keys(byUser).sort((a,b) => {
      const la = byUser[a].map(m=>new Date(m.created_at)).sort().pop();
      const lb = byUser[b].map(m=>new Date(m.created_at)).sort().pop();
      return lb - la;
    });
    if (!chatTarget && emails.length) chatTarget = { email: emails[0], name: byUser[emails[0]][0].user_name };
    const body = document.getElementById('adminBody');
    body.innerHTML = `<div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div style="flex:1;min-width:220px;">${emails.map(e => `<div class="thread-list-item ${chatTarget && chatTarget.email===e?'active':''}" onclick='selectThread(${JSON.stringify(e)},${JSON.stringify(byUser[e][0].user_name)})'>
          <span>${escapeHtml(byUser[e][0].user_name)}<br><span class="muted">${escapeHtml(e)}</span></span></div>`).join('') || '<div class="muted">No messages yet.</div>'}</div>
      <div style="flex:2;min-width:260px;">
        ${chatTarget ? `<div class="chat-thread" id="adminChatThread">${renderChatMessages(byUser[chatTarget.email]||[])}</div>
        <div style="display:flex;gap:8px"><input type="text" id="adminChatInput" placeholder="Reply…" style="flex:1"><button class="btn" onclick="sendAdminReply()">Send</button></div>` : '<div class="muted">Select a conversation.</div>'}
      </div></div>`;
    const t = document.getElementById('adminChatThread'); if (t) t.scrollTop = t.scrollHeight;
  }).catch(err => { document.getElementById('adminBody').innerHTML = `<div class="error">${err.message}</div>`; });
}
function selectThread(email, name) { chatTarget = { email, name }; loadAdminMessages(); }
function sendAdminReply() {
  const input = document.getElementById('adminChatInput');
  const text = input.value.trim(); if (!text || !chatTarget) return;
  input.value = '';
  api('sendMessage', { text, target_email: chatTarget.email, target_name: chatTarget.name }).then(loadAdminMessages).catch(err => alert(err.message));
}
function loadAdminErrors() {
  api('getErrors', {}).then(data => {
    errorsCache = data.errors || [];
    document.getElementById('adminBody').innerHTML = `<table><tr><th>Status</th><th>Song</th><th>Reported by</th><th>Description</th><th></th></tr>` +
      errorsCache.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(e => `<tr>
        <td><span class="badge ${e.status}">${e.status}</span></td>
        <td>${escapeHtml(e.song_title)}<br><span class="muted">${escapeHtml(e.artist)}</span></td>
        <td>${escapeHtml(e.user_name)}<br><span class="muted">${escapeHtml(e.user_email)}</span></td>
        <td>${escapeHtml(e.description)}</td>
        <td>${e.status==='open' ? `<button class="btn secondary" onclick="setErrorStatus('${e.id}','resolved')">Mark resolved</button>` : ''}</td>
      </tr>`).join('') + `</table>`;
  }).catch(err => { document.getElementById('adminBody').innerHTML = `<div class="error">${err.message}</div>`; });
}
function setErrorStatus(id, status) { api('updateErrorReport', { id, status }).then(loadAdminErrors).catch(err => alert(err.message)); }

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render() {
  renderNav();
  if (!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
    document.getElementById('app').innerHTML = `<div class="card"><h2>One setup step left</h2>
      <p>Deploy the included <code>Code.gs</code> as an Apps Script Web App, then paste the Web App URL into
      <code>CONFIG.SCRIPT_URL</code>, and your Google OAuth Client ID into <code>CONFIG.CLIENT_ID</code>,
      near the top of this file. See SETUP.md for the full walkthrough.</p></div>`;
    return;
  }
  if (view.name === 'home') renderHome();
  else if (view.name === 'list') renderList();
  else if (view.name === 'artists') renderArtists();
  else if (view.name === 'categories') renderCategories();
  else if (view.name === 'detail') renderDetail();
  else if (view.name === 'edit') renderEdit();
  else if (view.name === 'knownChords') renderKnownChords();
  else if (view.name === 'playlists') renderPlaylists();
  else if (view.name === 'playlistDetail') renderPlaylistDetail();
  else if (view.name === 'contact') renderContact();
  else if (view.name === 'admin') renderAdmin();
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('logoImg').src = ICONS.logo;
document.getElementById('shareIcon').src = ICONS.share;
document.getElementById('shareBtn').onclick = shareApp;
renderUserArea();
loadSongs(true);
window.addEventListener('load', initGoogleSignIn);
refreshTimer = setInterval(() => loadSongs(false), CONFIG.AUTO_REFRESH_SECONDS * 1000);
</script>
</body>
</html>
