// Song ids with a toggleFavorite request currently in flight — guards
// against a double-tap (very easy to do while waiting on the Apps Script
// round trip, which can take a second or more) sending two overlapping
// toggle requests for the same song. The backend's toggle isn't a "set to
// X", it's a true flip, so two overlapping requests can race each other —
// both client-side (a confusing flip-flip-flicker as each response lands)
// and, worse, server-side (both reading the sheet before either has
// committed, which can leave a duplicate or inconsistent row behind). This
// makes a repeat tap on a song already mid-toggle a no-op until the first
// request settles.
const pendingFavoriteToggles = new Set();
// Updates just the star(s)/tile for one song's favorite state directly in the
// DOM, instead of calling the heavy full-page render(). This used to be the
// real cause behind "I have to tap the heart 3 times before it sticks":
// render() for the song list (renderList()) doesn't just redraw the rows —
// it replaces the ENTIRE #app innerHTML, including the search box and
// subtabs, on every single tap. Tearing down and recreating the very
// element a tap just landed on, WHILE that tap's own click is still being
// processed, is a well-known way for a phone's browser to lose the next tap
// or two — the element the next physical tap lands on isn't the one that
// existed when the finger went down, so nothing fires, and the person just
// sees "nothing happened" and taps again (and again) until timing happens
// to line up. Only touching the specific star/tile elements for this one
// song avoids that churn entirely, no matter how many are on screen.
function syncFavoriteUI_(songId, isFav) {
  document.querySelectorAll(`[data-fav-star="${cssEscape_(songId)}"]`).forEach(el => el.classList.toggle('on', isFav));
  const tile = document.querySelector(`[data-fav-tile="${cssEscape_(songId)}"]`);
  if (tile) {
    tile.classList.toggle('active', isFav);
    tile.innerHTML = `${isFav?SVG_ICONS.heart:SVG_ICONS.heartOutline}<div class="tile-label">${isFav?'Favorited':'Favorite'}</div>`;
  }
}
// CSS.escape isn't available in every WebView this app runs in (some older
// Android in-app browsers) - song ids are plain UUID-ish strings with no
// characters CSS.escape would ever need to touch, so this only exists as a
// defensive fallback rather than because escaping is actually expected to
// matter here.
function cssEscape_(s) { return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&'); }
function toggleFavoriteFor(songId) {
  if (!currentUser) { alert('Sign in with Google first to save favorites.'); return; }
  if (pendingFavoriteToggles.has(songId)) return;
  pendingFavoriteToggles.add(songId);
  // Optimistic update: flip the heart and redraw immediately instead of
  // waiting on the round trip to the Apps Script backend (which verifies
  // the Google ID token and scans a sheet, so it can take a second or more
  // and made the heart feel unresponsive). Reconcile with the server's
  // answer when it arrives, and revert with a message if the request fails.
  // During "View As" this mutates the impersonated user's own favorites
  // list in place (viewAsData.favorites) instead of the admin's.
  const favList = viewAsUser ? viewAsData.favorites : favorites;
  const wasFavorited = favList.includes(songId);
  if (wasFavorited) favList.splice(favList.indexOf(songId), 1); else favList.push(songId);
  const nowFav = !wasFavorited;
  // Unfavoriting while actually looking at the Favorites tab is the one case
  // a targeted star/tile update isn't enough - the row needs to disappear
  // from the list entirely. renderSongListBody() only replaces the list rows
  // (not the search box/subtabs), so it's still far cheaper than the full
  // render() this used to call for every single tap.
  if (view.name === 'list' && songTab === 'favorites' && !nowFav) renderSongListBody();
  else syncFavoriteUI_(songId, nowFav);
  api('toggleFavorite', Object.assign({ song_id: songId }, viewAsFields())).then(r => {
    const nowFavorited = favList.includes(songId);
    if (r.favorited !== nowFavorited) {
      if (r.favorited) { if (!favList.includes(songId)) favList.push(songId); }
      else { const i = favList.indexOf(songId); if (i >= 0) favList.splice(i, 1); }
      if (view.name === 'list' && songTab === 'favorites') renderSongListBody();
      else syncFavoriteUI_(songId, r.favorited);
    }
  }).catch(err => {
    if (wasFavorited) { if (!favList.includes(songId)) favList.push(songId); }
    else { const i = favList.indexOf(songId); if (i >= 0) favList.splice(i, 1); }
    if (view.name === 'list' && songTab === 'favorites') renderSongListBody();
    else syncFavoriteUI_(songId, wasFavorited);
    alert(err.message);
  }).finally(() => { pendingFavoriteToggles.delete(songId); });
}

function renderArtists() {
  const counts = {};
  songs.forEach(s => { splitArtists(s.artist).forEach(a => { counts[a] = (counts[a]||0)+1; }); });
  const artists = Object.keys(counts).sort((a,b)=>a.localeCompare(b));
  let html = '<h2>Artists</h2><div class="grid-cats">' +
    (artists.map(a => `<span class="chip" onclick="songTab='all';filters.artist='${a.replace(/'/g,"\\'")}';songListPage=0;goTo('list')">${escapeHtml(a)} <span class="count">(${counts[a]})</span></span>`).join('') || '<span class="muted">No artists yet.</span>') + '</div>';
  document.getElementById('app').innerHTML = html;
}
function renderCategories() {
  const langCounts = {}, tagCounts = {};
  songs.forEach(s => {
    const { language, tags } = splitCategories(s.categories);
    if (language) langCounts[language] = (langCounts[language]||0)+1;
    tags.forEach(t => tagCounts[t] = (tagCounts[t]||0)+1);
  });
  const langs = Object.keys(langCounts).sort((a,b)=>a.localeCompare(b));
  const tags = Object.keys(tagCounts).sort((a,b)=>a.localeCompare(b));
  let html = '<h2>Language</h2><div class="grid-cats">' +
    (langs.map(l => `<span class="chip" onclick="songTab='all';filters.language='${l.replace(/'/g,"\\'")}';songListPage=0;goTo('list')">${escapeHtml(l)} <span class="count">(${langCounts[l]})</span></span>`).join('') || '<span class="muted">None yet</span>') +
    '</div><h2>Tags</h2><div class="grid-cats">' +
    (tags.map(t => `<span class="chip" onclick="songTab='all';filters.tag='${t.replace(/'/g,"\\'")}';songListPage=0;goTo('list')">${escapeHtml(t)} <span class="count">(${tagCounts[t]})</span></span>`).join('') || '<span class="muted">None yet</span>') + '</div>';
  document.getElementById('app').innerHTML = html;
}

function renderDetail() {

    </div>` : ''}

    <div class="detail-tiles-row">

        <div class="adv-controls">
          <button class="stepper-btn" onclick="changeTranspose(-1)">−</button>
          <span style="width:24px;text-align:center;font-size:13px;color:#444;">${playerState.transpose > 0 ? '+' + playerState.transpose : playerState.transpose}</span>

    <div id="chartScroll" class="${playerState.showChords ? '' : 'hide-chords'}${playerState.playing ? ' chart-playing' : ''}" style="--chart-step:${playerState.fontSize||0}px;--chart-fw:${playerState.bold?700:400};">${contentReady ? renderChart(song.chords_lyrics, transpose) : '<div class="muted" style="padding:24px 4px">Loading chart…</div>'}</div>
    ${playerState.playing ? '' : `${ytId ? `<div class="yt-wrap"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>` : ''}
    <div class="grid-cats" style="margin-top:10px">${tags.map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join('')}${language ? `<span class="chip">${escapeHtml(language)}</span>` : ''}</div>`}
    ${playerState.playing ? playFloatBarHtml() : ''}`;

  document.getElementById('app').innerHTML = html;
  if (playerState.playing) initPlayFloatBar();
  if (contentReady) fitChordsUsedChips();
}

// Shrinks the "Chords in song: ..." chip row (via the --cu-scale CSS
// variable on .chords-used, see its CSS) just enough that every chord chip
// fits on one line with no horizontal scroll - measuring the row's natural
// (fully-expanded) width against the space actually available, rather than
// applying a fixed smaller size regardless of how many chords a given song
// uses. Re-run after every renderDetail() (a fresh DOM each time resets any
// previous scale) and on window resize while a song's detail view is open.
function fitChordsUsedChips() {
  const el = document.getElementById('chordsUsedChips');
  if (!el) return;
  el.style.setProperty('--cu-scale', '1');
  const available = el.clientWidth;
  const natural = el.scrollWidth;
  if (available > 0 && natural > available) {
    const scale = Math.max(0.55, Math.min(1, (available / natural) * 0.97));
    el.style.setProperty('--cu-scale', String(scale));
  }
}
window.addEventListener('resize', () => { if (view.name === 'detail') fitChordsUsedChips(); });

function changeCapo(delta) { playerState.capo = Math.max(0, Math.min(11, playerState.capo + delta)); renderDetail(); }
// "My Capo" tile (detail-tiles-row): a friendlier one-tap way for the player
// to record which capo fret is comfortable for THEM on this song, separate
// from the song's own recommended default. This is a personal note only —
// per the user's explicit intent, picking a number here must NOT change the
// displayed chart (that's what the separate capo stepper in the Advanced
// panel, changeCapo() above, is for - it deliberately transposes). Earlier
// versions of this function also set playerState.capo, which transposed
// the chart as a side effect of just recording a preference - that was
// reported as a bug ("setting my capo should not change the chords") and
// is fixed by leaving playerState.capo alone here entirely.
function openMyCapoPicker() {

      <button class="btn secondary" onclick="closeModal()">Cancel</button>

  `);
}
function setMyCapo(n) {

  closeModal();
  renderDetail();
}
function clearMyCapo() {
  playerState.myCapo = null;

}
function changeSpeed(delta) {
  playerState.speed = Math.max(0.2, Math.min(3, +(playerState.speed + delta).toFixed(1)));
  if (playerState.playing) {
    const label = document.querySelector('#playFloatBar .speed-group span');
    if (label) label.textContent = playerState.speed.toFixed(1) + 'x';
    return;
  }
  renderDetail();
}
// Advanced panel controls (song detail page redesign): font size step,
// bold lyrics, show/hide chord labels, and a transpose offset that's
// independent of capo (capo still drives the fret/shape math via
// changeCapo() above; transpose is a separate "sing it in a different
// key" shift applied on top, both feeding the same transposeSemitones
// passed into renderChart()/chordsUsedIn() in renderDetail()).
function toggleAdvanced() { playerState.advancedOpen = !playerState.advancedOpen; renderDetail(); }
function changeFontStep(delta) { playerState.fontSize = Math.max(-4, Math.min(8, (playerState.fontSize||0) + delta)); renderDetail(); }
function toggleBold() { playerState.bold = !playerState.bold; renderDetail(); }
function toggleShowChords() { playerState.showChords = !playerState.showChords; renderDetail(); }
function changeTranspose(delta) { playerState.transpose = (playerState.transpose||0) + delta; renderDetail(); }
function togglePlay() {
  // Only ever the ENTRY into Play Mode (the plain "▶ Play" button, shown
  // when not already playing) - once inside Play Mode, the floating bar's
  // own Pause/Resume and Stop buttons (pausePlay/stopPlayMode below) take
  // over, so this has nothing to do once playerState.playing is already true.
  if (playerState.playing) return;
  playerState.playing = true;
  playerState.paused = false;
  renderDetail();
  if (playerState.delay) { setTimeout(startScroll, 5000); } else { startScroll(); }
}
function startScroll() {
  const el = document.getElementById('chartScroll'); if (!el) return;
  clearInterval(playerState.timer);
  playerState.scrollRemainder = 0;
  playerState.timer = setInterval(() => {
    if (!el.isConnected) { stopPlayMode(); return; }
    // At slow speeds (e.g. 0.2x = 0.14px per tick) the per-tick amount is
    // under a pixel, and some browsers' scrollTop rounds sub-pixel writes
    // away on the very next read - so el.scrollTop += 0.14 keeps reading
    // back 0, adding 0.14, and writing 0.14, forever rounding down to 0
    // and never actually moving. Accumulating the fractional remainder
    // here (instead of trusting scrollTop to remember it) means slow
    // speeds still creep forward once enough ticks add up to a whole
    // pixel, rather than getting stuck at the top forever.
    playerState.scrollRemainder += playerState.speed * 0.7;
    const wholePixels = Math.trunc(playerState.scrollRemainder);
    if (wholePixels !== 0) {
      el.scrollTop += wholePixels;
      playerState.scrollRemainder -= wholePixels;
    }
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 2) {
      // Reached the end of the chart - only PAUSE, don't exit Play Mode.
      // Someone can still be mid-song (about to repeat a chorus, flipping
      // back up to check a chord) and would not want to be suddenly kicked
      // back to the normal view just because the scroll ran out of chart.
      // They stay in Play Mode - chart still expanded, floating bar still
      // up - until they explicitly tap Stop.
      clearInterval(playerState.timer);
      playerState.timer = null;
      playerState.paused = true;
      updatePlayFloatBarPauseBtn();
    }
  }, 40);
}
// Pause/Resume: stops the auto-scroll but stays in Play Mode (chart still
// expanded, floating bar still showing) - distinct from Stop, which exits
// Play Mode entirely. Resuming picks the scroll back up from wherever it
// was left, with no re-application of the initial "5s delay" setting
// (that's only meant to give time to get ready before playback FIRST starts).
function pausePlay() {
  if (playerState.paused) {
    playerState.paused = false;
    startScroll();
  } else {
    clearInterval(playerState.timer);
    playerState.timer = null;
    playerState.paused = true;
  }
  // Deliberately NOT renderDetail() - that rebuilds #chartScroll's whole
  // innerHTML from scratch, which resets its scrollTop back to 0. Pausing
  // (or being auto-paused at the end of the chart, see startScroll above)
  // is meant to freeze playback exactly where it is, not jump the chart
  // back to the top - only the floating bar's own Pause/Resume icon needs
  // to change, so update just that instead of the whole page.
  updatePlayFloatBarPauseBtn();
}
function updatePlayFloatBarPauseBtn() {
  const btn = document.querySelector('#playFloatBar .play-btn:not(.stop-btn)');
  if (!btn) return;
  btn.textContent = playerState.paused ? '▶' : '⏸';
  btn.title = playerState.paused ? 'Resume' : 'Pause';
}
// Stop: fully exits Play Mode (chart back to normal size, floating bar
// gone) - what the single combined button used to do on a second tap.
function stopPlayMode() {
  clearInterval(playerState.timer);
  playerState.timer = null;
  playerState.playing = false;
  playerState.paused = false;
  // Only re-render the detail page if we're actually still looking at it.
  // This can also fire from startScroll's own "chart got removed from the
  // DOM" check above, which means the user already navigated away entirely
  // (the Back link, a nav tab, the phone's Back button) while still mid-
  // playback - blindly calling renderDetail() then would stomp whatever
  // screen they'd already moved to with "Song not found" instead of
  // leaving it alone.
  if (view.name === 'detail') renderDetail();
}
// Play Mode's floating control strip: Pause/Resume, Stop, and speed,
// draggable anywhere on screen (see .play-float-bar CSS) so it doesn't sit
// over the part of the chart the player is currently reading. Position is
// kept in the page-level floatBarPos (not playerState) across the
// re-renders a speed change triggers, so dragging it once keeps it put for
// the rest of this playback.
function playFloatBarHtml() {
  const posStyle = floatBarPos ? `left:${floatBarPos.x}px; top:${floatBarPos.y}px; right:auto; bottom:auto; transform:none;` : '';
  return `<div class="play-float-bar" id="playFloatBar" style="${posStyle}">
    <span class="drag-handle" id="playFloatHandle" title="Drag to move">${SVG_ICONS.dragHandle}</span>
    <button class="play-btn" onclick="pausePlay()" title="${playerState.paused ? 'Resume' : 'Pause'}">${playerState.paused ? '▶' : '⏸'}</button>
    <button class="play-btn stop-btn" onclick="stopPlayMode()" title="Stop">⏹</button>
    <div class="speed-group">
      <button onclick="changeSpeed(0.2)" title="Faster">▲</button>
      <span>${playerState.speed.toFixed(1)}x</span>
      <button onclick="changeSpeed(-0.2)" title="Slower">▼</button>
    </div>
  </div>`;
}
// Pointer Events cover mouse, touch and pen with one code path. Only the
// small grip handle starts a drag (not the whole pill) so the Play and speed
// buttons stay ordinary taps. setPointerCapture means we don't need any
// document-level listeners to track the drag outside the handle's own bounds.
function initPlayFloatBar() {
  const bar = document.getElementById('playFloatBar');
  const handle = document.getElementById('playFloatHandle');
  if (!bar || !handle) return;
  let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
  handle.addEventListener('pointerdown', e => {
    dragging = true;
    const rect = bar.getBoundingClientRect();
    startLeft = rect.left; startTop = rect.top;
    startX = e.clientX; startY = e.clientY;
    bar.style.transform = 'none';
    bar.style.bottom = 'auto';
    bar.style.right = 'auto';
    bar.style.left = startLeft + 'px';
    bar.style.top = startTop + 'px';
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    const maxLeft = window.innerWidth - bar.offsetWidth - 4;
    const maxTop = window.innerHeight - bar.offsetHeight - 4;
    const newLeft = Math.max(4, Math.min(maxLeft, startLeft + (e.clientX - startX)));
    const newTop = Math.max(4, Math.min(maxTop, startTop + (e.clientY - startY)));
    bar.style.left = newLeft + 'px';
    bar.style.top = newTop + 'px';
    floatBarPos = { x: newLeft, y: newTop };
  });
  const endDrag = e => { dragging = false; try { handle.releasePointerCapture(e.pointerId); } catch (err) {} };
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);
}

// Steps to the previous (-1) or next (+1) song in the queue the current
// song was opened from (see detailGoTo) — keeps carrying the same queue
// forward so Next/Previous keeps working all the way through the list.
function goToQueueSong(delta) {
  if (!Array.isArray(view.queue)) return;
  const newIdx = view.queueIdx + delta;
  if (newIdx < 0 || newIdx >= view.queue.length) return;
  goTo('detail', { id: view.queue[newIdx], queue: view.queue, queueIdx: newIdx });
}

// Bound once to the persistent #app container at startup (its DOM node is
// never replaced — only its innerHTML on every render() — so attaching here
// instead of per-render avoids piling up duplicate listeners). Only acts on
// the song detail view, and only when a queue is present, via the existing
// goToQueueSong() (already a safe no-op with no queue or at either end of one).
(function attachSwipeNav() {
  const el = document.getElementById('app');
  if (!el) return;
  let touchStartX = 0, touchStartY = 0, touchStartT = 0;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartT = Date.now();
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (view.name !== 'detail') return;
    const touch = e.changedTouches[0];
    if (!touch) return;
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const dt = Date.now() - touchStartT;
    if (dt > 800 || Math.abs(dx) < 60 || Math.abs(dy) > 60) return;
    if (dx < 0) goToQueueSong(1);   // swipe left  -> next song
    else goToQueueSong(-1);         // swipe right -> previous song
  }, { passive: true });
})();

    .then(() => loadSongs(false))
    .then(() => goTo(id ? 'detail' : 'list', id ? {id} : {}))
    .catch(err => { statusEl.textContent = 'Error: ' + err.message; statusEl.className = 'error'; });
  return false;
}

/* ============================================================
   DRAG-TO-REORDER — a small, dependency-free helper shared by the
   Playlist detail view and the (unfiltered) Favorites tab. Uses Pointer
   Events so the same code handles mouse and touch; only a row's
   .drag-handle (see SVG_ICONS.dragHandle) starts a drag, so the rest of
   the row keeps its normal tap-to-open behavior. Physically swaps DOM rows
   as the pointer crosses each neighbor's midpoint (rather than animating a
   floating copy) — a deliberately simple, low-risk approach: no dependency
   on getting spring-physics or drop-shadows right, just an immediate,
   unambiguous "this is the new order" as you drag.
   ============================================================ */
function makeReorderable(containerEl, onDrop) {
  if (!containerEl || containerEl._reorderableBound) return;
  containerEl._reorderableBound = true;
  let dragEl = null;
  function rows() { return Array.from(containerEl.children).filter(el => el.hasAttribute('data-reorder-id')); }
  function onMove(e) {
    if (!dragEl) return;
    const y = e.clientY;
    for (const r of rows()) {
      if (r === dragEl) continue;
      const rect = r.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      // dragIsBefore: true if dragEl currently sits earlier in the list than r.
      const dragIsBefore = !!(dragEl.compareDocumentPosition(r) & Node.DOCUMENT_POSITION_FOLLOWING);
      // Dragging down past a later row r: move dragEl to just after it.
      if (dragIsBefore && y > mid) { containerEl.insertBefore(dragEl, r.nextSibling); break; }
      // Dragging up past an earlier row r: move dragEl to just before it.
      if (!dragIsBefore && y < mid) { containerEl.insertBefore(dragEl, r); break; }
    }
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    const el = dragEl; dragEl = null;
    const ids = rows().map(r => r.getAttribute('data-reorder-id'));
    onDrop(ids, el);
  }
  containerEl.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    const row = handle.closest('[data-reorder-id]');
    if (!row || row.parentElement !== containerEl) return;
    e.preventDefault();
    dragEl = row;
    row.classList.add('dragging');
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

   PLAYLISTS
   ============================================================ */
function renderPlaylists() {
  if (viewAsUser) {
    const mine = viewAsData.playlists || [];
    const pub = playlists.filter(p => p.visibility === 'public');
    let html = `<div class="searchRow"><div class="spacer"></div><button class="btn" onclick="createPlaylistPrompt()">+ New Playlist</button></div>`;
    html += `<h2>${escapeHtml(viewAsUser.name)}'s Playlists</h2>` + (mine.length? renderPlaylistCards(mine, 'lg') : '<div class="muted">None yet.</div>');
    html += `<h2>Public Playlists</h2>` + (pub.length? renderPlaylistCards(pub, 'sm') : '<div class="muted">None yet.</div>');
    document.getElementById('app').innerHTML = html;
    return;
  }
  if (!currentUser) {
    const pub = playlists.filter(p => p.visibility === 'public');
    document.getElementById('app').innerHTML = `<h2>Public Playlists</h2>` + renderPlaylistCards(pub, 'sm') + `<div class="empty">Sign in with Google to make your own playlists.</div>`;
    return;
  }
  const mine = playlists.filter(p => p.owner_email === currentUser.email);
  const shared = playlists.filter(p => p.owner_email !== currentUser.email && p.visibility === 'shared' && (p.shared_with||[]).some(s => (typeof s === 'string' ? s : s.email) === currentUser.email));
  const pub = playlists.filter(p => p.visibility === 'public' && p.owner_email !== currentUser.email);
  let html = `<div class="searchRow"><div class="spacer"></div><button class="btn" onclick="createPlaylistPrompt()">+ New Playlist</button></div>`;
  html += `<h2>My Playlists</h2>` + (mine.length? renderPlaylistCards(mine, 'lg') : '<div class="muted">None yet.</div>');
  html += `<h2>Shared with me</h2>` + (shared.length? renderPlaylistCards(shared, 'lg') : '<div class="muted">None yet.</div>');
  html += `<h2>Public Playlists</h2>` + (pub.length? renderPlaylistCards(pub, 'sm') : '<div class="muted">None yet.</div>');
  document.getElementById('app').innerHTML = html;
}
function renderPlaylistCards(list, size) {
  const badgeSize = size === 'sm' ? 26 : 34;
  return `<div class="playlist-grid size-${size || 'lg'}">` + list.map(p => `<div class="playlist-card" onclick="goTo('playlistDetail',{id:'${p.id}'})">
    ${playlistIconHtml(p.icon, badgeSize)}
    <div class="title">${escapeHtml(p.title)}</div>
    <div class="muted">${(p.song_ids||[]).length} songs · ${p.visibility === 'public' ? 'Public' : p.visibility === 'shared' ? 'Shared' : 'Private'} · by ${escapeHtml(p.owner_name||p.owner_email)}</div>
  </div>`).join('') + `</div>`;
}
async function createPlaylistPrompt() {
  const title = await customPromptAsync('Playlist name', '', { title: 'New Playlist', submitLabel: 'Create' });
  if (!title) return;
  api('createPlaylist', Object.assign({ title, visibility: 'private', song_ids: [], shared_with: [] }, viewAsFields()))
    .then(r => { applyPlaylistPatch_(r.playlist); goTo('playlists'); })
    .catch(err => alert(err.message));
}
function renderPlaylistDetail() {
  const p = playlists.find(pl => pl.id === view.id) || (viewAsUser && (viewAsData.playlists||[]).find(pl => pl.id === view.id));
  if (!p) { document.getElementById('app').innerHTML = '<div class="empty">Playlist not found.</div>'; return; }
  // The "owning" identity is the impersonated user during View As, or the
  // signed-in account otherwise — an admin can always edit/delete either way.
  const actingEmail = viewAsUser ? viewAsUser.email : (currentUser && currentUser.email);
  const isOwner = actingEmail && p.owner_email === actingEmail;
  // Public playlists: only the creator (or an admin) ever gets edit
  // controls - being visible to everyone doesn't grant editing.
  // Shared playlists: the owner can additionally grant edit rights to
  // specific people they've shared it with, per share (canEdit on that
  // share row) - everyone else shared with it stays view-only.
  const myShare = actingEmail && (p.shared_with||[]).find(s => (typeof s === 'string' ? s : s.email) === actingEmail);
  const canEdit = isOwner || (currentUser && currentUser.isAdmin) || (p.visibility === 'shared' && myShare && typeof myShare !== 'string' && myShare.canEdit);
  const list = (p.song_ids||[]).map(id => songs.find(s => s.id === id)).filter(Boolean);
  const queueIds = list.map(s => s.id);
  let html = `<span class="backlink" onclick="goTo('playlists')">‹ Back to Playlists</span>
    <div class="song-header">
      <div style="display:flex;align-items:center;gap:10px;">${playlistIconHtml(p.icon, 36)}<div><h2 style="margin-bottom:2px">${escapeHtml(p.title)}</h2><div class="meta">by ${escapeHtml(p.owner_name||p.owner_email)} · ${p.visibility}</div></div></div>
      ${canEdit ? `<div><button class="btn" onclick="openAddSongsToPlaylist('${p.id}')">+ Add Songs</button> <button class="btn secondary" onclick="editPlaylistSettings('${p.id}')">Settings</button> <button class="btn danger" onclick="deletePlaylistConfirm('${p.id}')">Delete</button></div>` : ''}
    </div>`;
  // Offline availability is a personal, on-this-device thing — not tied to
  // owning/editing the playlist, so it's offered to anyone viewing it
  // (public/shared included), same as Favorites.
  if (!isOffline && list.length) {
    html += `<div style="margin-bottom:10px"><button id="playlistOfflineBtn" class="btn secondary icon-btn-round offline-toggle-btn" onclick="togglePlaylistOffline('${p.id}')" title="Available Offline" aria-label="Available Offline" style="border-radius:50%;width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none;">${SVG_ICONS.download}</button></div>`;
  }
  html += list.length ? `<div id="playlistSongList">` + list.map(s => `
    <div class="song-row" data-reorder-id="${s.id}">
      ${canEdit ? `<span class="drag-handle" title="Drag to reorder">${SVG_ICONS.dragHandle}</span>` : ''}
      <div style="cursor:pointer;flex:1" onclick="${detailGoTo(s.id, queueIds)}"><div class="title">${escapeHtml(s.title)}</div><div class="artist">${escapeHtml(s.artist||'')}</div></div>
      ${canEdit ? `<button class="btn secondary icon-btn-round" onclick="removeFromPlaylist('${p.id}','${s.id}')" title="Remove from playlist" aria-label="Remove from playlist" style="border-radius:50%;width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none;">${SVG_ICONS.trash}</button>` : ''}
    </div>`).join('') + `</div>` : '<div class="empty">No songs in this playlist yet.</div>';
  document.getElementById('app').innerHTML = html;
  if (canEdit && list.length > 1) {
    makeReorderable(document.getElementById('playlistSongList'), (newIds) => {
      api('updatePlaylist', Object.assign({ id: p.id, song_ids: newIds }, viewAsFields()))
        .then(r => applyPlaylistPatch_(r.playlist))
        .catch(err => { alert(err.message); renderPlaylistDetail(); }); // snap back to the server's order on failure
    });
  }
  if (!isOffline && list.length) refreshPlaylistOfflineButton(p.id);
}

async function togglePlaylistOffline(playlistId) {
  const setId = offlineSetIdForPlaylist(playlistId);
  const btn = document.getElementById('playlistOfflineBtn');
  const already = await isOfflineAvailable(setId);
  const p = playlists.find(pl => pl.id === playlistId) || (viewAsUser && (viewAsData.playlists||[]).find(pl => pl.id === playlistId));
  const playlistName = (p && p.title) || 'this playlist';
  if (already) {
    if (!(await customConfirmAsync(`Remove "${playlistName}" from offline storage on this device?`, { title: 'Remove offline copy', confirmLabel: 'Remove', danger: true }))) return;
    await removeOfflineAvailable(setId);
  } else {
    const ids = p ? (p.song_ids || []).slice() : [];
    if (!ids.length) { alert('This playlist has no songs yet.'); return; }
    if (!(await customConfirmAsync(`Make "${playlistName}" available offline on this device?`, { title: 'Available Offline', confirmLabel: 'Make Available' }))) return;
    if (btn) btn.disabled = true;
    try {
      await setOfflineAvailable(setId, playlistName, ids);
    } catch (e) {
      alert('Could not save offline: ' + e.message);
    }
    if (btn) btn.disabled = false;
  }
  refreshPlaylistOfflineButton(playlistId);
}
async function refreshPlaylistOfflineButton(playlistId) {
  const btn = document.getElementById('playlistOfflineBtn');
  if (!btn) return;
  const on = await isOfflineAvailable(offlineSetIdForPlaylist(playlistId));
  btn.innerHTML = on ? SVG_ICONS.downloadDone : SVG_ICONS.download;
  btn.title = on ? 'Saved Offline (tap to remove)' : 'Available Offline';
  btn.setAttribute('aria-label', btn.title);
  btn.classList.toggle('active', on);
}
// Full Playlist Settings form: name, visibility (private/shared/public),
// and - only relevant/shown when shared - the list of emails it's shared
// with, addable/removable one at a time. Replaces the old three
// sequential native prompt() calls (name, then visibility typed as a raw
// word, then a comma-separated email list) with one form, matching how
// every other multi-field edit in this app works.
let playlistSettingsState = null; // { id, title, visibility, sharedWith:[{email,canEdit}], icon }
function editPlaylistSettings(id) {
  const p = playlists.find(pl => pl.id === id) || (viewAsUser && (viewAsData.playlists||[]).find(pl => pl.id === id));
  if (!p) return;
  // Normalize to {email,canEdit} objects up front (older cached data or a
  // plain string is still handled) so every consumer below can assume the
  // object shape.
  const sharedWith = (p.shared_with||[]).map(s => typeof s === 'string' ? { email: s, canEdit: false } : { email: s.email, canEdit: !!s.canEdit });
  playlistSettingsState = { id, title: p.title, visibility: p.visibility || 'private', sharedWith, icon: p.icon || 'note' };
  renderPlaylistSettingsModal();
}
function setPlaylistSettingsIcon(icon) {
  syncPlaylistSettingsTitle_();
  playlistSettingsState.icon = icon;
  renderPlaylistSettingsModal();
}
// The name field is a plain text input the person types into freely;
// toggling visibility or adding/removing a shared email re-renders the
// whole modal (simplest way to keep the chips/list in sync), which would
// otherwise wipe out whatever they'd already typed in the name field - so
// every other action reads the field's live value into state first.
function syncPlaylistSettingsTitle_() {
  const el = document.getElementById('playlistSettingsTitle');
  if (el && playlistSettingsState) playlistSettingsState.title = el.value;
}
function setPlaylistSettingsVisibility(vis) {
  syncPlaylistSettingsTitle_();
  playlistSettingsState.visibility = vis;
  renderPlaylistSettingsModal();
}
function addPlaylistSettingsEmail() {
  syncPlaylistSettingsTitle_();
  const input = document.getElementById('playlistSettingsEmailInput');
  const email = (input && input.value || '').trim().toLowerCase();
  if (!email) return;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('Enter a valid email address.'); return; }
  if (!playlistSettingsState.sharedWith.some(s => s.email === email)) playlistSettingsState.sharedWith.push({ email, canEdit: false });
  renderPlaylistSettingsModal();
}
function removePlaylistSettingsEmail(email) {
  syncPlaylistSettingsTitle_();
  playlistSettingsState.sharedWith = playlistSettingsState.sharedWith.filter(s => s.email !== email);
  renderPlaylistSettingsModal();
}
// Lets the owner flip whether one specific shared-with person can also edit
// the playlist (add/remove songs, reorder) or just view it.
function togglePlaylistSettingsEmailEdit(email) {
  syncPlaylistSettingsTitle_();
  const share = playlistSettingsState.sharedWith.find(s => s.email === email);
  if (share) share.canEdit = !share.canEdit;
  renderPlaylistSettingsModal();
}
function renderPlaylistSettingsModal() {
  const st = playlistSettingsState;
  if (!st) return;
  openModal(`
    <h2>Playlist Settings</h2>
    <label>Name</label>
    <input type="text" id="playlistSettingsTitle" value="${escapeHtml(st.title)}" onkeydown="if(event.key==='Enter'){event.preventDefault();savePlaylistSettings();}">
    <label style="margin-top:10px;display:block;">Icon</label>
    <div class="icon-picker">${Object.keys(PLAYLIST_ICONS).map(key => `<span onclick="setPlaylistSettingsIcon('${key}')">${playlistIconHtml(key, 32).replace('playlist-icon-badge', `playlist-icon-badge${st.icon===key?' selected':''}`)}</span>`).join('')}</div>
    <label style="margin-top:10px;display:block;">Visibility</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
      <span class="chip ${st.visibility==='private'?'toggle-on':''}" onclick="setPlaylistSettingsVisibility('private')">Private</span>
      <span class="chip ${st.visibility==='shared'?'toggle-on':''}" onclick="setPlaylistSettingsVisibility('shared')">Shared</span>
      <span class="chip ${st.visibility==='public'?'toggle-on':''}" onclick="setPlaylistSettingsVisibility('public')">Public</span>
    </div>
    ${st.visibility === 'shared' ? `
      <label style="margin-top:6px;display:block;">Shared with</label>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px;">
        ${st.sharedWith.length ? st.sharedWith.map(s => `<div style="display:flex;align-items:center;gap:10px;"><span class="chip">${escapeHtml(s.email)} <span style="cursor:pointer;font-weight:700;margin-left:4px;" onclick="removePlaylistSettingsEmail('${s.email.replace(/'/g,"\\'")}')">&times;</span></span><label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;"><input type="checkbox" ${s.canEdit ? 'checked' : ''} onchange="togglePlaylistSettingsEmailEdit('${s.email.replace(/'/g,"\\'")}')"> Can edit</label></div>`).join('') : `<span class="muted" style="font-size:13px;">No one yet.</span>`}
      </div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="playlistSettingsEmailInput" placeholder="Email address" onkeydown="if(event.key==='Enter'){event.preventDefault();addPlaylistSettingsEmail();}">
        <button class="btn secondary" onclick="addPlaylistSettingsEmail()">Add</button>
      </div>
    ` : ''}
    <div class="modal-actions"><button class="btn secondary" onclick="playlistSettingsState=null;closeModal()">Cancel</button><button class="btn" onclick="savePlaylistSettings()">Save</button></div>
  `);
}
function savePlaylistSettings() {
  syncPlaylistSettingsTitle_();
  const st = playlistSettingsState;
  if (!st) return;
  const title = (st.title || '').trim();
  if (!title) { alert('Enter a playlist name.'); return; }
  api('updatePlaylist', Object.assign({ id: st.id, title, visibility: st.visibility, shared_with: st.visibility === 'shared' ? st.sharedWith : [], icon: st.icon }, viewAsFields()))
    .then(r => { applyPlaylistPatch_(r.playlist); playlistSettingsState = null; closeModal(); render(); })
    .catch(err => alert(err.message));
}
async function deletePlaylistConfirm(id) {
  if (!(await customConfirmAsync('Delete this playlist? This cannot be undone.', { title: 'Delete playlist', confirmLabel: 'Delete', danger: true }))) return;
  api('deletePlaylist', Object.assign({ id }, viewAsFields())).then(() => { removePlaylistLocally_(id); goTo('playlists'); }).catch(err => alert(err.message));
}
function removeFromPlaylist(playlistId, songId) {
  const p = playlists.find(pl => pl.id === playlistId) || (viewAsUser && (viewAsData.playlists||[]).find(pl => pl.id === playlistId));
  const newIds = (p.song_ids||[]).filter(id => id !== songId);
  api('updatePlaylist', Object.assign({ id: playlistId, song_ids: newIds }, viewAsFields())).then(r => { applyPlaylistPatch_(r.playlist); render(); }).catch(err => alert(err.message));
}
// Add to Playlist: playlist bubbles are multi-select toggles (pre-checked
// for whichever playlists already contain this song, so toggling one off
// is how you remove it too) instead of the old one-tap-and-close chips —
// nothing is sent to the server until Save, so picking several playlists
// is one round trip instead of one popup-and-reload per playlist.
function openAddToPlaylist(songId) {
  if (!currentUser) { alert('Sign in with Google first to use playlists.'); return; }
  const mine = viewAsUser ? (viewAsData.playlists||[]) : playlists.filter(p => p.owner_email === currentUser.email);
  addToPlaylistSelection = new Set(mine.filter(p => (p.song_ids||[]).includes(songId)).map(p => p.id));
  renderAddToPlaylistModal(songId);
}
function renderAddToPlaylistModal(songId) {
  const mine = viewAsUser ? (viewAsData.playlists||[]) : playlists.filter(p => p.owner_email === currentUser.email);
  openModal(`
    <h2>Add to Playlist</h2>
    ${mine.length ? `<div class="grid-cats">${mine.map(p => `<span class="chip ${addToPlaylistSelection.has(p.id)?'toggle-on':''}" onclick="toggleAddToPlaylistSelection('${p.id}','${songId}')">${escapeHtml(p.title)}</span>`).join('')}</div>` : `<p class="muted">You have no playlists yet — create one below.</p>`}
    <label>New playlist</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="newPlaylistName" placeholder="Playlist name" onkeydown="if(event.key==='Enter'){event.preventDefault();createPlaylistForAdd('${songId}')}">
      <button class="btn secondary" onclick="createPlaylistForAdd('${songId}')">Create</button>
    </div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAddToPlaylist('${songId}')">Save</button></div>
  `);
}
function toggleAddToPlaylistSelection(playlistId, songId) {
  if (addToPlaylistSelection.has(playlistId)) addToPlaylistSelection.delete(playlistId); else addToPlaylistSelection.add(playlistId);
  renderAddToPlaylistModal(songId);
}
function createPlaylistForAdd(songId) {
  const input = document.getElementById('newPlaylistName');
  const title = (input && input.value || '').trim();
  if (!title) { alert('Enter a playlist name.'); return; }
  api('createPlaylist', Object.assign({ title, visibility:'private', song_ids:[], shared_with:[] }, viewAsFields()))
    .then(r => {
      applyPlaylistPatch_(r.playlist);
      if (r && r.playlist && r.playlist.id) addToPlaylistSelection.add(r.playlist.id);
      renderAddToPlaylistModal(songId);
    })
    .catch(err => alert(err.message));
}
// Diffs the selected set against each of the user's playlists' current
// song_ids and only sends an updatePlaylist for the ones that actually
// changed (added or removed), all in parallel, then closes once every
// request has settled.
function saveAddToPlaylist(songId) {
  const mine = viewAsUser ? (viewAsData.playlists||[]) : playlists.filter(p => p.owner_email === currentUser.email);
  const ops = mine.map(p => {
    const has = (p.song_ids||[]).includes(songId);
    const shouldHave = addToPlaylistSelection.has(p.id);
    if (has === shouldHave) return Promise.resolve(null);
    const newIds = shouldHave ? Array.from(new Set((p.song_ids||[]).concat([songId]))) : (p.song_ids||[]).filter(id => id !== songId);
    return api('updatePlaylist', Object.assign({ id: p.id, song_ids: newIds }, viewAsFields()));
  });
  Promise.all(ops)
    .then(results => {
      results.forEach(r => { if (r && r.playlist) applyPlaylistPatch_(r.playlist); });
      closeModal(); addToPlaylistSelection = new Set();
    })
    .catch(err => alert(err.message));
}

// Add Songs (from a playlist's own page): the reverse direction of "Add to
// Playlist" above (that one goes song -> pick playlist; this one goes
// playlist -> search/pick songs). Only re-renders the results list on each
// keystroke (not the whole modal via openModal, which would tear down and
// recreate the search input, losing focus/cursor position mid-type) - same
// reasoning as the main Songs search box (renderSongListBody vs renderList).
let addSongsToPlaylistState = null; // { playlistId, query }
function openAddSongsToPlaylist(playlistId) {
  addSongsToPlaylistState = { playlistId, query: '' };
  renderAddSongsToPlaylistModal();
}
function renderAddSongsToPlaylistModal() {
  const st = addSongsToPlaylistState;
  if (!st) return;
  const p = playlists.find(pl => pl.id === st.playlistId) || (viewAsUser && (viewAsData.playlists||[]).find(pl => pl.id === st.playlistId));
  openModal(`
    <h2>Add Songs${p ? ' to "' + escapeHtml(p.title) + '"' : ''}</h2>
    <input type="text" id="addSongsSearch" placeholder="Search by title or artist…" value="${escapeHtml(st.query)}">
    <div id="addSongsResults" style="max-height:320px;overflow-y:auto;margin-top:8px;"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal();renderPlaylistDetail();">Done</button></div>
  `);
  const input = document.getElementById('addSongsSearch');
  if (input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    input.addEventListener('input', e => { addSongsToPlaylistState.query = e.target.value; renderAddSongsResultsOnly_(); });
  }
  renderAddSongsResultsOnly_();
}
function renderAddSongsResultsOnly_() {
  const st = addSongsToPlaylistState;
  const resultsEl = document.getElementById('addSongsResults');
  if (!st || !resultsEl) return;
  const p = playlists.find(pl => pl.id === st.playlistId) || (viewAsUser && (viewAsData.playlists||[]).find(pl => pl.id === st.playlistId));
  const already = new Set((p && p.song_ids) || []);
  const q = st.query.trim().toLowerCase();
  if (!q) { resultsEl.innerHTML = '<div class="muted" style="padding:10px 0">Type to search the song database…</div>'; return; }
  // Capped at 40 matches - this is a quick picker, not the full Songs list
  // (which already exists for browsing); title/artist only (no lyrics
  // search here, to keep it fast and not depend on the full-lyrics catalog
  // being loaded yet).
  const results = songs.filter(s => (s.title||'').toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q)).slice(0, 40);
  resultsEl.innerHTML = results.length ? results.map(s => `
    <div class="song-row" style="display:flex;align-items:center;justify-content:space-between;">
      <div><div class="title">${escapeHtml(s.title)}</div><div class="artist">${escapeHtml(s.artist||'')}</div></div>
      ${already.has(s.id) ? '<span class="muted">Added ✓</span>' : `<button class="btn secondary" onclick="addSongToPlaylist_('${s.id}')">Add</button>`}
    </div>`).join('') : '<div class="muted" style="padding:10px 0">No matching songs.</div>';
}

  // fill (see renderContactBody) — that'd just be messaging themselves —
  // so skip the getMessages round-trip entirely for that case.
  const fetches = currentUser.isAdmin
    ? [api('getRequests', {scope:'mine'})]
    : [api('getRequests', {scope:'mine'}), api('getMessages', {scope:'mine'})];
  Promise.all(fetches).then(([reqData, msgData]) => {
    contactRequestsCache = reqData.requests || []; contactMessagesCache = msgData ? (msgData.messages || []) : [];

// Groups the flat Messages rows into one entry per conversation (per
// user_email), since that's the unit "archived" and "unread" apply to:
// a conversation is archived if its most recent message is (a new message
// from either side always arrives un-archived, see sendMessage in Code.gs),
// and it's unread if the user has sent anything the admin hasn't opened yet.
function computeThreads(list) {
  const byUser = {};
  list.forEach(m => { (byUser[m.user_email] = byUser[m.user_email] || []).push(m); });
  return Object.keys(byUser).map(email => {
    const msgs = byUser[email].slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    const last = msgs[msgs.length - 1];
    const nameMsg = msgs.slice().reverse().find(m => m.sender !== 'admin') || msgs[0];
    return {
      email, name: nameMsg.user_name || email, msgs,
      archived: !!last && last.archived === 'true',
      hasUnread: msgs.some(m => m.sender === 'user' && m.read_by_admin !== 'true'),
      lastAt: last ? last.created_at : null
    };
  }).sort((a,b) => new Date(b.lastAt) - new Date(a.lastAt));
}

  }).catch(err => { if (adminTab === 'users') document.getElementById('adminBody').innerHTML = `<div class="error">${err.message}</div>`; });
}
function renderUsersTable() {
  const body = document.getElementById('adminBody');
  if (!body) return;
  // The search box (and now the sort picker) live outside the part that
  // re-renders on every keystroke (renderUsersList's #usersListContainer) —
  // rebuilding this <input> itself on each keystroke (as one combined
  // innerHTML used to) destroys and recreates the DOM node, which drops
  // focus after every single character typed. Building it once here and
  // only ever touching the container below it keeps focus (and cursor
  // position) intact.
  body.innerHTML = `<div style="margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <input type="text" id="userSearchBox" placeholder="Search by name or email…" value="${escapeHtml(userSearch)}" style="max-width:320px;flex:1;min-width:180px;">
      <select id="userSortSelect" style="max-width:220px;">
        <option value="name" ${userSort==='name'?'selected':''}>Sort: Name (A–Z)</option>
        <option value="email" ${userSort==='email'?'selected':''}>Sort: Email (A–Z)</option>
        <option value="lastActive" ${userSort==='lastActive'?'selected':''}>Sort: Last active (newest)</option>
      </select>
    </div>
    <div id="usersListContainer"></div>`;
  const box = document.getElementById('userSearchBox');
  if (box) box.addEventListener('input', e => { userSearch = e.target.value; usersPage = 0; renderUsersList(); });
  const sel = document.getElementById('userSortSelect');
  if (sel) sel.addEventListener('change', e => { userSort = e.target.value; usersPage = 0; renderUsersList(); });
  renderUsersList();
}
function sortUsersList_(list) {
  const arr = list.slice();
  if (userSort === 'email') {
    arr.sort((a, b) => a.email.toLowerCase().localeCompare(b.email.toLowerCase()));
  } else if (userSort === 'lastActive') {
    // Users who have never been active sort to the end regardless of
    // direction - "newest first" is about surfacing recent activity, not
    // about ranking "never active" as if it were the oldest possible date.
    arr.sort((a, b) => {
      if (!a.lastActivity && !b.lastActivity) return 0;
      if (!a.lastActivity) return 1;
      if (!b.lastActivity) return -1;
      return new Date(b.lastActivity) - new Date(a.lastActivity);
    });
  } else {
    arr.sort((a, b) => (a.name || a.email).toLowerCase().localeCompare((b.name || b.email).toLowerCase()));
  }
  return arr;
}
function toggleUserExpanded(email) {
  expandedUserEmail = expandedUserEmail === email ? null : email;
  renderUsersList();
}
// Compact by default (name, email, last active) - the "View As" button and
// every other stat (favorites/known chords/playlists/requests/messages/

            </div>

            <span class="adv-chevron${expanded?' open':''}">›</span>

/* ============================================================
   GUITAR TUNER — a real mic-based tuner reachable from the main nav/Home,
   same as every other section of the app. Listens through the device
   microphone, detects the pitch being played via autocorrelation, and
   shows how far it is (in cents) from the nearest note plus which of the
   6 standard-tuning strings it's closest to.
   ============================================================ */
const GUITAR_STRINGS = [
  { name: 'E', label: 'Low E (6th string)', freq: 82.41 },
  { name: 'A', label: 'A (5th string)', freq: 110.00 },
  { name: 'D', label: 'D (4th string)', freq: 146.83 },
  { name: 'G', label: 'G (3rd string)', freq: 196.00 },
  { name: 'B', label: 'B (2nd string)', freq: 246.94 },
  { name: 'E', label: 'High E (1st string)', freq: 329.63 },
];
let tunerStream = null, tunerAudioCtx = null, tunerAnalyser = null, tunerRafId = null, tunerBuf = null;
let tunerListening = false;
let tunerError = null;

function renderTuner() {
  const listening = tunerListening;
  const html = `<div class="card" style="text-align:center;max-width:420px;margin:0 auto;">
    <p class="muted" style="margin-top:0;">Uses your device's microphone to listen to the string you're playing and shows how close it is to standard guitar tuning (E A D G B E). The first time, your browser will ask you to allow microphone access.</p>
    ${tunerError ? `<p style="color:#c0392b;font-size:13.5px;">${escapeHtml(tunerError)}</p>` : ''}
    <div id="tunerCard" class="tuner-card">
      <div id="tunerNote" class="tuner-note">—</div>
      <div class="tuner-meter"><div class="tuner-meter-track"><div id="tunerNeedle" class="tuner-needle"></div></div></div>
      <div id="tunerCentsLabel" class="muted" style="margin-top:6px;">${listening ? 'Play a string' : 'Tap Start to begin'}</div>
    </div>
    <button class="btn" style="margin-top:14px;" onclick="${listening ? 'stopTuner()' : 'startTuner()'}">${listening ? 'Stop' : 'Start Tuner'}</button>
    <div class="tuner-strings">
      ${GUITAR_STRINGS.map((s, i) => `<div id="tunerString${i}" class="tuner-string-chip" title="${escapeHtml(s.label)}">${s.name}</div>`).join('')}
    </div>
  </div>`;
  document.getElementById('app').innerHTML = html;
}

async function startTuner() {
  tunerError = null;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    tunerError = "This browser can't access the microphone here.";
    renderTuner();
    return;
  }
  try {
    tunerStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    tunerError = 'Could not access the microphone (' + (e && e.message ? e.message : 'permission denied') + '). Check your browser/site settings and try again.';
    renderTuner();
    return;
  }
  tunerAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = tunerAudioCtx.createMediaStreamSource(tunerStream);
  tunerAnalyser = tunerAudioCtx.createAnalyser();
  tunerAnalyser.fftSize = 2048;
  source.connect(tunerAnalyser);
  tunerListening = true;
  renderTuner();
  tunerLoop();
}
function stopTunerSilently_() {
  tunerListening = false;
  if (tunerRafId) cancelAnimationFrame(tunerRafId);
  tunerRafId = null;
  if (tunerStream) { tunerStream.getTracks().forEach(t => t.stop()); tunerStream = null; }
  if (tunerAudioCtx) { tunerAudioCtx.close().catch(() => {}); tunerAudioCtx = null; }
  tunerAnalyser = null;
}
function stopTuner() { stopTunerSilently_(); renderTuner(); }
// Release the mic automatically if the tab/app goes into the background
// while the tuner is running, rather than leaving it listening unseen.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && tunerListening) { stopTunerSilently_(); if (view.name === 'tuner') renderTuner(); }
});

function tunerLoop() {
  if (!tunerListening || !tunerAnalyser) return;
  if (!tunerBuf || tunerBuf.length !== tunerAnalyser.fftSize) tunerBuf = new Float32Array(tunerAnalyser.fftSize);
  tunerAnalyser.getFloatTimeDomainData(tunerBuf);
  const freq = autoCorrelatePitch_(tunerBuf, tunerAudioCtx.sampleRate);
  updateTunerReadout_(freq);
  tunerRafId = requestAnimationFrame(tunerLoop);
}

// Standard autocorrelation pitch detector: finds the lag (time offset) at
// which the signal best matches a delayed copy of itself, restricted to
// the plausible guitar frequency range, then refines that lag with a
// parabolic interpolation around the peak for sub-sample precision.
function autoCorrelatePitch_(buf, sampleRate) {
  const SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return null; // too quiet - no string being played right now
  let r1 = 0, r2 = SIZE - 1;
  const thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
  for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
  const trimmed = buf.slice(r1, r2);
  const n = trimmed.length;
  if (n < 8) return null;
  const c = new Array(n).fill(0);
  for (let lag = 0; lag < n; lag++) { for (let i = 0; i < n - lag; i++) c[lag] += trimmed[i] * trimmed[i + lag]; }
  // ~70Hz (below low E) to ~450Hz (comfortably above high e) - keeps the
  // search from locking onto a spurious very-low or very-high peak.
  const minLag = Math.floor(sampleRate / 450);
  const maxLag = Math.floor(sampleRate / 70);
  let d = 0;
  while (d < n - 1 && c[d] > c[d + 1]) d++; // skip the initial downward slope from lag 0
  let maxVal = -1, maxLagFound = -1;
  for (let lag = Math.max(d, minLag); lag <= Math.min(maxLag, n - 1); lag++) {
    if (c[lag] > maxVal) { maxVal = c[lag]; maxLagFound = lag; }
  }
  if (maxLagFound <= 0) return null;
  const T0 = maxLagFound;
  const x1 = c[T0 - 1] !== undefined ? c[T0 - 1] : c[T0];
  const x2 = c[T0];
  const x3 = c[T0 + 1] !== undefined ? c[T0 + 1] : c[T0];
  const a = (x1 + x3 - 2 * x2) / 2;
  const bb = (x3 - x1) / 2;
  const refinedLag = a ? T0 - bb / (2 * a) : T0;
  const frequency = sampleRate / refinedLag;
  return (isFinite(frequency) && frequency > 0) ? frequency : null;
}
function noteNumberFromFrequency_(freq) { return 12 * (Math.log(freq / 440) / Math.log(2)) + 69; }
function frequencyFromNoteNumber_(note) { return 440 * Math.pow(2, (note - 69) / 12); }
function centsOffFromPitch_(freq, note) { return Math.round(1200 * Math.log(freq / frequencyFromNoteNumber_(note)) / Math.log(2)); }
function noteNameFromNumber_(n) { return NOTES_SHARP[((Math.round(n) % 12) + 12) % 12]; }

function updateTunerReadout_(freq) {
  const noteEl = document.getElementById('tunerNote');
  if (!noteEl) return; // navigated away from the Tuner page mid-frame
  const centsEl = document.getElementById('tunerCentsLabel');
  const needleEl = document.getElementById('tunerNeedle');
  const cardEl = document.getElementById('tunerCard');
  if (!freq) {
    noteEl.textContent = '—';
    if (centsEl) centsEl.textContent = 'Play a string';
    if (needleEl) needleEl.style.transform = 'rotate(0deg)';
    if (cardEl) cardEl.className = 'tuner-card';
    highlightClosestString_(null);
    return;
  }
  const noteNum = noteNumberFromFrequency_(freq);
  const rounded = Math.round(noteNum);
  const cents = centsOffFromPitch_(freq, rounded);
  noteEl.textContent = noteNameFromNumber_(rounded);
  const inTune = Math.abs(cents) <= 5;
  if (centsEl) centsEl.textContent = (cents > 0 ? '+' : '') + cents + ' cents (' + freq.toFixed(1) + ' Hz)';
  if (needleEl) needleEl.style.transform = `rotate(${Math.max(-45, Math.min(45, cents * 0.9))}deg)`;
  if (cardEl) cardEl.className = 'tuner-card' + (inTune ? ' in-tune' : (cents < 0 ? ' flat' : ' sharp'));
  highlightClosestString_(freq);
}
function highlightClosestString_(freq) {
  GUITAR_STRINGS.forEach((s, i) => { const el = document.getElementById('tunerString' + i); if (el) el.classList.remove('closest'); });
  if (!freq) return;
  let best = 0, bestDiff = Infinity;
  GUITAR_STRINGS.forEach((s, i) => { const diff = Math.abs(Math.log2(freq / s.freq)); if (diff < bestDiff) { bestDiff = diff; best = i; } });
  const el = document.getElementById('tunerString' + best);
  if (el) el.classList.add('closest');
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('shareIcon').src = ICONS.share;
document.getElementById('shareBtn').onclick = shareApp;
// Optimistically restore a cached signed-in session (see saveAuthCache/
// loadAuthCache above) before Google's own script — or its silent
// auto_select/FedCM prompt — has had any chance to run. This is what stops
// the sign-in gate from flashing on every reload, including a mobile
// pull-to-refresh. If the cached idToken has actually expired, the first
// real API call fails and the existing expiry handling in api() drops back
// to the gate — but initGoogleSignIn()'s silent prompt below usually lands
// a fresh token (via handleCredentialResponse, which re-saves the cache)
// well before that ever surfaces to the user.
const cachedAuth = loadAuthCache();
if (cachedAuth && cachedAuth.idToken) currentUser = cachedAuth;
// Paint the last-known favorites/knownChords immediately too (see
// saveMyDataCache above) instead of starting from a blank array on every
// reload — without this, the Favorites/Known Chords pages always looked
// empty for the few seconds (or, if getMyData then failed, indefinitely)
// until that round trip landed, which is what made it look like favorites
// had gone missing.
if (currentUser) {
  const cachedMyData = loadMyDataCache(currentUser.email);
  if (cachedMyData) { favorites = cachedMyData.favorites || []; knownChords = cachedMyData.knownChords || []; }
}
// Reopen whatever page was open before the reload (see saveViewCache above)
// instead of always resetting to Home/Welcome — this is what makes a mobile
// pull-to-refresh stay put on, say, the Known Chords page instead of
// bouncing back to the start.
const cachedView = loadViewCache();
if (cachedView) view = cachedView;
// Seeds the history stack with the screen we're actually starting on, so
// pushViewHistory_ (see goTo above) has something correct to compare
// against and popstate has something correct to fall back to/past.
try { history.replaceState({ jgcView: view }, ''); } catch (e) {}
// Hydrate the song catalog from its own cache (see saveCatalogCache above)
// before the real network fetch even starts, so whichever page comes back
// (a song list, a chart, a playlist) has something real to show on this
// very first render() a few lines down, instead of an empty "Loading…"
// state. loadSongs()/loadSongContentAll(), kicked off below by
// startAfterSignIn(), still run right away and quietly replace this with
// fresh data (and re-save the cache) once they land.
// Only for a session that's at least optimistically signed in (currentUser
// set from the auth cache above) — render() only ever shows this restored
// data behind that same currentUser check, but the raw chords/lyrics text
// would otherwise still sit in this page's memory for anyone signed out to
// find (e.g. via devtools), which defeats the point of gating everything
// behind sign-in in the first place. Skipping the restore for a genuinely
// signed-out visitor also means their browser stops carrying content from
// whoever used this device before them the moment that earlier session's
// own sign-out/expiry has cleared the cache (see signOut()/expireSession_).
// A device that already had this cache saved from BEFORE that clearing
// existed won't have had it wiped by either of those, so also sweep it
// away right here, once, for a visitor who's (still, or already) signed out.
if (!currentUser) { try { localStorage.removeItem(CATALOG_CACHE_KEY); } catch (e) {} }
const cachedCatalog = currentUser ? loadCatalogCache() : null;
if (cachedCatalog) {
  songs = cachedCatalog.songs || [];
  playlists = cachedCatalog.playlists || [];
  songContentById = cachedCatalog.songContentById || {};
  songContentLoaded = Object.keys(songContentById).length > 0;
}
renderUserArea();
render(); // show the sign-in gate (or restore a still-valid session's view) immediately
renderOfflineBanner(); // in case the browser already knows we have no connection at load
if (currentUser) { loadMyData(); startAfterSignIn(); }
window.addEventListener('load', initGoogleSignIn);
// Google's own silent sign-in only actually gets attempted once, at that
// 'load' listener above. An ID token is only good for about an hour, so
// any session left open longer than that — the overwhelmingly common case
// for a phone that gets locked and reopened later, or a browser tab left
// open overnight — was relying entirely on that single attempt from page
// load, which by then could be long past. Re-attempting a silent prompt
// every time the tab/app becomes visible again gives Google many more
// chances to quietly refresh the token BEFORE it's actually used and fails
// (the tokenPrompt call is already a documented no-op when there's nothing
// eligible, e.g. mid-cooldown after a prompt was dismissed — see
// initGoogleSignIn above — so calling it more often than strictly needed
// is harmless).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && currentUser && window.google) {
    try { google.accounts.id.prompt(); } catch (e) {}
  }
});
</script>
