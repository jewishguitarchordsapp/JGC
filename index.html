    const targetEmail = String(fields.user_email || '').toLowerCase();
    const { data: target, error: tErr } = await getSupa_().from('profiles').select('id').eq('email', targetEmail).maybeSingle();
    throwIfErr_(tErr);
    if (!target) return { success: true };
    const { error } = await getSupa_().from('messages').update({ read_by_admin: true }).eq('user_id', target.id).eq('sender', 'user');
    throwIfErr_(error);
    return { success: true };
  }

  if (action === 'createErrorReport') {
    const me = await supaRequireUser_();
    const { error } = await getSupa_().from('errors').insert({
      user_id: me.id, song_id: fields.song_id || null, song_title: fields.song_title || '',
      artist: fields.artist || '', description: fields.description || '', status: 'open',
    });
    throwIfErr_(error);
    return { success: true };
  }
  if (action === 'updateErrorReport') {
    await supaRequireAdmin_();
    const { error } = await getSupa_().from('errors').update({ status: fields.status }).eq('id', fields.id);
    throwIfErr_(error);
    return { success: true };
  }
  if (action === 'archiveError') {
    await supaRequireAdmin_();
    const { error } = await getSupa_().from('errors').update({ archived: !!fields.archived }).eq('id', fields.id);
    throwIfErr_(error);
    return { success: true };
  }

  return { success: false, error: 'Unknown action: ' + action };
}

// ---- old-shape converters (Postgres row + {id:{email,name}} map -> the
// exact object shape Code.gs used to return, including 'true'/'false'
// STRING booleans since that's what the rest of this file compares against) ----
function supaRequestToOld_(r, emailMap) {
  const who = emailMap[r.user_id] || {};
  return {
    id: r.id, user_email: who.email || '', user_name: who.name || who.email || '',
    song_title: r.song_title, artist: r.artist, note: r.note || '', status: r.status,
    created_at: r.created_at, archived: supaBool_(r.archived),
    youtube_url: r.youtube_url || '', categories: r.categories || [], lyrics: r.lyrics || '',
  };
}
function supaMessageToOld_(m, emailMap) {
  const who = emailMap[m.user_id] || {};
  return {
    id: m.id, user_email: who.email || '', user_name: who.name || who.email || '',
    sender: m.sender, text: m.text, created_at: m.created_at,
    archived: supaBool_(m.archived), read_by_admin: supaBool_(m.read_by_admin),
  };
}
function supaErrorToOld_(e, emailMap) {
  const who = emailMap[e.user_id] || {};
  return {
    id: e.id, user_email: who.email || '', user_name: who.name || who.email || '',
    song_id: e.song_id || '', song_title: e.song_title || '', artist: e.artist || '',
    description: e.description, status: e.status, created_at: e.created_at, archived: supaBool_(e.archived),
  };
}

// Cleanly unwinds an expired/invalid session so the app ends up in exactly
// the same state as an explicit Sign Out, instead of a half-updated one.
// Before this, the expiry branch above only cleared currentUser and
// repainted the header, leaving the rest of the page showing whatever was
// already on screen until something else happened to re-render it - which
// is what made this look like "it randomly wants me to sign in again". It
// also left the stale idToken sitting in the auth cache, so the very next
// reload just hydrated that same dead token and hit the same failure again
// in a loop, and never reset myDataReady, so even a real, successful
// re-sign-in afterward would skip loadMyData() entirely (see its
// `if (!myDataReady)` guard in handleCredentialResponse) and leave
// favorites/knownChords permanently empty for the rest of that page's life
// - which is what made it look like "no favorites or playlists" even for
// someone who very much has both.
function expireSession_() {
  currentUser = null; favorites = []; knownChords = []; viewAsUser = null; viewAsData = null;
  saveAuthCache(null);
  myDataReady = false;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  dataStarted = false;
  // Same reasoning as signOut() above: an expired token should leave this
  // browser in exactly the state a fresh, never-signed-in visitor would be
  // in — nothing left over from the cached song/chord/lyric text (see
  // saveCatalogCache) either in memory or in localStorage.
  songs = []; playlists = []; songContentById = {}; songContentLoaded = false;
  try { localStorage.removeItem(CATALOG_CACHE_KEY); } catch (e) {}
  renderUserArea();
  render();
}

// Guards against two full catalog loads running at once (e.g. the periodic
// auto-refresh firing while a write's own refresh is still in flight) -
// each one is a real multi-hundred-KB-to-MB fetch now, so overlapping ones
// only add peak memory/network pressure for no benefit; the second caller
// just waits for the one already in progress instead of starting a
// redundant twin.
let loadSongsInFlight = null;
function loadSongs(showSpinner) {
  if (loadSongsInFlight) return loadSongsInFlight;
  loadSongsInFlight = loadSongsInner_(showSpinner).finally(() => { loadSongsInFlight = null; });
  return loadSongsInFlight;
}
async function loadSongsInner_(showSpinner) {
  const footer = document.getElementById('footerStatus');
  if (showSpinner) footer.textContent = 'Loading songs…';
  try {
    songs = await apiList();
    // The list endpoint only sends lightweight fields (see loadSongContentAll) —
    // re-apply any full song text we already fetched, since it persists across
    // this periodic refresh replacing the `songs` array wholesale.
    songs.forEach(s => { const c = songContentById[s.id]; if (c) { s.chords_lyrics = c.chords_lyrics; s.lyrics_only = c.lyrics_only; } });
    const pl = await api('getPlaylists', {});
    playlists = pl.playlists || [];
    lastSynced = new Date();
    renderFooter();
    // Admin's own tabs (Requests/Messages/Errors/Users) don't read the
    // songs/playlists globals at all, so re-running render() for them here
    // was pure disruption: every periodic tick (see AUTO_REFRESH_SECONDS)
    // wiped the whole admin panel back to "Loading…" and re-fired whichever
    // tab's fetch was current, even mid-click — this is what admins were
    // seeing as "always loading" / "jumps to a different tab".
    if (view.name !== 'admin') render();
    saveCatalogCache();
  } catch (err) {
    if (isOffline && songs.length === 0) {
      // Cold boot with no network at all and nothing loaded yet this
      // session — fall back to whatever's been saved for offline viewing
      // (see OFFLINE AVAILABILITY below) instead of just sitting on an
      // error. loadFromOfflineCache() re-renders itself once it's done.
      await loadFromOfflineCache();
      footer.textContent = "You're offline — showing content saved for offline use.";
    } else {
      footer.textContent = 'Could not load songs: ' + err.message;
    }
  }
}

// The bulk song list is lightweight on purpose (see doGet 'list' in Code.gs) —
// it leaves out each song's chords/lyrics text so the app is interactive fast
// even with thousands of songs. This fetches that full text for every song,
// once, and merges it in; only needed for lyric search across the whole
// library (Known Songs filtering uses the precomputed chords_used field
// instead — see songKnown — and never needs this at all).
async function loadSongContentAll() {
  if (isOffline) return;
  try {
    // 'listContent' now requires sign-in too (see doPost in Code.gs) — go
    // through the shared, authenticated api() helper instead of a raw public
    // fetch, same reasoning as apiList() above.
    const data = await api('listContent', {});
    data.content.forEach(c => { songContentById[c.id] = { chords_lyrics: c.chords_lyrics, lyrics_only: c.lyrics_only }; });
    songs.forEach(s => { const c = songContentById[s.id]; if (c) { s.chords_lyrics = c.chords_lyrics; s.lyrics_only = c.lyrics_only; } });
    songContentLoaded = true;
    if (view.name === 'list' && filters.q) renderSongListBody();
    if (view.name === 'detail') renderDetail();
    saveCatalogCache();
  } catch (err) { console.error('Failed to load full song text', err); }
}

// Kicks off loadSongContentAll() the first time it's actually needed —
// lyric search typed into the Songs search box — instead of unconditionally
// on every sign-in. Safe to call repeatedly; only ever fetches once (per
// page load) thanks to the songContentLoading/songContentLoaded guards.
let songContentLoading = false;
function ensureSongContentLoaded() {
  if (songContentLoaded || songContentLoading || isOffline) return;
  songContentLoading = true;
  loadSongContentAll().finally(() => { songContentLoading = false; });
}

// Only start pulling the song catalog and the periodic refresh once someone
// has actually signed in — these previously fired unconditionally at page
// load, hitting the backend before we even knew whether a visitor was
// signed in. The full lyrics/chords corpus (loadSongContentAll) is no
// longer kicked off here at all — see ensureSongContentLoaded() below; it's
// only needed for lyric search, and fetching ~13MB of text for every single
// sign-in (whether or not anyone ever searches) was the biggest single
// contributor to backend slow-loads and intermittent failures.
function startAfterSignIn() {
  if (dataStarted) return;
  dataStarted = true;
  loadSongs(true);
  refreshTimer = setInterval(() => loadSongs(false), CONFIG.AUTO_REFRESH_SECONDS * 1000);
}

// Fetches one song's full text on demand — used when its detail page is
// opened before the background fetch above has finished, so viewing a chart
// is never stuck waiting on every other song's text too.
async function loadSongContentFor(id) {
  if (isOffline) return;
  try {
    // 'songContent' now requires sign-in too, and takes the id in the POST
    // body rather than a GET query string (see doPost in Code.gs — query
    // strings are also just the wrong place for anything identity-related,
    // since they end up in logs/history). Same api() helper as above.
    const data = await api('songContent', { id });
    songContentById[id] = { chords_lyrics: data.chords_lyrics, lyrics_only: data.lyrics_only };
    const song = songs.find(s => s.id === id);
    if (song) { song.chords_lyrics = data.chords_lyrics; song.lyrics_only = data.lyrics_only; }
  } catch (err) { console.error('Failed to load song text', err); }
  const song2 = songs.find(s => s.id === id);
  if (song2) delete song2._contentPending;
  if (view.name === 'detail' && view.id === id) renderDetail();
}

function renderFooter() {
  const footer = document.getElementById('footerStatus');
  const time = lastSynced ? lastSynced.toLocaleTimeString() : '—';
  footer.innerHTML = `Synced at ${time} &nbsp;·&nbsp; <a href="#" onclick="loadSongs(true);return false;">Refresh now</a>`;
}

/* ============================================================
   OFFLINE AVAILABILITY — a user can mark their Favorites, and/or any
   individual playlist, "available offline": every one of those songs' full
   chart text gets saved into this browser's IndexedDB, so opening the app
   with no connection at all still shows that saved content (read-only —
   nothing can be changed until back online, per api()/apiList()'s shared
   offline guard above).
   ============================================================ */
const OFFLINE_DB_NAME = 'jgc_offline_v1';
function offlineDbOpen_() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(OFFLINE_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('songs')) db.createObjectStore('songs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('sets')) db.createObjectStore('sets', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
// sets: {id: 'favorites' | 'playlist:<playlistId>', title, songIds: [...], savedAt}
// songs: full song objects (incl. chords_lyrics/lyrics_only), keyed by id,
// shared across every set — a song saved by two different offline sets is
// only stored once.
const offlineDb = {
  async getAllSets() {
    const db = await offlineDbOpen_();
    return new Promise((resolve, reject) => {
      const req = db.transaction('sets', 'readonly').objectStore('sets').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },
  async getSet(id) {
    const db = await offlineDbOpen_();
    return new Promise((resolve, reject) => {
      const req = db.transaction('sets', 'readonly').objectStore('sets').get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  },
  async getSongs(ids) {
    if (!ids.length) return [];
    const db = await offlineDbOpen_();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('songs', 'readonly');
      const store = tx.objectStore('songs');
      const out = [];
      let remaining = ids.length;
      ids.forEach(id => {
        const req = store.get(id);
        req.onsuccess = () => { if (req.result) out.push(req.result); if (--remaining === 0) resolve(out); };
        req.onerror = () => { if (--remaining === 0) resolve(out); };
      });
    });
  },
  async putSongsAndSet(songList, setObj) {
    const db = await offlineDbOpen_();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['songs', 'sets'], 'readwrite');
      const songStore = tx.objectStore('songs');
      songList.forEach(s => songStore.put(s));
      tx.objectStore('sets').put(setObj);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  async deleteSet(id) {
    const db = await offlineDbOpen_();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('sets', 'readwrite');
      tx.objectStore('sets').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
};

function offlineSetIdForPlaylist(playlistId) { return 'playlist:' + playlistId; }

// True if this exact set (Favorites, or a given playlist) is currently
// saved for offline use. Used to decide the toggle button's label.
async function isOfflineAvailable(setId) {
  try { return !!(await offlineDb.getSet(setId)); } catch (e) { return false; }
}

// Makes sure every one of these song ids has its full chart text in memory
// (songContentById), fetching whichever ones are missing — needed before
// saving them offline, since the lightweight 'list' payload alone doesn't
// include chords_lyrics/lyrics_only.
async function ensureContentFor(ids) {
  const missing = ids.filter(id => !songContentById[id]);
  await Promise.all(missing.map(id => loadSongContentFor(id)));
}

// Saves the given songs into IndexedDB under setId/title, available offline
// from then on. Throws if fetching any song's full text fails (e.g. no
// connection right now) — the caller shows that as an alert.
async function setOfflineAvailable(setId, title, songIds) {
  await ensureContentFor(songIds);
  const fullSongs = songIds.map(id => songs.find(s => s.id === id)).filter(Boolean).map(s => ({
    id: s.id, title: s.title, title_hebrew: s.title_hebrew || '', artist: s.artist || '',
    categories: s.categories || '', capo: s.capo || 0, youtube_url: s.youtube_url || '',
    chords_lyrics: (songContentById[s.id] || {}).chords_lyrics || s.chords_lyrics || '',
    lyrics_only: (songContentById[s.id] || {}).lyrics_only || s.lyrics_only || '',
    date_added: s.date_added || '', chords_used: s.chords_used || []
  }));
  await offlineDb.putSongsAndSet(fullSongs, { id: setId, title, songIds: songIds.slice(), savedAt: Date.now() });
}
async function removeOfflineAvailable(setId) {
  await offlineDb.deleteSet(setId);
  // Deliberately leaves each song's cached text in IndexedDB even if no
  // remaining set references it — a few stray KB of leftover chart text
  // costs nothing, and skipping a full-store reachability scan keeps this
  // instant. (It'll simply be overwritten if a set ever saves that song again.)
}

// Rebuilds songs/playlists/favorites from whatever's been saved offline —
// used on a cold boot with no connection at all (see loadSongs()'s catch
// above). Every existing view (song rows, chart rendering, playlist detail)
// reads these same globals, so nothing else has to change to work offline.
async function loadFromOfflineCache() {
  try {
    const sets = await offlineDb.getAllSets();
    const allIds = new Set();
    sets.forEach(s => (s.songIds || []).forEach(id => allIds.add(id)));
    songs = await offlineDb.getSongs(Array.from(allIds));
    songs.forEach(s => { songContentById[s.id] = { chords_lyrics: s.chords_lyrics, lyrics_only: s.lyrics_only }; });
    songContentLoaded = true;
    const favSet = sets.find(s => s.id === 'favorites');
    favorites.length = 0; if (favSet) favorites.push(...favSet.songIds);
    playlists = sets.filter(s => s.id.indexOf('playlist:') === 0).map(s => ({
      id: s.id.slice('playlist:'.length), title: s.title, song_ids: s.songIds,
      visibility: 'private', owner_email: currentUser ? currentUser.email : '', owner_name: 'Saved offline'
    }));
    render();
  } catch (e) { console.error('Could not load offline content', e); }
}

// Shows/hides the persistent "you're offline" banner and flips isOffline.
function setOffline(value) {
  const changed = isOffline !== value;
  isOffline = value;
  renderOfflineBanner();
  if (changed && !isOffline) {
    // Back online — do a full, clean resync rather than trying to patch up
    // whatever partial/offline state is currently in memory.
    if (dataStarted) { loadSongs(true); refreshPlaylistsOnly().catch(()=>{}); }
    if (currentUser) loadMyData();
  }
}
function renderOfflineBanner() {
  let el = document.getElementById('offlineBanner');
  if (isOffline) {
    if (!el) {
      el = document.createElement('div');
      el.id = 'offlineBanner';
      el.className = 'offline-banner';
      el.textContent = "📡 You're offline — showing saved content. Changes can't be made until you're back online.";
      document.body.insertBefore(el, document.body.firstChild);
    }
  } else if (el) { el.remove(); }
}
window.addEventListener('offline', () => setOffline(true));
window.addEventListener('online', () => setOffline(false));

/* ============================================================
   CHORD PARSING + TRANSPOSE
   ============================================================ */
const NOTES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

function noteIndex(note) { let i = NOTES_SHARP.indexOf(note); if (i >= 0) return i; return NOTES_FLAT.indexOf(note); }

// Chord names use a plain lowercase "b" for a flat (Bb, Ebmaj7, C7b9, C/Bb…)
// — easy to misread next to the note name "B" itself. This is purely a
// display-time touch-up: it turns just the accidental positions (root,
// bass note after "/", and altered extensions like "b5"/"b9") into the real
// ♭ symbol. Never applied to stored/compared chord data (COMMON_CHORDS,
// knownChords, chordsUsedIn's matching path) — only at the point a chord
// name is rendered to the screen, so "Bb" the data and "B♭" the display
// stay two different things on purpose.
function formatChordSymbol(chord) {
  if (!chord) return chord;
  const m = String(chord).match(/^([A-Ga-g])(#|b)?(.*)$/);
  if (!m) return chord;
  let [, root, acc, rest] = m;
  root = root.toUpperCase() + (acc === 'b' ? '♭' : (acc || ''));
  rest = rest.replace(/\/([A-Ga-g])(#|b)?/, (full, bassNote, bassAcc) =>
    '/' + bassNote.toUpperCase() + (bassAcc === 'b' ? '♭' : (bassAcc || '')));
  rest = rest.replace(/b(\d)/g, '♭$1');
  return root + rest;
}

function transposeChord(chord, semitones) {
  if (!chord || !semitones) return chord;
  const m = chord.match(/^([A-Ga-g])(#|b)?(.*)$/);
  if (!m) return chord;
  const root = m[1].toUpperCase() + (m[2] || '');
  let rest = m[3] || ''; let bass = null;
  const slash = rest.match(/^(.*)\/([A-Ga-g])(#|b)?$/);
  if (slash) { rest = slash[1]; bass = slash[2].toUpperCase() + (slash[3] || ''); }
  const preferFlat = root.indexOf('b') >= 0;
  const idx = noteIndex(root);
  if (idx < 0) return chord;
  const newIdx = ((idx + semitones) % 12 + 12) % 12;
  let result = (preferFlat ? NOTES_FLAT : NOTES_SHARP)[newIdx] + rest;
  if (bass) {
    const bIdx = noteIndex(bass);
    if (bIdx >= 0) { const newBIdx = ((bIdx + semitones) % 12 + 12) % 12; result += '/' + (preferFlat ? NOTES_FLAT : NOTES_SHARP)[newBIdx]; }
    else result += '/' + bass;
  }
  return result;
}

function parseChordLine(line) {
  const tokens = line.split(/(\[[^\]]+\])/g);
  const segments = []; let currentChord = null;
  tokens.forEach(tok => {
    if (tok === '') return;
    const m = tok.match(/^\[([^\]]+)\]$/);
    if (m) { currentChord = m[1]; } else { segments.push({ chord: currentChord, text: tok }); currentChord = null; }
  });
  if (currentChord) segments.push({ chord: currentChord, text: ' ' });
  return segments;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Generic popup used for small forms (e.g. "Request a Song") that don't
// warrant a whole page — a simple backdrop + card appended to <body>,
// closed by its Cancel button, an Escape press, or a click outside the card.
function openModal(bodyHtml) {
  closeModal();
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  el.id = 'modalBackdrop';
  el.onclick = (e) => { if (e.target.id === 'modalBackdrop') closeModal(); };
  el.innerHTML = `<div class="modal-card">${bodyHtml}</div>`;
  document.body.appendChild(el);
  document.addEventListener('keydown', modalEscHandler_);
}
function modalEscHandler_(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  const el = document.getElementById('modalBackdrop');
  if (el) el.remove();
  document.removeEventListener('keydown', modalEscHandler_);
  // A pending customConfirmAsync/customPromptAsync (see below) being
  // dismissed via Escape or a backdrop click - rather than one of its own
  // Cancel/Confirm buttons, which resolve it themselves through
  // resolveDialog_ before ever reaching here - needs to resolve to a
  // "cancelled" value too, or the awaiting call site would hang forever.
  if (window.__dialogResolve) {
    const resolve_ = window.__dialogResolve;
    window.__dialogResolve = null;
    resolve_(false);
  }
}

/* ------------------------------------------------------------------
   Custom alert/confirm/prompt replacements for the browser's native
   ones - those render as "jewishguitarchordsapp.github.io says: ..."
   with a browser-owned OK/Cancel row that can't be restyled, which read
   as a broken/unofficial popup rather than part of the app. These reuse
   the same modal-card look as every other in-app form instead.
   customAlert() is a drop-in, fire-and-forget replacement (window.alert
   is overridden to call it below, so every existing alert(...) call site
   in this file gets the new styling for free). customConfirmAsync/
   customPromptAsync can't be drop-in replacements for window.confirm/
   window.prompt, because a custom dialog can't pause script execution
   and hand back a value the way the real synchronous ones do - so each
   call site that used to do `if (!confirm(...)) return;` is instead
   awaited inside an async function (see deleteSongConfirm etc. below). */
function customAlert(message, title) {
  openModal(`
    ${title ? `<h2>${escapeHtml(title)}</h2>` : ''}
    <p style="white-space:pre-wrap;">${escapeHtml(String(message))}</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">OK</button></div>
  `);
}
window.alert = function (message) { customAlert(message); };
// Settles a pending confirm/prompt dialog with its real answer. Clears
// window.__dialogResolve BEFORE calling closeModal() - closeModal() has
// its own fallback that resolves a still-pending dialog to `false` (for
// Escape/backdrop dismissal, see above), and if that ran first here it
// would win the race and silently turn every real "Confirm"/"Save" click
// into a cancel.
function resolveDialog_(val) {
  const resolve_ = window.__dialogResolve;
  window.__dialogResolve = null;
  closeModal();
  if (resolve_) resolve_(val);
}
function customConfirmAsync(message, opts) {
  return new Promise(resolve => {
    openModal(`
      <h2>${escapeHtml((opts && opts.title) || 'Are you sure?')}</h2>
      <p style="white-space:pre-wrap;">${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="btn secondary" onclick="resolveDialog_(false)">Cancel</button>
        <button class="btn${opts && opts.danger ? ' danger' : ''}" onclick="resolveDialog_(true)">${escapeHtml((opts && opts.confirmLabel) || 'OK')}</button>
      </div>
    `);
    window.__dialogResolve = resolve;
  });
}
function customPromptAsync(label, defaultValue, opts) {
  return new Promise(resolve => {
    openModal(`
      ${opts && opts.title ? `<h2>${escapeHtml(opts.title)}</h2>` : ''}
      ${label ? `<label>${escapeHtml(label)}</label>` : ''}
      <input type="text" id="customPromptInput" value="${escapeHtml(defaultValue || '')}" placeholder="${escapeHtml((opts && opts.placeholder) || '')}" onkeydown="if(event.key==='Enter'){event.preventDefault();resolveDialog_(document.getElementById('customPromptInput').value);}">
      <div class="modal-actions">
        <button class="btn secondary" onclick="resolveDialog_(null)">Cancel</button>
        <button class="btn" onclick="resolveDialog_(document.getElementById('customPromptInput').value)">${escapeHtml((opts && opts.submitLabel) || 'Save')}</button>
      </div>
    `);
    window.__dialogResolve = resolve;
    setTimeout(() => { const el = document.getElementById('customPromptInput'); if (el) { el.focus(); el.select(); } }, 0);
  });
}

// Songs imported from the old app store their chart as HTML paragraph pairs
// (a "-red" chords paragraph immediately followed by a "-black" lyrics
// paragraph, spaced with &nbsp; for column alignment). New songs added
// through this app's own form use simple [Chord]word bracket notation.
// Both are supported — auto-detected here — and rendered consistently.
function isHtmlChordFormat(s) { return /<p[\s>]/i.test(s || ''); }

const SUP_PLACEHOLDER = '\u0001';
// Renders an imported chord row (chord symbols separated by &nbsp;/space
// padding, e.g. "C     F     Em", meant to visually line up over specific
// words in the lyric row directly below via a shared monospace column
// grid) as a set of absolutely-positioned spans instead of one inline
// padded string.
//
// This replaces an earlier version (transposeChordHtmlFragment) that swapped
// each chord's text in place but left the surrounding padding untouched -
// harmless when a transposed chord's name is the same length as before, but
// wrong whenever it isn't (e.g. G -> G# gains a character): everything
// after it on that line would shift one column to the right of the word
// it's supposed to sit over, misaligning every later chord on the line.
// Computing each chord's column from the ORIGINAL, untransposed text once
// and rendering it as its own absolutely-positioned span fixes that - the
// same technique already used for the [Chord]word bracket format (see
// .cw/.chord above), which was never affected by this bug for exactly this
// reason.
//
// isRtl mirrors renderChordHtmlBody's own choice of which edge this row
// hugs - with everything now absolutely positioned, the parent's
// text-align no longer has any effect on these children, so the edge has
// to be chosen explicitly here instead: `right:Ncol` for a right-hugging
// (RTL-paired) row, `left:Ncol` otherwise, each measured as a distance from
// the row's own left/right edge so it's exactly as stable under
// transposition as the left-anchored case.
//
// <sup> (a chord extension rendered as a superscript, e.g. C<sup>7</sup>)
// is stashed as a same-length run of placeholder characters so it still
// counts correctly toward column widths, then restored once each token's
// final display text is built.
function renderFixedChordRow_(html, semitones, isRtl) {
  const stash = [];
  const protectedHtml = html.replace(/<sup>([\s\S]*?)<\/sup>/gi, (m, inner) => {
    stash.push(m);
    const len = inner.replace(/<[^>]*>/g, '').length || 1;
    return SUP_PLACEHOLDER.repeat(len);
  });
  const plain = protectedHtml.replace(/&nbsp;| /gi, ' ');
  // A second, parallel plain-text version with each <sup>...</sup>'s REAL
  // text substituted in (e.g. "7"), instead of a same-length placeholder -
  // used only so each token's data-chord attribute (see CHORD DIAGRAMS
  // below) gets a clean, directly-parseable chord string like "C7" rather
  // than "C" plus an unreadable placeholder character. Splitting this on
  // the same whitespace-boundary regex as `plain` below always produces
  // the same number of segments in the same whitespace-vs-not pattern,
  // since swapping a <sup> run for its real text (instead of a same-length
  // placeholder run) never adds or removes any whitespace - so the two
  // token arrays stay index-aligned and can be read in the same loop.
  const plainReal = html.replace(/<sup>([\s\S]*?)<\/sup>/gi, (m, inner) => inner.replace(/<[^>]*>/g, ''))
    .replace(/&nbsp;| /gi, ' ');
  const totalLen = plain.length;
  const parts = plain.split(/(\s+)/);
  const partsReal = plainReal.split(/(\s+)/);
  let col = 0;
  const spans = [];
  parts.forEach((part, idx) => {
    if (part === '') return;
    if (/^\s+$/.test(part)) { col += part.length; return; }
    const tokenLen = part.length;
    const startCol = col;
    col += tokenLen;
    const rawTransposed = transposeChord(part, semitones || 0);
    const displayed = formatChordSymbol(rawTransposed)
      .replace(new RegExp(SUP_PLACEHOLDER + '+', 'g'), () => stash.shift());
    const edgeStyle = isRtl ? `right:${totalLen - startCol - tokenLen}ch` : `left:${startCol}ch`;
    const realToken = (partsReal[idx] || part).trim();
    const dataChord = transposeChord(realToken, semitones || 0);
    spans.push(`<span class="chord-tap" data-chord="${escapeHtml(dataChord)}" style="position:absolute;${edgeStyle};top:0;white-space:nowrap;">${displayed}</span>`);
  });
  return spans.join('');
}

// Hebrew/Yiddish text uses the Hebrew Unicode block - any such character
// means the line reads right-to-left. Chord symbols (Em, C7, ...) are
// always plain Latin letters/digits, so a chord line never "contains
// Hebrew" itself - its alignment should instead match whichever lyric
// line it sits above, not its own (irrelevant) character direction.
function containsHebrew(s) { return /[\u0590-\u05FF]/.test(s || ''); }

function renderChordHtmlBody(html, transposeSemitones) {
  const container = document.createElement('div');
  container.innerHTML = html;
  const paragraphs = Array.from(container.querySelectorAll('p'));
  const texts = paragraphs.map(p => (p.textContent || '').replace(/\xa0/g, ' ').trim());
  const isRtl = texts.map(containsHebrew);
  return paragraphs.map((p, i) => {
    const cls = (p.className || '').toLowerCase();
    const text = texts[i];
    if (text === '') return '<div class="chord-line">&nbsp;</div>';
    const isChordRow = cls.includes('red');
    let rtl = isRtl[i];
    if (isChordRow && !rtl) {
      // Borrow direction from the next non-blank line (normally the lyric
      // line right below this chord line) so chords over Hebrew/Yiddish
      // lyrics stay right-aligned, and chords over English lyrics stay left.
      for (let j = i + 1; j < paragraphs.length; j++) {
        if (texts[j] !== '') { rtl = isRtl[j]; break; }
      }
    }
    if (isChordRow) {
      // A chord line is authored as a left-to-right run of chord symbols
      // with runs of &nbsp; padding between them, positioning each chord
      // over a specific word (e.g. "C     F     Em"). renderFixedChordRow_
      // renders each chord as its own absolutely-positioned span (column
      // computed once from the original, untransposed text) rather than one
      // inline padded string, so which edge it hugs is now passed in
      // explicitly (isRtl) instead of being handled via text-align, which
      // has no effect on absolutely-positioned children. Still always
      // left-to-right internally either way - reordering the chord symbols
      // relative to each other (as direction:rtl would) was never wanted,
      // only which edge the whole row hugs, keeping chords over Hebrew/
      // Yiddish lyrics right-aligned and chords over English lyrics
      // left-aligned.
      const inner = renderFixedChordRow_(p.innerHTML, transposeSemitones || 0, rtl);
      return `<div class="html-chord-row" style="direction:ltr;">${inner}</div>`;
    }
    const lyricAlignStyle = rtl ? 'direction:rtl;text-align:right;' : 'direction:ltr;text-align:left;';
    return `<div class="html-lyric-row" style="${lyricAlignStyle}">${p.innerHTML}</div>`;
  }).join('');
}

function extractChordTokensFromHtml(html, transposeSemitones) {
  const container = document.createElement('div');
  container.innerHTML = html;
  const found = new Set();
  container.querySelectorAll('p').forEach(p => {
    const cls = (p.className || '').toLowerCase();
    if (!cls.includes('red')) return;
    const text = (p.textContent || '').replace(/ /g, ' ');
    text.split(/\s+/).forEach(tok => {
      const t = tok.trim();
      if (t && /^[A-Ga-g]/.test(t)) found.add(transposeChord(t, transposeSemitones || 0));
    });
  });
  return Array.from(found);
}

// One [Chord]word segment -> its rendered <span class="cw">...</span> -
// pulled out of renderChart() so the chord-tap/data-chord wiring for the
// popover (see CHORD DIAGRAMS below) lives in exactly one place for this
// format.
function chordCellHtml_(seg, transposeSemitones) {
  if (!seg.chord) return `<span class="cw">${escapeHtml(seg.text)}</span>`;
  const rawTransposed = transposeChord(seg.chord, transposeSemitones);
  return `<span class="cw"><span class="chord chord-tap" data-chord="${escapeHtml(rawTransposed)}">${escapeHtml(formatChordSymbol(rawTransposed))}</span>${escapeHtml(seg.text)}</span>`;
}
function renderChart(chordsLyrics, transposeSemitones) {
  if (isHtmlChordFormat(chordsLyrics)) return renderChordHtmlBody(chordsLyrics, transposeSemitones);
  const lines = String(chordsLyrics || '').split('\n');
  return lines.map(line => {
    if (line.trim() === '') return '<div class="chord-line">&nbsp;</div>';
    const segs = parseChordLine(line);
    const html = segs.map(seg => chordCellHtml_(seg, transposeSemitones)).join('');
    return `<div class="chord-line">${html}</div>`;
  }).join('');
}

function chordsUsedIn(chordsLyrics, transposeSemitones) {
  if (isHtmlChordFormat(chordsLyrics)) return extractChordTokensFromHtml(chordsLyrics, transposeSemitones);
  const found = new Set(); const re = /\[([^\]]+)\]/g; let m;
  while ((m = re.exec(chordsLyrics || ''))) found.add(transposeChord(m[1], transposeSemitones));
  return Array.from(found);
}

/* ============================================================
   CHORD DIAGRAMS — a small fretboard picture shown when a chord symbol
   in a chart is moused over (desktop) or tapped (touch), so someone who
   doesn't already know a chord by name can see how to play it without
   leaving the song.

   Every chord symbol rendered by renderChart() (both chart formats - see
   chordCellHtml_ and renderFixedChordRow_ above) gets class="chord-tap"
   plus a data-chord="<plain chord text>" attribute; a single pair of
   delegated listeners near the bottom of this file shows/hides one
   floating popover built by chordDiagramPopoverHtml() below.

   Two sources of shapes, in order of preference:
   1. OPEN_CHORD_SHAPES - a small hand-picked dictionary of genuine open-
      position voicings for the most common natural-root chords (the
      familiar textbook shapes players expect to see for C/D/E/A/G).
   2. For every other chord (any root not in that dictionary, or a
      quality like sus4/maj7/m7 on a root that isn't), a correct MOVABLE
      barre shape computed from the two universal "E-shape" and "A-shape"
      templates below (the same shapes every guitarist already uses to
      play, say, F or Bm) - transposed along the neck by simple interval
      math from the open-position reference, so any of these qualities on
      any root gets a real, correctly-fingered diagram instead of nothing.
   When a chord's quality is too specialized to safely generalize this way
   (dim, aug, 6, 9, add9, and similar), this falls back to the plain
   major/minor triad for that root and says so in a small caption under
   the diagram, rather than asserting a specific voicing that hasn't
   actually been verified.
   ============================================================ */

// [string6(low E) ... string1(high e)] - -1 = muted, 0 = open, N = fret N.
// Deliberately limited to shapes that are genuinely standard open-position
// (no barre) voicings, so nothing in this dictionary is a guess.
const OPEN_CHORD_SHAPES = {
  'C_major':  [-1,3,2,0,1,0],
  'C_dom7':   [-1,3,2,3,1,0],
  'C_maj7':   [-1,3,2,0,0,0],
  'D_major':  [-1,-1,0,2,3,2],
  'D_minor':  [-1,-1,0,2,3,1],
  'D_dom7':   [-1,-1,0,2,1,2],
  'D_maj7':   [-1,-1,0,2,2,2],
  'D_min7':   [-1,-1,0,2,1,1],
  'E_major':  [0,2,2,1,0,0],
  'E_minor':  [0,2,2,0,0,0],
  'E_dom7':   [0,2,0,1,0,0],
  'E_maj7':   [0,2,1,1,0,0],
  'E_min7':   [0,2,0,0,0,0],
  'A_major':  [-1,0,2,2,2,0],
  'A_minor':  [-1,0,2,2,1,0],
  'A_dom7':   [-1,0,2,0,2,0],
  'A_maj7':   [-1,0,2,1,2,0],
  'A_min7':   [-1,0,2,0,1,0],
  'G_major':  [3,2,0,0,0,3],
  'G_dom7':   [3,2,0,0,0,1],
  'G_maj7':   [3,2,0,0,0,2],
};

// Movable templates at their own natural open position (barre fret 0) -
// each entry doubles as that shape's real open chord (E major/minor/7/m7/
// maj7/sus4; A major/minor/7/m7/maj7/sus4/sus2), and is shifted up the neck
// by simple semitone math in computeChordFrets() below for every other root.
const E_SHAPE_QUALITIES = {
  major: [0,2,2,1,0,0], minor: [0,2,2,0,0,0], dom7: [0,2,0,1,0,0],
  min7: [0,2,0,0,0,0], maj7: [0,2,1,1,0,0], sus4: [0,2,2,2,0,0],
};
const A_SHAPE_QUALITIES = {
  major: [-1,0,2,2,2,0], minor: [-1,0,2,2,1,0], dom7: [-1,0,2,0,2,0],
  min7: [-1,0,2,0,1,0], maj7: [-1,0,2,1,2,0], sus4: [-1,0,2,2,3,0], sus2: [-1,0,2,2,0,0],
};
const CHORD_QUALITY_LABELS = { major: '', minor: 'm', dom7: '7', min7: 'm7', maj7: 'maj7', sus2: 'sus2', sus4: 'sus4' };

// Reduces an arbitrary chord-quality suffix (everything after the root,
// e.g. "m7", "maj9", "dim7", "sus", "add9") down to one of the 7 keys this
// file actually has shapes for, and flags whether that's the chord's real
// quality (exact) or the closest simple stand-in for something more
// specialized this app doesn't have a verified shape for (not exact).
// Ordered most-specific-pattern-first throughout, since e.g. "maj7" and
// "m7" both start with "m"-ish text and must be told apart before falling
// through to the bare-minor/dominant-7 checks.
function classifyChordQuality(rest) {
  const s = String(rest || '').toLowerCase().trim();
  if (/^(maj7|major7|ma7|δ7)/.test(s)) return { key: 'maj7', exact: true };
  if (/^(maj9|maj11|maj13)/.test(s)) return { key: 'maj7', exact: false };
  if (/^(m7b5|m7-5|ø|mib5)/.test(s)) return { key: 'min7', exact: false };
  if (/^(m(in)?maj7)/.test(s)) return { key: 'min7', exact: false };
  if (/^(m(in)?7)/.test(s)) return { key: 'min7', exact: true };
  if (/^(m(in)?6)/.test(s)) return { key: 'minor', exact: false };
  if (/^(m(in)?9|m(in)?11|m(in)?13|madd9)/.test(s)) return { key: 'min7', exact: false };
  if (/^(m(in)?)(?!aj)/.test(s)) return { key: 'minor', exact: true };
  if (/^(dim7|dim|°|o\b)/.test(s)) return { key: 'minor', exact: false };
  if (/^(aug|\+)/.test(s)) return { key: 'major', exact: false };
  if (/^sus2/.test(s)) return { key: 'sus2', exact: true };
  if (/^(sus4|sus)/.test(s)) return { key: 'sus4', exact: true };
  if (/^(6\/9|69|6)/.test(s)) return { key: 'major', exact: false };
  if (/^(7sus4|7sus)/.test(s)) return { key: 'sus4', exact: false };
  if (/^7/.test(s)) return { key: 'dom7', exact: (s === '7') };
  if (/^(9|11|13)/.test(s)) return { key: 'dom7', exact: false };
  if (/^(add9|add11|2|4)$/.test(s)) return { key: 'major', exact: false };
  if (s === '' || s === 'maj' || s === 'major') return { key: 'major', exact: true };
  return { key: 'major', exact: false };
}

// Shifts the E-shape/A-shape template for `qualityKey` up the neck so its
// root lands on `rootSemitone` (0=C ... 11=B, matching NOTES_SHARP's
// indexing) - the exact same interval math every guitarist uses to turn,
// say, the open-E-shape barre chord into F (root E -> F is 1 semitone, so
// barre fret 1) or Gm (E-shape minor, root E -> G is 3 semitones, barre
// fret 3). Returns whichever of the two available shapes lands at the
// lower (closer to the nut, easier to diagram clearly) barre fret.
function computeChordFrets(rootSemitone, qualityKey) {
  const eTpl = E_SHAPE_QUALITIES[qualityKey];
  const aTpl = A_SHAPE_QUALITIES[qualityKey];
  const candidates = [];
  if (eTpl) {
    const b = ((rootSemitone - 4) % 12 + 12) % 12; // E's own open root = E = semitone 4
    candidates.push({ shape: 'E', b, frets: eTpl.map(v => v < 0 ? -1 : v + b), barreFrom: 0, barreTo: 5 });
  }
  if (aTpl) {
    const b = ((rootSemitone - 9) % 12 + 12) % 12; // A's own open root = A = semitone 9
    candidates.push({ shape: 'A', b, frets: aTpl.map(v => v < 0 ? -1 : v + b), barreFrom: 1, barreTo: 5 });
  }
  if (!candidates.length) return null;
  candidates.sort((x, y) => x.b - y.b);
  return candidates[0];
}

// chordName is plain text (e.g. "G#7", "Bbm", "C/E") - the same form
// data-chord carries, never the display-formatted "♭"/<sup> version.
function chordDiagramData(chordName) {
  const m = String(chordName || '').match(/^([A-Ga-g])(#|b)?(.*)$/);
  if (!m) return null;
  const rootLetter = m[1].toUpperCase();
  const acc = m[2] || '';
  const rest = (m[3] || '').replace(/\/[A-Ga-g](#|b)?$/i, ''); // a slash bass note doesn't change the shape shown
  const rootFull = rootLetter + acc;
  const rootSemitone = noteIndex(rootFull);
  if (rootSemitone < 0) return null;
  const q = classifyChordQuality(rest);
  const openShape = OPEN_CHORD_SHAPES[rootFull + '_' + q.key];
  if (openShape) return { frets: openShape, baseFret: 0, barre: null, exact: q.exact, quality: q.key, rootFull };
  const computed = computeChordFrets(rootSemitone, q.key);
  if (!computed) return null; // shouldn't happen - every classifyChordQuality key has template coverage in at least one shape
  return {
    frets: computed.frets, baseFret: computed.b,
    barre: computed.b > 0 ? { from: computed.barreFrom, to: computed.barreTo, fret: computed.b } : null,
    exact: q.exact, quality: q.key, rootFull,
  };
}

// A small fretboard SVG: 6 strings x 4 fret cells, muted (✕) / open (○)
// marks above the nut, filled dots for fretted notes, and a barre bar when
// the shape needs one. `displayBase` is the fret shown in the TOP cell -
// fret 1 for an open-position chord (fret 0/open is drawn above the nut,
// not in a cell), or the barre fret itself for a movable shape (whose
// barre notes then sit in the top cell, right where the barre bar is).
function chordDiagramSvg(chordName) {
  const data = chordDiagramData(chordName);
  if (!data) return '';
  const frets = data.frets, b = data.baseFret;
  const displayBase = b === 0 ? 1 : b;
  const rows = 4, topY = 16, cellH = 18;
  const stringX = i => 14 + i * 14.4;
  let svg = `<svg viewBox="0 0 100 ${topY + rows * cellH + 10}" width="92" xmlns="http://www.w3.org/2000/svg">`;
  for (let r = 0; r <= rows; r++) {
    const y = topY + r * cellH;
    const isNut = (r === 0 && b === 0);
    svg += `<line x1="${stringX(0)}" y1="${y}" x2="${stringX(5)}" y2="${y}" stroke="#333" stroke-width="${isNut ? 3 : 1}"/>`;
  }
  for (let i = 0; i < 6; i++) {
    svg += `<line x1="${stringX(i)}" y1="${topY}" x2="${stringX(i)}" y2="${topY + rows * cellH}" stroke="#333" stroke-width="1"/>`;
  }
  if (b > 0) svg += `<text x="${stringX(0) - 9}" y="${topY + cellH * 0.7}" font-size="9" fill="#333" text-anchor="end">${b}fr</text>`;
  if (data.barre) {
    const y = topY + cellH / 2;
    svg += `<line x1="${stringX(data.barre.from)}" y1="${y}" x2="${stringX(data.barre.to)}" y2="${y}" stroke="var(--chord,#c0392b)" stroke-width="7" stroke-linecap="round" opacity="0.85"/>`;
  }
  frets.forEach((v, i) => {
    const x = stringX(i);
    if (v === -1) svg += `<text x="${x}" y="${topY - 5}" font-size="9" fill="#888" text-anchor="middle">✕</text>`;
    else if (v === 0) svg += `<circle cx="${x}" cy="${topY - 7}" r="3.2" fill="none" stroke="#333" stroke-width="1.4"/>`;
    else {
      const row = v - displayBase;
      const y = topY + row * cellH + cellH / 2;
      svg += `<circle cx="${x}" cy="${y}" r="4.6" fill="var(--chord,#c0392b)"/>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function chordDiagramPopoverHtml(chordName) {
  const data = chordDiagramData(chordName);
  const label = formatChordSymbol(chordName);
  if (!data) return `<div class="chord-diagram-pop"><div class="chord-diagram-name">${escapeHtml(label)}</div><div class="muted" style="font-size:11px;">No diagram available</div></div>`;
  const svg = chordDiagramSvg(chordName);
  const note = data.exact ? '' : `<div class="chord-diagram-note">shown as ${escapeHtml(data.rootFull)}${CHORD_QUALITY_LABELS[data.quality] || ''} (closest simple shape)</div>`;
  return `<div class="chord-diagram-pop"><div class="chord-diagram-name">${escapeHtml(label)}</div>${svg}${note}</div>`;
}

// A single reusable floating element (not one popover per chord symbol),
// shown on mouseover/click of any .chord-tap and positioned next to
// whichever one triggered it. Works for both hover (desktop) and tap
// (touch, via the click listener) per the two interaction modes asked for.
let chordPopoverEl = null;
let chordPopoverOpenFor = null;
function showChordPopover(target, chordName) {
  hideChordPopover();
  const html = chordDiagramPopoverHtml(chordName);
  if (!html) return;
  const el = document.createElement('div');
  el.className = 'chord-diagram-popover';
  el.innerHTML = html;
  document.body.appendChild(el);
  const rect = target.getBoundingClientRect();
  const popRect = el.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - popRect.width / 2;
  left = Math.max(6, Math.min(left, window.innerWidth - popRect.width - 6));
  let top = rect.top - popRect.height - 8;
  if (top < 4) top = rect.bottom + 8; // flip below if it would go off the top of the screen
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  chordPopoverEl = el;
  chordPopoverOpenFor = target;
}
function hideChordPopover() {
  if (chordPopoverEl) { chordPopoverEl.remove(); chordPopoverEl = null; }
  chordPopoverOpenFor = null;
}
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest && e.target.closest('.chord-tap');
  if (t && t.dataset.chord) showChordPopover(t, t.dataset.chord);
});
document.addEventListener('mouseout', (e) => {
  const t = e.target.closest && e.target.closest('.chord-tap');
  if (t && chordPopoverOpenFor === t) hideChordPopover();
});
document.addEventListener('click', (e) => {
  const t = e.target.closest && e.target.closest('.chord-tap');
  if (t && t.dataset.chord) {
    e.stopPropagation();
    if (chordPopoverOpenFor === t) hideChordPopover(); else showChordPopover(t, t.dataset.chord);
    return;
  }
  hideChordPopover();
});



/* ============================================================
   PRINT PREVIEW
   ============================================================
   window.print() used to fire directly on the live detail page, so it
   printed the whole app chrome (nav, tiles, advanced panel, YouTube embed,
   everything) along with the chart. This instead builds a dedicated
   full-screen preview showing only a title/artist/capo header + the chart,
   with its own font/columns/capo/transpose controls - completely separate
   from the live playerState, so previewing for print never disturbs
   whatever the person was doing on the detail page underneath it. Actual
   printing still uses window.print(); the @media print CSS above hides
   everything on the page except this overlay's printable content. */
let printPreviewState = null; // { songId, fontSize, bold, columns, rtl, capo, transpose }

function openPrintPreview(songId) {
  const song = songs.find(s => s.id === songId);
  if (!song) return;
  if (song.chords_lyrics === undefined) { alert('Still loading this song’s chart — try Print again in a moment.'); return; }
  const sameSong = playerState.songId === songId;
  printPreviewState = {
    songId,
    fontSize: sameSong ? (playerState.fontSize||0) : 0,
    bold: sameSong ? !!playerState.bold : false,
    columns: 1,
    // Default the RTL-columns toggle on for a song whose chart or Hebrew
    // title actually contains Hebrew/Yiddish text, rather than making
    // every print start from the same LTR default regardless of language.
    rtl: containsHebrew(song.chords_lyrics) || containsHebrew(song.title_hebrew),
    capo: sameSong ? playerState.capo : (song.capo||0),
    transpose: sameSong ? (playerState.transpose||0) : 0
  };
  renderPrintPreview();
}
function updatePrintPreview(patch) {
  if (!printPreviewState) return;
  Object.assign(printPreviewState, patch);
  renderPrintPreview();
}
function closePrintPreview() {
  const el = document.getElementById('printPreviewOverlay');
  if (el) el.remove();
  document.removeEventListener('keydown', printPreviewEscHandler_);
  printPreviewState = null;
}
function printPreviewEscHandler_(e) { if (e.key === 'Escape') closePrintPreview(); }
// Groups the chart's line-divs into break-inside:avoid-column wrappers so a
// 2-column layout never splits a chord row from the lyric row right below
// it (the imported-HTML chart format renders those as two separate
// sibling divs - see renderChordHtmlBody above). The bracket-notation
// format already keeps chord+lyric in one div per line, so this just wraps
// each line singly there, which is harmless.
function wrapChartForPrint(chartHtml) {
  const container = document.createElement('div');
  container.innerHTML = chartHtml;
  const children = Array.from(container.children);
  let out = '';
  for (let i = 0; i < children.length; i++) {
    const el = children[i];
    const next = children[i + 1];
    if (el.classList.contains('html-chord-row') && next && next.classList.contains('html-lyric-row')) {
      out += `<div class="print-line-group">${el.outerHTML}${next.outerHTML}</div>`;
      i++;
    } else {
      out += `<div class="print-line-group">${el.outerHTML}</div>`;
    }
  }
  return out;
}
function renderPrintPreview() {
  const st = printPreviewState;
  if (!st) return;
  const song = songs.find(s => s.id === st.songId);
  if (!song) { closePrintPreview(); return; }
  const transposeSemitones = (song.capo||0) - st.capo + (st.transpose||0);
  const chartHtml = wrapChartForPrint(renderChart(song.chords_lyrics, transposeSemitones));
  const existing = document.getElementById('printPreviewOverlay');
  if (existing) existing.remove();
  document.removeEventListener('keydown', printPreviewEscHandler_);
  document.addEventListener('keydown', printPreviewEscHandler_);
  const el = document.createElement('div');
  el.className = 'print-preview-overlay';
  el.id = 'printPreviewOverlay';
  el.innerHTML = `
    <div class="print-preview-toolbar no-print">
      <div class="ppt-row">
        <span class="ppt-label">Font</span>
        <button class="stepper-btn" onclick="updatePrintPreview({fontSize:Math.max(-4,printPreviewState.fontSize-1)})">A&#8595;</button>
        <span class="ppt-val">${17 + st.fontSize}</span>
        <button class="stepper-btn" onclick="updatePrintPreview({fontSize:Math.min(8,printPreviewState.fontSize+1)})">A&#8593;</button>

// ------------------------------------------------------------------
// "Simple" chord authoring: type a chord line, then the lyric line
// right below it — the same shape as writing it out on paper — and
// this auto-builds the same <p class="red">/<p class="black"> HTML
// pairs the app already reads (see isHtmlChordFormat above). This
// replaces needing Word / an HTML converter / a macro to produce that
// format by hand. A line "looks like a chord line" only if EVERY
// token on it is chord-shaped, so ordinary lyric lines (Hebrew or
// English) essentially never get mistaken for one.
const CHORD_QUALITIES = ['maj13','maj11','maj9','maj7','maj','min13','min11','min9','min7','min',
  'dim7','dim','aug','sus4','sus2','sus','add13','add11','add9','add','m7b5','m9','m7','m6','m11','m13','m',
  '13','11','9','7','6','5','4','2'];
const CHORD_TOKEN_RE = new RegExp('^[A-G](#|b|♯|♭)?(' + CHORD_QUALITIES.join('|') + ')?(\\/[A-G](#|b|♯|♭)?)?$');
const CHORD_LINE_SPECIAL_RE = /^(%|-{1,2}|N\.?C\.?|x\d+)$/i;
function isChordToken(tok) { return CHORD_TOKEN_RE.test(tok) || CHORD_LINE_SPECIAL_RE.test(tok); }
function looksLikeChordLine(line) {
  const t = line.trim();
  if (!t) return false;
  const tokens = t.split(/\s+/);
  return tokens.length > 0 && tokens.every(isChordToken);
}
function buildChordHtmlFromPlainText(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim() === '') { out.push('<p class="black">&nbsp;</p>'); continue; }
    if (looksLikeChordLine(line)) {
      out.push(`<p class="red">${escapeHtml(line)}</p>`);
      if (i + 1 < lines.length) {
        const next = lines[i + 1];
        out.push(`<p class="black">${next.trim() === '' ? '&nbsp;' : escapeHtml(next)}</p>`);
        i++;
      }
      continue;
    }
    out.push(`<p class="black">${escapeHtml(line)}</p>`);
  }
  return out.join('');
}
function htmlChordFormatToPlainText(html) {
  const container = document.createElement('div');
  container.innerHTML = html;
  const lines = Array.from(container.querySelectorAll('p')).map(p => (p.textContent || '').replace(/ /g, ' '));
  return lines.join('\n');
}

// Categories in the sheet are a single comma list mixing "language" values
// (Lashon Hakodesh, English, Yiddish…) with topical tags (Shabbos, Wedding…).
// This is how the original database stores them too — split for display.
const LANGUAGE_VALUES = ['Lashon Hakodesh','English','Hebrew - General','Yiddish','Hebrew - Torah Theme','Aramaic','Russian','French','Italian','Spanish','Ladino','Ukrainian'];
function splitCategories(cats) {
  const list = cats || [];
  const language = list.find(c => LANGUAGE_VALUES.includes(c)) || '';
  const tags = list.filter(c => c !== language);
  return { language, tags };
}

// A song's "artist" field is stored as one string, but can list more than
// one artist separated by commas (e.g. "Artist A, Artist B") - split that
// into individual names so each artist can be browsed/filtered on its own,
// with the song showing up under every one of them.
function splitArtists(artist) {
  return String(artist || '').split(',').map(a => a.trim()).filter(Boolean);
}
// Renders a song's artist field as clickable name(s) — same "filter the
// Songs list to this artist" behavior as the Artists tab's chips — so
// tapping an artist on a song's detail page jumps to all of their songs.
function artistLinksHtml(artist) {
  const names = splitArtists(artist);
  if (!names.length) return '';
  return names.map(a => `<span class="backlink" onclick="event.stopPropagation();songTab='all';filters.artist='${a.replace(/'/g,"\\'")}';songListPage=0;goTo('list')">${escapeHtml(a)}</span>`).join(', ');
}

function extractYouTubeId(url) {
  if (!url) return null;
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? m[1] : null;
}

const COMMON_CHORDS = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B','Cm','Dm','Em','Fm','Gm','Am','Bm','C7','D7','E7','F7','G7','A7','B7'];

// Renders a chord name for display with any trailing quality digits (the "7"
// in "C7", "D7", etc.) as a superscript, e.g. C<sup>7</sup> — purely
// cosmetic, so escapeHtml runs first and the sup tag is added after.
function formatChordLabel(c) {
  return escapeHtml(formatChordSymbol(c)).replace(/(\d+)$/, '<sup>$1</sup>');
}

/* ============================================================
   NAVIGATION
   ============================================================ */
// Mirrors the current `view` to localStorage (see loadViewCache, used at
// INIT below) purely so a page reload — including a mobile
// pull-to-refresh, which is just a full page reload — can reopen whatever
// page you were actually on instead of always landing back on Home. Every
// render function already tolerates its data not being loaded yet (songs/
// playlists arrive asynchronously after sign-in), showing a brief "not
// found yet"-style placeholder that self-corrects once that data arrives.
const VIEW_CACHE_KEY = 'jgc_view_cache_v1';
function saveViewCache(v) {
  try { localStorage.setItem(VIEW_CACHE_KEY, JSON.stringify(v)); } catch (e) {}
}
function loadViewCache() {
  try {
    const raw = localStorage.getItem(VIEW_CACHE_KEY);
    const v = raw ? JSON.parse(raw) : null;
    return (v && typeof v.name === 'string') ? v : null;
  } catch (e) { return null; }
}
function goTo(name, extra) {
  // Leaving the Tuner page: always release the microphone rather than
  // leaving it listening in the background on whatever screen comes next.
  if (view.name === 'tuner' && name !== 'tuner' && typeof stopTunerSilently_ === 'function') stopTunerSilently_();
  if (typeof hideChordPopover === 'function') hideChordPopover();
  view = Object.assign({ name }, extra || {});
  saveViewCache(view);
  pushViewHistory_(view);
  render();
  window.scrollTo(0,0);
}
// Makes a phone's native Back button (and a desktop browser's Back button)
// step back through whichever screens were actually visited inside the
// app, instead of exiting/closing the tab the moment it's pressed - which
// is what happened before, since goTo() never touched browser history at
// all, so there was nothing on the history stack for Back to land on.
// Every navigation in this file goes through goTo() (nowhere else
// reassigns `view`), so one pushState per real navigation here is enough
// to cover the whole app. The popstate handler below restores whichever
// `view` the browser stepped back (or forward) to directly - NOT via
// goTo(), which would push a fresh entry and corrupt the very stack
// popstate is walking.
function pushViewHistory_(v) {
  try {
    const cur = history.state && history.state.jgcView;
    if (cur && JSON.stringify(cur) === JSON.stringify(v)) return; // not a real navigation (e.g. tapping the same tab twice) - don't grow the stack
    history.pushState({ jgcView: v }, '');
  } catch (e) {}
}
window.addEventListener('popstate', (e) => {
  closeModal(); // don't leave a modal floating over a screen it was never opened on
  if (view.name === 'tuner' && typeof stopTunerSilently_ === 'function') stopTunerSilently_();
  if (typeof hideChordPopover === 'function') hideChordPopover();
  if (!e.state || !e.state.jgcView) return; // stepped past the app's own history (or it isn't seeded yet) - let that happen normally, e.g. actually exiting
  view = e.state.jgcView;
  render();
  window.scrollTo(0,0);
});

// Shared by the desktop top nav and the mobile bottom tab bar so the two
// never drift out of sync. 'Home' is deliberately not a tab — the header
// title already goes home when clicked (onclick="goTo('home')" above), so a
// separate tab would just be a redundant second way to do the same thing.
function navTabs() {
  const tabs = [['list','Songs'],['artists','Artists'],['categories','Categories'],['playlists','Playlists'],['contact','Contact']];
  if (effectiveIsAdmin()) tabs.push(['admin','Admin']);
  return tabs;
}
function renderNav() {
  const nav = document.getElementById('mainNav');
  if (!currentUser) { nav.innerHTML = ''; return; }
  nav.innerHTML = navTabs().map(([name,label]) => {
    const icon = SVG_ICONS[name] || '';
    return `<button class="${view.name===name?'active':''}" onclick="goTo('${name}')">${icon}${label}</button>`;
  }).join('');
}
// Mobile-only fixed tab bar (see .bottom-nav CSS) — same tabs as renderNav,
// laid out icon-over-label instead of icon-before-label. Same plain-line
// SVG_ICONS as the top nav (both now sit on a solid teal bar with white
// icons), so the two stay visually consistent.
function renderBottomNav() {
  const el = document.getElementById('bottomNav');
  if (!el) return;
  if (!currentUser) { el.innerHTML = ''; return; }
  el.innerHTML = navTabs().map(([name,label]) => {
    const icon = SVG_ICONS[name] || '';
    return `<button class="${view.name===name?'active':''}" onclick="goTo('${name}')"><span class="nav-icon-wrap">${icon}</span><span>${label}</span></button>`;
  }).join('');
}
function openMobileDrawer() { document.getElementById('mobileDrawer').classList.add('open'); }

/* ============================================================
   PWA INSTALL PROMPT — a custom banner (instead of leaving this to
   whatever the browser does on its own, which varies a lot): a real
   "Install App" button on Android/Chrome, or manual Share-sheet
   instructions on iOS (Safari never fires beforeinstallprompt, so there's
   no programmatic install to offer there). Dismissing it only hides it for
   this visit — this app deliberately keeps no state in localStorage/
   sessionStorage (see the STATE comment above) — so it can reappear next time.
   ============================================================ */
let deferredInstallPrompt = null;
let installBannerDismissed = false;
function isStandaloneDisplay() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function isIosDevice() { return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
function showInstallBanner(kind) {
  if (installBannerDismissed || isStandaloneDisplay()) return;
  const el = document.getElementById('installBanner');
  if (!el) return;
  const msg = kind === 'ios'
    ? 'Install this app: tap <b>Share</b>, then <b>Add to Home Screen</b>.'
    : 'Install this app on your device for quick, full-screen access.';
  el.innerHTML = `<span>${msg}</span><span style="display:flex;align-items:center;gap:6px">${kind === 'android' ? `<button class="btn" onclick="installAppClick()">Install App</button>` : ''}<button class="install-banner-close" onclick="hideInstallBanner()" aria-label="Dismiss">✕</button></span>`;
  el.classList.add('show');
}
function hideInstallBanner() {
  installBannerDismissed = true;
  const el = document.getElementById('installBanner');
  if (el) { el.classList.remove('show'); el.innerHTML = ''; }
}
function installAppClick() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => { deferredInstallPrompt = null; hideInstallBanner(); });
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner('android');
});
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; hideInstallBanner(); });
// A registered service worker (even one that does no caching of its own) is
// part of Android Chrome's installability criteria — without one, Chrome
// can decline to fire beforeinstallprompt, or the "Install" action can fail
// to actually create a home-screen shortcut.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
if (isIosDevice() && !isStandaloneDisplay()) showInstallBanner('ios');

   HOME — the landing page with a tile for each section

// Icons for the Home tiles are the same plain-line SVG_ICONS glyphs used by

/* ============================================================
   SONGS LIST (All / Favorites / Known Songs)
   ============================================================ */
// While admin is "viewing as" another user, every favorites/known-chords
// read in the app should reflect THAT user's data instead of the signed-in
// admin's own — these two helpers are the single place that decides which
// set is "in effect" right now. Writes made while viewAsUser is set (see
// viewAsFields()/refreshAfterWrite() above) mutate this same data in place.
function effectiveFavorites() { return viewAsUser ? (viewAsData.favorites || []) : favorites; }
function effectiveKnownChords() { return viewAsUser ? (viewAsData.knownChords || []) : knownChords; }
function effectiveRequests() { return viewAsUser ? (viewAsData.requests || []) : contactRequestsCache; }
function effectiveMessages() { return viewAsUser ? (viewAsData.messages || []) : contactMessagesCache; }
// Whether admin-only UI (the Admin nav tab, Edit/Delete controls) should show
// right now — false while "View As" is active, even though the signed-in
// admin account itself is still an admin, since the whole point of View As
// is to see the app exactly as that (non-admin) user does.
function effectiveIsAdmin() { return !viewAsUser && !!(currentUser && currentUser.isAdmin); }
// While "View As" is active, a write (favoriting a song, saving known
// chords, a playlist, a song request, a chat message) should be attributed
// to the impersonated user, not the admin doing the impersonating — merge
// this into the payload of any such write so the backend does that.
function viewAsFields() { return viewAsUser ? { target_email: viewAsUser.email, target_name: viewAsUser.name, view_as: true } : {}; }
// After a write (currently: sendMessage/createRequest, neither of which
// touches songs or playlists), refresh whatever that write could actually
// have changed: the impersonated user's own snapshot during View As, or
// nothing at all otherwise - renderContact() (the only caller) already
// re-fetches requests/messages itself in the non-View-As case, so there was
// never anything here for it to depend on.
//
// This used to unconditionally call loadSongs(false) first - a full
// re-fetch of the ENTIRE song catalog plus every playlist (and, under
// Supabase, every playlist's playlist_songs rows), on every single chat
// message or song request, regardless of View As. That was free-ish on the
// old Apps Script backend (server-side cache), so it went unnoticed; it is
// not free at all against Supabase, and was a real contributor to "everything
// takes forever" - see refreshPlaylistsOnly() above for the same fix already
// made for playlist edits.
function refreshAfterWrite() {
  if (!viewAsUser) return Promise.resolve();
  return api('getUserSnapshot', { target_email: viewAsUser.email }).then(data => {
    viewAsData = { favorites: data.favorites || [], knownChords: data.knownChords || [], playlists: data.playlists || [], requests: data.requests || [], messages: data.messages || [] };
  });
}

// Playlist edits (create/add/remove/delete song, rename, etc.) only ever
// change playlist data, never the song catalog - this re-fetches only
// that, rather than the whole catalog too (refreshAfterWrite() above used
// to do exactly that, for the same kind of reason, before it was fixed).
function refreshPlaylistsOnly() {
  if (viewAsUser) {
    return api('getUserSnapshot', { target_email: viewAsUser.email }).then(data => {
      viewAsData = { favorites: data.favorites || [], knownChords: data.knownChords || [], playlists: data.playlists || [], requests: data.requests || [], messages: data.messages || [] };
    });
  }
  return api('getPlaylists', {}).then(pl => { playlists = pl.playlists || []; });
}
// Every createPlaylist/updatePlaylist call already returns that one
// playlist, fully hydrated - patching it straight into the local
// playlists/viewAsData arrays reflects the edit with zero extra requests.
// Saving a single playlist edit used to call refreshPlaylistsOnly() above
// instead, which re-fetches and re-hydrates EVERY playlist visible to this
// user (all of them, for an admin - hundreds) just to show one change; that
// full-list reload was why pressing Save on a playlist could "take a long
// time". deletePlaylist has no such response to patch in, so its own
// callers just splice the known id out locally (removePlaylistLocally_).
function applyPlaylistPatch_(playlist) {
  if (!playlist) return;
  const list = viewAsUser ? (viewAsData && viewAsData.playlists) : playlists;
  if (!list) return;
  const idx = list.findIndex(p => p.id === playlist.id);
  if (idx >= 0) list[idx] = playlist; else list.push(playlist);
}
function removePlaylistLocally_(id) {
  const list = viewAsUser ? (viewAsData && viewAsData.playlists) : playlists;
  if (!list) return;
  const idx = list.findIndex(p => p.id === id);
  if (idx >= 0) list.splice(idx, 1);
}

function songKnown(song) {
  // chords_used comes precomputed from the server on every 'list' call (see
  // Code.gs) so this never has to wait on the full-corpus listContent fetch;
  // falls back to computing it client-side only for a song that somehow
  // lacks it (e.g. a very stale cached catalog from before this shipped).
  const used = song.chords_used || chordsUsedIn(song.chords_lyrics, 0);
  if (used.length === 0) return false;
  return used.every(c => effectiveKnownChords().includes(c));
}

// "New" window shared by the New Songs tab filter and the NEW badge shown
// on song rows everywhere else (All Songs, Favorites, Known Songs,
// playlists, search) — one constant so both stay in sync.
const NEW_SONG_WINDOW_MS = 30 * 24 * 60 * 60 * 1000;
function songAgeMs(s) { return s.date_added ? (Date.now() - new Date(s.date_added).getTime()) : null; }
function isNewSong(s) { const age = songAgeMs(s); return age !== null && age >= 0 && age <= NEW_SONG_WINDOW_MS; }
function songDaysAgoLabel(s) {
  const age = songAgeMs(s);
  if (age === null) return '';
  const days = Math.floor(age / (24 * 60 * 60 * 1000));
  if (days <= 0) return 'today';
  if (days === 1) return '1 day ago';
  return `${days} days ago`;
}

function filteredSongs() {
  let list = songs.filter(s => {
    const { language, tags } = splitCategories(s.categories);
    if (filters.artist && !splitArtists(s.artist).includes(filters.artist)) return false;
    if (filters.language && language !== filters.language) return false;
    if (filters.tag && !tags.includes(filters.tag)) return false;
    if (filters.q) {
      const q = filters.q.toLowerCase();
      const inLyrics = (s.lyrics_only || '').toLowerCase().includes(q);
      if (!(s.title||'').toLowerCase().includes(q) && !(s.title_hebrew||'').includes(filters.q) && !(s.artist||'').toLowerCase().includes(q) && !inLyrics) return false;
    }
    return true;
  });
  if (songTab === 'favorites') list = list.filter(s => effectiveFavorites().includes(s.id));
  if (songTab === 'known') list = list.filter(songKnown);
  if (songTab === 'new') {
    list = list.filter(isNewSong);
    return list.sort((a,b) => new Date(b.date_added) - new Date(a.date_added));
  }
  if (songTab === 'favorites' && favoritesReorderable()) {
    // Preserve the user's own custom drag order (see reorderFavorites in
    // Code.gs) instead of the usual alphabetical sort — only when viewing
    // the plain, unfiltered Favorites tab (see favoritesReorderable): a
    // search/filter within Favorites still sorts alphabetically, since a
    // partial view isn't something "reorder" meaningfully applies to.
    const favOrder = effectiveFavorites();
    return list.slice().sort((a,b) => favOrder.indexOf(a.id) - favOrder.indexOf(b.id));
  }
  return list.sort((a,b) => String(a.title||'').localeCompare(String(b.title||'')));
}
// True only for the plain Favorites tab view — signed in, no active
// search/artist/language/tag filter — which is exactly when custom drag
// order applies and drag handles are shown (see renderSongListBody).
function favoritesReorderable() {
  return songTab === 'favorites' && !!currentUser && !filters.q && !filters.artist && !filters.language && !filters.tag;
}

// Builds the goTo(...) call for opening a song. When queueIds is given (the
// full ordered list of song ids the row came from — a playlist, or the
// Favorites tab), the resulting view carries that queue + this song's index
// in it, so the detail page can offer Prev/Next Song within that same list.
function detailGoTo(songId, queueIds) {
  if (!queueIds) return `goTo('detail',{id:'${songId}'})`;
  const idx = queueIds.indexOf(songId);
  const arr = '[' + queueIds.map(id => `'${id}'`).join(',') + ']';
  return `goTo('detail',{id:'${songId}',queue:${arr},queueIdx:${idx}})`;
}
function songRowHtml(s, queueIds, reorderable) {

// Toggles whether the signed-in (or, during View As, impersonated) user's
// current Favorites are saved for offline viewing — see setOfflineAvailable/
// removeOfflineAvailable above.
async function toggleFavoritesOffline() {
  const btn = document.getElementById('favOfflineBtn');
  const already = await isOfflineAvailable('favorites');
  if (already) {
    if (!(await customConfirmAsync('Remove your favorites from offline storage on this device?', { title: 'Remove offline copy', confirmLabel: 'Remove', danger: true }))) return;
    await removeOfflineAvailable('favorites');
  } else {
    const ids = effectiveFavorites().slice();
    if (!ids.length) { alert('Favorite a few songs first.'); return; }
    if (!(await customConfirmAsync('Make favorites available offline on this device?', { title: 'Available Offline', confirmLabel: 'Make Available' }))) return;
    if (btn) btn.disabled = true;
    try {
      await setOfflineAvailable('favorites', 'Favorites', ids);
    } catch (e) {
      alert('Could not save offline: ' + e.message);
    }
    if (btn) btn.disabled = false;
  }
  refreshFavOfflineButton();
}
async function refreshFavOfflineButton() {
  const btn = document.getElementById('favOfflineBtn');
  if (!btn) return;
  const on = await isOfflineAvailable('favorites');
  btn.innerHTML = on ? SVG_ICONS.downloadDone : SVG_ICONS.download;
  btn.title = on ? 'Saved Offline (tap to remove)' : 'Available Offline';
  btn.setAttribute('aria-label', btn.title);
  btn.classList.toggle('active', on);
}
function renderSongListBody() {
  const body = document.getElementById('songListBody');
  if (!body) return;
  const list = filteredSongs();
  let html;
  if (list.length === 0) {
    if (filters.q && !songContentLoaded) {
      html = `<div class="empty">No matches yet — lyric search is still loading the full song text.</div>`;
    } else {
      html = `<div class="empty">${songTab==='favorites' ? (currentUser? 'No favorites yet — tap the heart on a song.' : 'Sign in to save favorites.') : songTab==='known' ? 'No songs match your known chords yet.' : songTab==='new' ? 'No new songs in the last 30 days.' : 'No songs match your search/filter.'}</div>`;
    }
  } else if (favoritesReorderable()) {
    // The whole point of drag-reordering is seeing (and rearranging) the
    // complete list at once, so this skips pagination — Favorites lists are
    // small enough that showing them all on one page is no hardship.
    const queueIds = list.map(s => s.id);
    html = `<div id="favoritesSongList">` + list.map(s => songRowHtml(s, queueIds, true)).join('') + `</div>`;
  } else {
    // Every song tab (and Artists/Categories browsing, which funnels through
    // here too via filters + goTo('list')) gets a Next/Prev-Song queue now —
    // it's just the current filtered/sorted list, same as a playlist's.
    const queueIds = list.map(s => s.id);
    html = pageSlice(list, songListPage).map(s => songRowHtml(s, queueIds)).join('') + pagerHtml(list.length, songListPage, 'changeSongPage');
  }
  body.innerHTML = html;
  if (favoritesReorderable() && list.length > 1) {
    makeReorderable(document.getElementById('favoritesSongList'), (newIds) => {
      // Optimistic local reorder — the drag already shows the new order in
      // the DOM, so just update the underlying array (View As mutates the
      // impersonated user's own snapshot, same pattern as toggleFavoriteFor)
      // and persist it; a failure re-renders from the last-known-good order.
      const favList = viewAsUser ? viewAsData.favorites : favorites;
      const prevOrder = favList.slice();
      favList.length = 0; favList.push(...newIds);
      api('reorderFavorites', Object.assign({ song_ids: newIds }, viewAsFields()))
        .catch(err => { favList.length = 0; favList.push(...prevOrder); alert(err.message); renderSongListBody(); });
    });
  }
}
function changeSongPage(p) { songListPage = p; renderSongListBody(); document.getElementById('songListBody').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

function goRandomSong() {

// Fallback for browsers without a working clipboard API: a read-only,
